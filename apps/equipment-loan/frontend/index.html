<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>精密實驗設備借用中心</title>
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-muted: #f1f5f9;
        --ink: #0f172a;
        --muted: #475569;
        --line: #e2e8f0;
        --primary: #2563eb;
        --primary-soft: #dbeafe;
        --danger: #dc2626;
        --danger-soft: #fee2e2;
        --pending: #d97706;
        --pending-soft: #fef3c7;
        --success: #16a34a;
        --success-soft: #dcfce7;
        --occupied: #64748b;
        --occupied-soft: #f1f5f9;
        --radius: 12px;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 4px 16px rgba(15, 23, 42, 0.06);
        --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      [data-theme="dark"] {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-muted: #162032;
        --ink: #f8fafc;
        --muted: #94a3b8;
        --line: #334155;
        --primary: #3b82f6;
        --primary-soft: #1e3a8a;
        --danger: #ef4444;
        --danger-soft: #7f1d1d;
        --pending: #f59e0b;
        --pending-soft: #78350f;
        --success: #22c55e;
        --success-soft: #14532d;
        --occupied: #94a3b8;
        --occupied-soft: #334155;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.35);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.6 var(--font);
        transition:
          background-color 0.15s,
          color 0.15s;
      }
      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
      }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .site-header .inner {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 16px;
        min-height: 64px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .brand {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--primary);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--primary);
        color: #ffffff;
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 700;
      }
      .site-nav {
        display: flex;
        gap: 4px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .nav-tab {
        padding: 6px 12px;
        border-radius: 8px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      .nav-tab[aria-current="page"] {
        color: var(--primary);
        background: var(--primary-soft);
        font-weight: 600;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .user-pill {
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--surface-muted);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .btn-theme,
      .btn-logout {
        height: 34px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn-theme:hover,
      .btn-logout:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 16px 96px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.3;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 17px;
      }
      .page-lead {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 42px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background-color 0.15s;
      }
      .btn-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #ffffff;
      }
      .btn-danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #ffffff;
      }
      .btn-sm {
        height: 34px;
        padding: 0 12px;
        font-size: 13px;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn-block {
        width: 100%;
      }
      .banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        padding: 12px 16px;
        border-radius: var(--radius);
        border: 1px solid transparent;
        font-size: 14px;
      }
      .banner-danger {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: var(--danger);
      }
      .banner-success {
        background: var(--success-soft);
        color: var(--success);
        border-color: var(--success);
      }
      .banner-info {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: var(--primary);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge-available {
        background: var(--success-soft);
        color: var(--success);
      }
      .badge-mine {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .badge-occupied {
        background: var(--occupied-soft);
        color: var(--occupied);
      }
      .badge-cancelled {
        background: var(--danger-soft);
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
