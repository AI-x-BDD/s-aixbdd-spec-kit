services:
  postgres:
    image: postgres:18
    container_name: equipment-loan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equipment_loan
    ports:
      - "5432:5432"
    volumes:
      - equipment_loan_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipment_loan"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  equipment_loan_pgdata:
