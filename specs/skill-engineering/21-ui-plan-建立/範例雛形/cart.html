<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>購物車｜拾日選物</title>
<style>
  /* 視覺風格（ui/plan.md 第 2 節） */
  :root {
    --bg: #F7F4EE;
    --surface: #FFFFFF;
    --ink: #23302B;
    --muted: #6B7570;
    --line: #E2DDD3;
    --primary: #2F5D50;
    --primary-soft: #E4EDE8;
    --danger: #B4442F;
    --danger-soft: #F8E7E2;
    --pending: #9A6A14;
    --pending-soft: #F6EDD9;
    --success: #2F7D4F;
    --success-soft: #E2F1E7;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(35, 48, 43, .06), 0 4px 16px rgba(35, 48, 43, .06);
    --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); }
  a { color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .site-header { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
  .site-header .inner { max-width: 1080px; margin: 0 auto; padding: 0 16px; height: 60px; display: flex; align-items: center; gap: 16px; }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: .12em; color: var(--primary); text-decoration: none; }
  .site-nav { display: flex; gap: 4px; margin-left: auto; }
  .site-nav a { padding: 6px 12px; border-radius: 999px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .site-nav a[aria-current="page"] { color: var(--primary); background: var(--primary-soft); font-weight: 600; }
  .cart-count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 12px; }
  .customer { color: var(--muted); font-size: 13px; white-space: nowrap; }
  @media (max-width: 640px) { .customer { display: none; } .site-nav a { padding: 6px 8px; } }

  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 96px; }
  h1 { margin: 0 0 16px; font-size: 24px; }
  h2 { margin: 0 0 16px; font-size: 17px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-block { width: 100%; }

  .banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 12px 16px; border-radius: var(--radius); }
  .banner-danger { background: var(--danger-soft); color: var(--danger); }

  .thumb { width: 56px; height: 56px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; color: var(--primary); }
  .thumb svg { width: 60%; height: 60%; }
  .skeleton { border-radius: 8px; background: linear-gradient(90deg, #EEEAE2 25%, #F5F2EC 50%, #EEEAE2 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .spinner { width: 18px; height: 18px; border: 3px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 30; display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-radius: 999px; background: var(--ink); color: #fff; opacity: 0; transform: translate(-50%, 16px); transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

  /* 雛形狀態面板 */
  .proto-panel { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 13px; }
  .proto-toggle { padding: 8px 14px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font: inherit; cursor: pointer; box-shadow: var(--shadow); }
  .proto-body { width: 220px; max-height: 60vh; overflow: auto; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .proto-body p { margin: 0 0 6px; color: var(--muted); }
  .proto-body label { display: flex; gap: 8px; padding: 3px 0; cursor: pointer; }
  @media (max-width: 640px) { .proto-panel { top: 68px; bottom: auto; flex-direction: column-reverse; } }

  /* 購物車 */
  .cart { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .cart { grid-template-columns: 1fr; } }
  .items { padding: 8px 20px; }
  .row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 8px 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 600; }
  .row .spec { color: var(--muted); font-size: 13px; }
  .row .subtotal { min-width: 88px; text-align: right; font-weight: 600; }
  .row .actions { grid-column: 2 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row .remove { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
  .row .row-error { grid-column: 2 / -1; color: var(--danger); font-size: 13px; }
  .row.unavailable .thumb, .row.unavailable .info, .row.unavailable .subtotal { opacity: .45; filter: grayscale(1); }
  .tag-unlisted { margin-left: 6px; padding: 0 8px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); font-size: 12px; font-weight: 600; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; }
  .stepper button { width: 36px; height: 36px; border: 0; background: none; font-size: 17px; cursor: pointer; }
  .stepper button:disabled { color: var(--line); cursor: not-allowed; }
  .stepper output { min-width: 28px; text-align: center; font-weight: 600; }
  .stepper .spinner { margin: 0 9px; }
  .skeleton-row { display: grid; grid-template-columns: 56px 1fr; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .skeleton-row .thumb { border-radius: 10px; }
  .skeleton-row .line { height: 14px; margin-bottom: 10px; }
  .skeleton-row .line.short { width: 40%; }
  .summary { position: sticky; top: 84px; padding: 20px; }
  .summary .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  .summary strong { font-size: 22px; color: var(--primary); }
  .summary .muted { margin: 12px 0 0; font-size: 13px; text-align: center; }
  .empty-card { max-width: 560px; margin: 24px auto; padding: 32px; text-align: center; }
  .empty-card p { margin: 0 0 20px; color: var(--muted); }
</style>
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html">拾日選物</a>
    <nav class="site-nav" aria-label="主要導覽">
      <a href="index.html">商品</a>
      <a href="cart.html" aria-current="page">購物車<span class="cart-count num" id="cart-count"></span></a>
      <a href="orders.html">我的訂單</a>
    </nav>
    <span class="customer">林佳穎 您好</span>
  </div>
</header>

<main>
  <section id="view-cart">
    <h1>購物車</h1>
    <div id="unavailable-banner" class="banner banner-danger" role="alert" hidden>
      購物車中有已下架的商品，請先移除已下架的商品再結帳。
    </div>
    <div class="cart">
      <div class="card items" id="cart-items"></div>
      <aside class="card summary" aria-label="結帳摘要">
        <h2>結帳摘要</h2>
        <div class="total-row">
          <span>合計（<span id="cart-qty" class="num"></span> 件）</span>
          <strong id="cart-total" class="num"></strong>
        </div>
        <a class="btn btn-primary btn-block" id="checkout-link" href="checkout.html">前往結帳</a>
        <button class="btn btn-primary btn-block" id="checkout-disabled" type="button" disabled hidden>前往結帳</button>
        <p class="muted">下一步填寫收件資料，再前往綠界付款。</p>
      </aside>
    </div>
  </section>

  <section id="view-empty" class="card empty-card" hidden>
    <h1>購物車是空的</h1>
    <p>看看本週選物，挑一件喜歡的吧。</p>
    <a class="btn btn-primary" href="index.html">去逛逛</a>
  </section>
</main>

<div class="toast" role="status" aria-live="polite"></div>

<aside class="proto-panel" aria-label="雛形狀態">
  <div class="proto-body" hidden></div>
  <button class="proto-toggle" type="button" aria-expanded="false"></button>
</aside>

<script>
  // 假資料：與 index.html、checkout.html、orders.html 同一批商品與購物車
  const MOCK = {
    initialItems: [
      { id: 'ci-1', productName: '亞麻短袖襯衫', specLabel: '黑色 / M', unitPrice: 1280, quantity: 1, stock: 2, icon: 'shirt', tint: '#E9E4DA' },
      { id: 'ci-2', productName: '帆布托特包', specLabel: '墨綠 / 單一尺寸', unitPrice: 890, quantity: 1, stock: 6, icon: 'bag', tint: '#DCE6DF' },
      { id: 'ci-3', productName: '陶瓷馬克杯 350ml', specLabel: '灰藍', unitPrice: 420, quantity: 2, stock: 9, icon: 'mug', tint: '#DDE3EA' },
    ],
    items: [],
  };

  const ICONS = {
    shirt: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M17 8l-9 6 4 7 4-2v21h16V19l4 2 4-7-9-6c-1 3-4 5-7 5s-6-2-7-5z"/></svg>',
    bag: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M10 17h28l-2 23H12z"/><path d="M18 17v-3a6 6 0 0 1 12 0v3"/></svg>',
    mug: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M10 14h22v18a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6z"/><path d="M32 18h3a5 5 0 0 1 0 10h-3"/></svg>',
  };

  const $ = sel => document.querySelector(sel);
  const fmt = n => 'NT$' + n.toLocaleString('zh-TW');
  let timers = [];

  function renderSkeleton() {
    showView('cart');
    $('#cart-items').innerHTML = Array.from({ length: 3 }, () => `
      <div class="skeleton-row">
        <div class="thumb skeleton"></div>
        <div><div class="line skeleton"></div><div class="line short skeleton"></div></div>
      </div>`).join('');
  }

  function render() {
    const items = MOCK.items;
    const qty = items.reduce((sum, item) => sum + item.quantity, 0);
    $('#cart-count').textContent = qty;
    if (items.length === 0) { showView('empty'); return; }
    showView('cart');
    $('#cart-items').innerHTML = items.map(item => `
      <div class="row${item.unavailable ? ' unavailable' : ''}" data-id="${item.id}">
        <div class="thumb" style="background:${item.tint}">${ICONS[item.icon]}</div>
        <div class="info">
          <div class="name">${item.productName}${item.unavailable ? '<span class="tag-unlisted">已下架</span>' : ''}</div>
          <div class="spec">${item.specLabel}・單價 <span class="num">${fmt(item.unitPrice)}</span></div>
        </div>
        <div></div>
        <div class="subtotal num">${fmt(item.unitPrice * item.quantity)}</div>
        <div class="actions">
          <div class="stepper" aria-label="${item.productName} 數量">
            <button type="button" data-step="-1" aria-label="減少數量"${item.updating || item.unavailable || item.quantity <= 1 ? ' disabled' : ''}>−</button>
            ${item.updating ? '<span class="spinner" aria-label="更新中"></span>' : `<output class="num">${item.quantity}</output>`}
            <button type="button" data-step="1" aria-label="增加數量"${item.updating || item.unavailable ? ' disabled' : ''}>＋</button>
          </div>
          <button class="remove" type="button" data-remove>移除</button>
        </div>
        ${item.error ? `<div class="row-error" role="alert">${item.error}</div>` : ''}
      </div>`).join('');
    $('#cart-qty').textContent = qty;
    $('#cart-total').textContent = fmt(items.reduce((sum, item) => sum + item.unitPrice * item.quantity, 0));
    const blocked = items.some(item => item.unavailable);
    $('#unavailable-banner').hidden = !blocked;
    $('#checkout-link').hidden = blocked;
    $('#checkout-disabled').hidden = !blocked;
  }

  function showView(view) {
    $('#view-cart').hidden = view !== 'cart';
    $('#view-empty').hidden = view !== 'empty';
  }

  function changeQuantity(item, step) {
    const next = item.quantity + step;
    item.error = '';
    item.updating = true;
    render();
    markState('updating');
    later(500, () => {
      item.updating = false;
      if (next > item.stock) item.error = `庫存只剩 ${item.stock} 件`;
      else item.quantity = next;
      render();
      markState(item.error ? 'over-stock' : 'filled');
    });
  }

  function removeItem(item) {
    MOCK.items = MOCK.items.filter(i => i !== item);
    render();
    const toast = $('.toast');
    toast.textContent = `已移除 ${item.productName}（${item.specLabel}）`;
    toast.classList.add('show');
    later(3000, () => toast.classList.remove('show'));
    markState(MOCK.items.length ? 'filled' : 'empty');
  }

  function later(ms, fn) { timers.push(setTimeout(fn, ms)); }

  $('#cart-items').addEventListener('click', event => {
    const row = event.target.closest('.row');
    if (!row) return;
    const item = MOCK.items.find(i => i.id === row.dataset.id);
    const stepBtn = event.target.closest('[data-step]');
    if (stepBtn && !stepBtn.disabled) changeQuantity(item, Number(stepBtn.dataset.step));
    if (event.target.closest('[data-remove]')) removeItem(item);
  });

  function reset(patch = {}) {
    MOCK.items = MOCK.initialItems.map(item => ({ ...item, ...(patch[item.id] || {}) }));
    $('.toast').classList.remove('show');
    render();
  }

  // 雛形狀態（ui/plan.md 第 4、5 節）
  const STATES = [
    { key: 'loading', label: '載入中', apply: () => { reset(); renderSkeleton(); } },
    { key: 'filled', label: '有商品', apply: () => reset() },
    { key: 'updating', label: '更新中', apply: () => reset({ 'ci-3': { updating: true } }) },
    { key: 'empty', label: '購物車是空的', apply: () => { MOCK.items = []; render(); } },
    { key: 'over-stock', label: '數量超過庫存', apply: () => reset({ 'ci-1': { error: '庫存只剩 2 件' } }) },
    { key: 'unavailable', label: '購物車中有已下架商品', apply: () => reset({ 'ci-2': { unavailable: true } }) },
  ];

  const protoBody = $('.proto-body');
  const protoToggle = $('.proto-toggle');
  protoBody.innerHTML = '<p>切換畫面狀態</p>' + STATES.map(s =>
    `<label><input type="radio" name="proto-state" value="${s.key}">${s.label}</label>`).join('');
  protoToggle.addEventListener('click', () => {
    protoBody.hidden = !protoBody.hidden;
    protoToggle.setAttribute('aria-expanded', String(!protoBody.hidden));
  });
  protoBody.addEventListener('change', event => applyState(event.target.value));

  function markState(key) {
    protoBody.querySelector(`input[value="${key}"]`).checked = true;
    protoToggle.textContent = '雛形狀態：' + STATES.find(s => s.key === key).label;
  }

  function applyState(key) {
    timers.forEach(clearTimeout);
    timers = [];
    STATES.find(s => s.key === key).apply();
    markState(key);
  }

  applyState('loading');
  later(800, () => { render(); markState('filled'); });
</script>
</body>
</html>
