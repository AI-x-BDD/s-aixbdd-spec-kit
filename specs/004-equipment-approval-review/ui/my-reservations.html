<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的預約審核狀態查詢與取消｜精密實驗設備借用中心</title>
<style>
  /* 視覺風格（ui/plan.md 第 2 節） */
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --surface-muted: #F1F5F9;
    --ink: #0F172A;
    --muted: #475569;
    --line: #E2E8F0;
    --primary: #2563EB;
    --primary-soft: #DBEAFE;
    --danger: #DC2626;
    --danger-soft: #FEE2E2;
    --pending: #D97706;
    --pending-soft: #FEF3C7;
    --success: #16A34A;
    --success-soft: #DCFCE7;
    --occupied: #64748B;
    --occupied-soft: #F1F5F9;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .06);
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #0F172A;
    --surface: #1E293B;
    --surface-muted: #162032;
    --ink: #F8FAFC;
    --muted: #94A3B8;
    --line: #334155;
    --primary: #3B82F6;
    --primary-soft: #1E3A8A;
    --danger: #EF4444;
    --danger-soft: #7F1D1D;
    --pending: #F59E0B;
    --pending-soft: #78350F;
    --success: #22C55E;
    --success-soft: #14532D;
    --occupied: #94A3B8;
    --occupied-soft: #334155;
    --shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); transition: background-color .15s, color .15s; }
  a { color: inherit; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .site-header { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
  .site-header .inner { max-width: 1120px; margin: 0 auto; padding: 0 16px; min-height: 64px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: .04em; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .brand-mark { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: #FFFFFF; font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
  .site-nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .site-nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
  .site-nav a[aria-current="page"] { color: var(--primary); background: var(--primary-soft); font-weight: 600; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .user-pill { padding: 4px 10px; border-radius: 999px; background: var(--surface-muted); border: 1px solid var(--line); color: var(--muted); font-size: 13px; white-space: nowrap; }
  .btn-theme, .btn-logout { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .btn-theme:hover, .btn-logout:hover { border-color: var(--primary); color: var(--primary); }
  @media (max-width: 720px) { .user-pill { display: none; } .site-header .inner { padding: 8px 12px; } }

  main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 96px; }
  h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.3; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  .page-lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; transition: border-color .15s, background-color .15s; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #FFFFFF; }
  .btn-pending { background: var(--pending); border-color: var(--pending); color: #FFFFFF; }
  .btn-sm { height: 34px; padding: 0 12px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-block { width: 100%; }

  .banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; padding: 12px 16px; border-radius: var(--radius); border: 1px solid transparent; font-size: 14px; }
  .banner-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .banner-success { background: var(--success-soft); color: var(--success); border-color: var(--success); }
  .banner-pending { background: var(--pending-soft); color: var(--pending); border-color: var(--pending); }
  .banner-info { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-available { background: var(--success-soft); color: var(--success); }
  .badge-mine { background: var(--primary-soft); color: var(--primary); }
  .badge-pending { background: var(--pending-soft); color: var(--pending); }
  .badge-occupied { background: var(--occupied-soft); color: var(--occupied); }
  .badge-cancelled { background: var(--danger-soft); color: var(--danger); }

  .spinner { width: 20px; height: 20px; border: 3px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { background: var(--surface-muted); border-radius: 8px; min-height: 20px; border: 1px dashed var(--line); }

  /* 雛形狀態面板 */
  .proto-panel { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 13px; }
  .proto-toggle { padding: 8px 14px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font: inherit; cursor: pointer; box-shadow: var(--shadow); }
  .proto-body { width: 250px; max-height: 60vh; overflow: auto; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .proto-body p { margin: 0 0 6px; color: var(--muted); }
  .proto-body label { display: flex; gap: 8px; padding: 3px 0; cursor: pointer; }
  @media (max-width: 640px) { .proto-panel { top: 68px; bottom: auto; flex-direction: column-reverse; } }

  /* 我的預約頁專屬樣式 */
  .filter-bar { padding: 16px 20px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .tab-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab-btn { padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
  .tab-btn.active { background: var(--primary); border-color: var(--primary); color: #FFFFFF; font-weight: 600; }

  .reservation-list { display: grid; gap: 14px; }
  .reservation-card { padding: 18px 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .res-main { display: grid; gap: 6px; flex: 1; min-width: 260px; }
  .res-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .res-id { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--muted); }
  .res-title { font-size: 16px; font-weight: 700; margin: 0; }
  .res-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .reject-box { margin-top: 6px; padding: 10px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); font-size: 13px; }
  .res-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .empty-state { padding: 44px 24px; text-align: center; }
  .modal-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(15, 23, 42, .55); display: grid; place-items: center; padding: 16px; }
  .modal-card { width: 100%; max-width: 500px; padding: 24px; }
  .modal-detail { margin: 14px 0 20px; padding: 12px 16px; border-radius: 10px; background: var(--surface-muted); border: 1px solid var(--line); font-size: 14px; display: grid; gap: 6px; }
</style>
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html"><span class="brand-mark">EL</span>精密實驗設備借用中心</a>
    <nav class="site-nav" aria-label="主要導覽">
      <a href="index.html">登入</a>
      <a href="booking.html">設備預約</a>
      <a href="my-reservations.html" aria-current="page">我的預約</a>
      <a href="admin.html">審核與預約管理</a>
    </nav>
    <div class="header-actions">
      <span id="header-user" class="user-pill">林雅婷（一般成員）</span>
      <button id="theme-toggle" class="btn-theme" type="button" aria-label="切換深淺色主題">深色模式</button>
      <a id="header-logout" class="btn-logout" href="index.html?state=logged-out">登出</a>
    </div>
  </div>
</header>

<main>
  <h1>我的設備預約審核狀態查詢與取消</h1>
  <p class="page-lead">預設依預約日期由新到舊、固定時段順序及建立時間排序；完整呈現「待審核」、「已核准／有效」、「已駁回」（含駁回原因）與「已取消」狀態，並可在預約時段開始前取消待審或已核准申請。</p>

  <div id="page-banner" class="banner" role="alert" hidden>
    <span id="page-banner-text"></span>
    <a id="page-banner-link" class="btn btn-sm" href="booking.html" hidden>前往設備預約重新預約</a>
  </div>

  <!-- 載入中骨架 -->
  <section id="view-loading" hidden>
    <div class="card filter-bar">
      <div style="display:flex;align-items:center;gap:10px;color:var(--muted);">
        <span class="spinner" aria-hidden="true"></span>
        <span>正在載入您的預約與審核狀態紀錄…</span>
      </div>
    </div>
    <div class="reservation-list">
      <div class="card" style="padding:20px;"><div class="skeleton" style="height:22px;width:55%;margin-bottom:10px;"></div><div class="skeleton" style="height:18px;width:80%;"></div></div>
      <div class="card" style="padding:20px;"><div class="skeleton" style="height:22px;width:50%;margin-bottom:10px;"></div><div class="skeleton" style="height:18px;width:75%;"></div></div>
      <div class="card" style="padding:20px;"><div class="skeleton" style="height:22px;width:60%;margin-bottom:10px;"></div><div class="skeleton" style="height:18px;width:72%;"></div></div>
    </div>
  </section>

  <!-- 主要個人預約清單 -->
  <section id="view-main">
    <div class="card filter-bar">
      <div class="tab-group" role="group" aria-label="預約審核狀態篩選">
        <button type="button" class="tab-btn active" data-filter="ALL">全部紀錄</button>
        <button type="button" class="tab-btn" data-filter="pending_approval">待審核</button>
        <button type="button" class="tab-btn" data-filter="confirmed">已核准／有效</button>
        <button type="button" class="tab-btn" data-filter="rejected">已駁回</button>
        <button type="button" class="tab-btn" data-filter="cancelled">已取消</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="muted" style="font-size:13px;">目前業務時間：<span class="mono">2026-11-09 10:30</span></span>
        <a class="btn btn-sm btn-primary" href="booking.html">新增設備預約</a>
      </div>
    </div>

    <div id="view-empty" class="card empty-state" hidden>
      <h2>目前篩選條件下沒有符合的預約申請紀錄</h2>
      <p class="muted">前往預建設備清單選擇日期與固定時段，送出待審申請或免審核預約後即可在此追蹤審核進度。</p>
      <a class="btn btn-primary" href="booking.html">前往設備預約</a>
    </div>

    <div id="reservation-list" class="reservation-list"></div>
  </section>
</main>

<!-- 確認取消對話框 -->
<div id="cancel-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="card modal-card">
    <h2 id="modal-title">確認取消預約申請</h2>
    <p id="modal-desc" class="muted" style="margin:0;font-size:14px;"></p>
    <div id="modal-detail" class="modal-detail"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <button id="modal-close-btn" class="btn" type="button">返回</button>
      <button id="modal-confirm-btn" class="btn btn-danger" type="button">確認取消申請</button>
    </div>
  </div>
</div>

<aside class="proto-panel" aria-label="雛形狀態">
  <div class="proto-body" hidden></div>
  <button class="proto-toggle" type="button" aria-expanded="false"></button>
</aside>

<script>
  // 假資料：與 index.html、booking.html、admin.html 共用同一批預建設備與預約審核紀錄
  const MOCK = {

        requiresApproval: true,

        status: 'pending_approval',
        started: false,
        createdAt: '2026-11-09 09:45',
        reviewedBy: null,

        rejectReason: null,
        cancelledAt: null
      },
      {
        id: 'RV-20261109-07',
        equipmentId: 'EQ-102',
        equipmentName: '四通道數位示波器 Keysight DSOX3024T',
        requiresApproval: true,
        reservationDate: '2026-11-10',
        slotName: '下午',

        status: 'rejected',
        started: false,
        createdAt: '2026-11-08 14:20',
        reviewedBy: '吳承翰 (wu.chenghan)',
        reviewedAt: '2026-11-08 16:05',
        rejectReason: '該時段已有實驗室年度高頻校驗排程，請改申請其他時段或隔日借用。',
        cancelledAt: null
      },
      {
        id: 'RV-20261108-03',
        equipmentId: 'EQ-101',
        equipmentName: '高解析度光學顯微鏡 Olympus BX53',
        requiresApproval: true,
        reservationDate: '2026-11-10',
        slotName: '上午',
        slotTime: '09:00–12:00',
        status: 'confirmed',
        started: false,
        createdAt: '2026-11-08 09:12',
        reviewedBy: '吳承翰 (wu.chenghan)',
        reviewedAt: '2026-11-08 10:40',
        rejectReason: null,
        cancelledAt: null
      },
      {
        id: 'RV-20261107-06',
        equipmentId: 'EQ-103',
        equipmentName: '高精度工業熱像儀 FLIR E86',
        requiresApproval: false,
        reservationDate: '2026-11-09',
        slotName: '晚間',
        slotTime: '18:00–21:00',
        status: 'cancelled',
        started: false,
        createdAt: '2026-11-07 11:05',
        reviewedBy: null,
        reviewedAt: null,
        rejectReason: null,
        cancelledAt: '2026-11-07 19:30'
      },
      {
        id: 'RV-20261108-01',
        equipmentId: 'EQ-102',
        equipmentName: '四通道數位示波器 Keysight DSOX3024T',
        requiresApproval: true,
        reservationDate: '2026-11-09',
        slotName: '上午',
        slotTime: '09:00–12:00',
        status: 'confirmed',
        started: true,
        createdAt: '2026-11-07 15:10',
        reviewedBy: null,
        reviewedAt: null,
        rejectReason: null,
        cancelledAt: null
      }
    ]
  };

  const $ = sel => document.querySelector(sel);
  let timers = [];
  let reservations = [];
  let activeFilter = 'ALL';
  let pendingCancelId = null;
  let isCancelling = false;

  function initTheme() {
    const saved = localStorage.getItem('el-theme') || 'light';
    applyTheme(saved);
    $('#theme-toggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    });
  }

  function applyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      $('#theme-toggle').textContent = '淺色模式';
    } else {
      document.documentElement.removeAttribute('data-theme');
      $('#theme-toggle').textContent = '深色模式';
    }
    localStorage.setItem('el-theme', theme);
  }

  function resetReservations() {
    reservations = MOCK.baseReservations.map(r => ({ ...r }));
    activeFilter = 'ALL';
    pendingCancelId = null;
    isCancelling = false;
    $('#cancel-modal').hidden = true;
    $('#page-banner').hidden = true;
    updateFilterTabs();
  }

  function updateFilterTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === activeFilter);
    });
  }

  function showBanner(tone, text, showLink) {
    const banner = $('#page-banner');
    banner.className = `banner banner-${tone}`;
    $('#page-banner-text').textContent = text;
    $('#page-banner-link').hidden = !showLink;
    banner.hidden = false;
  }

  function getStatusBadge(r) {
    if (r.status === 'pending_approval') {
      return { cls: 'badge-pending', label: '待審核（核准前不占用時段）' };
    }
    if (r.status === 'confirmed') {
      return {
        cls: 'badge-mine',
        label: r.reviewedBy ? '已核准／有效（人工審核通過）' : '已核准／有效（免審核或既有預約）'
      };
    }
    if (r.status === 'rejected') {
      return { cls: 'badge-cancelled', label: '已駁回' };
    }
    return { cls: 'badge-occupied', label: '已取消' };
  }

  function renderList(forceEmpty) {
    if (forceEmpty) {
      $('#view-empty').hidden = false;
      $('#reservation-list').hidden = true;
      return;
    }
    const items = activeFilter === 'ALL'
      ? reservations
      : reservations.filter(r => r.status === activeFilter);

    if (items.length === 0) {
      $('#view-empty').hidden = false;
      $('#reservation-list').hidden = true;
      return;
    }
    $('#view-empty').hidden = true;
    $('#reservation-list').hidden = false;

    $('#reservation-list').innerHTML = items.map(r => {
      const badge = getStatusBadge(r);
      const modeBadge = r.requiresApproval
        ? '<span class="badge badge-pending">需人工審核設備</span>'
        : '<span class="badge badge-available">免審核設備</span>';

      let actionHtml = '';
      if (r.status === 'pending_approval' && !r.started) {
        actionHtml = `<button type="button" class="btn btn-sm btn-danger" data-cancel-id="${r.id}">取消待審申請</button>`;
      } else if (r.status === 'confirmed' && !r.started) {
        actionHtml = `<button type="button" class="btn btn-sm btn-danger" data-cancel-id="${r.id}">取消預約</button>`;
      } else if (r.started) {
        actionHtml = `<button type="button" class="btn btn-sm" data-started-id="${r.id}">時段已開始（不可取消）</button>`;
      } else if (r.status === 'rejected') {
        actionHtml = `
          <a class="btn btn-sm btn-primary" href="booking.html">重新申請此時段</a>
          <button type="button" class="btn btn-sm" data-non-cancellable="${r.id}">已駁回紀錄</button>
        `;
      } else {
        actionHtml = `
          <a class="btn btn-sm" href="booking.html">重新申請此時段</a>
          <button type="button" class="btn btn-sm" data-non-cancellable="${r.id}">已取消紀錄</button>
        `;
      }

      const rejectHtml = r.status === 'rejected'
        ? `<div class="reject-box"><strong>管理員駁回原因：</strong>${r.rejectReason || '（管理員未填寫原因）'}</div>`
        : '';

      return `
        <article class="card reservation-card">
          <div class="res-main">
            <div class="res-top">
              <span class="res-id">${r.id}</span>
              <span class="badge ${badge.cls}">${badge.label}</span>
              ${modeBadge}
              <span class="mono" style="font-size:13px;font-weight:600;color:var(--primary);">${r.equipmentId}</span>
            </div>
            <h2 class="res-title">${r.equipmentName}</h2>
            <div class="res-meta">
              <span>預約日期：<strong class="mono">${r.reservationDate}</strong></span>
              <span>固定時段：<strong class="mono">${r.slotName} ${r.slotTime}</strong></span>
              <span>建立時間：<span class="mono">${r.createdAt}</span></span>
              <span>審核管理員：<span>${r.reviewedBy || '—'}</span></span>
              <span>審核時間：<span class="mono">${r.reviewedAt || '—'}</span></span>
              <span>取消時間：<span class="mono">${r.cancelledAt || '—'}</span></span>
            </div>
            ${rejectHtml}
          </div>
          <div class="res-actions">${actionHtml}</div>
        </article>
      `;
    }).join('');
  }

  function openCancelModal(reservationId, cancelling) {
    const target = reservations.find(r => r.id === reservationId);
    if (!target) return;
    pendingCancelId = reservationId;
    isCancelling = Boolean(cancelling);
    const isPending = target.status === 'pending_approval';
    $('#modal-title').textContent = isPending ? '確認取消待審核申請' : '確認取消已核准／有效預約';
    $('#modal-desc').textContent = isPending
      ? '取消後此筆申請將更新為「已取消」、自管理員待審清單移除，並完整保留於您的個人歷史紀錄中：'
      : '取消後此筆預約將更新為「已取消」、立即釋出該設備時段供重新預約，並完整保留於歷史紀錄中：';
    $('#modal-detail').innerHTML = `
      <div><strong>預約編號：</strong><span class="mono">${target.id}</span></div>
      <div><strong>目前狀態：</strong>${isPending ? '待審核' : '已核准／有效'}</div>
      <div><strong>借用設備：</strong><span class="mono">${target.equipmentId}</span> ${target.equipmentName}</div>
      <div><strong>預約時段：</strong><span class="mono">${target.reservationDate} ${target.slotName} ${target.slotTime}</span></div>
    `;
    const confirmBtn = $('#modal-confirm-btn');
    const closeBtn = $('#modal-close-btn');
    confirmBtn.disabled = isCancelling;
    closeBtn.disabled = isCancelling;
    confirmBtn.textContent = isCancelling
      ? '取消處理中…'
      : (isPending ? '確認取消待審申請' : '確認取消並釋出時段');
    $('#cancel-modal').hidden = false;
  }

  document.querySelector('.tab-group').addEventListener('click', e => {
    const btn = e.target.closest('[data-filter]');
    if (!btn) return;
    activeFilter = btn.dataset.filter;
    updateFilterTabs();
    renderList(false);
  });

  $('#reservation-list').addEventListener('click', e => {
    const cancelBtn = e.target.closest('[data-cancel-id]');
    if (cancelBtn) {
      const id = cancelBtn.dataset.cancelId;
      const target = reservations.find(r => r.id === id);
      openCancelModal(id, false);
      markState(target && target.status === 'pending_approval' ? 'confirm-cancel-pending' : 'confirm-cancel-confirmed');
      return;
    }
    const startedBtn = e.target.closest('[data-started-id]');
    if (startedBtn) {
      applyState('cancel-started-error');
      return;
    }
    const nonCancellableBtn = e.target.closest('[data-non-cancellable]');
    if (nonCancellableBtn) {
      applyState('cancel-non-active-error');
    }
  });

  $('#modal-close-btn').addEventListener('click', () => {
    $('#cancel-modal').hidden = true;
    markState('list');
  });

  $('#modal-confirm-btn').addEventListener('click', () => {
    if (!pendingCancelId) return;
    openCancelModal(pendingCancelId, true);
    markState('cancelling');
    timers.push(setTimeout(() => {
      const target = reservations.find(r => r.id === pendingCancelId);
      const wasPending = target && target.status === 'pending_approval';
      if (target) {
        target.status = 'cancelled';
        target.cancelledAt = wasPending ? '2026-11-09 10:32' : '2026-11-09 10:33';
      }
      $('#cancel-modal').hidden = true;
      renderList(false);
      if (wasPending) {
        showBanner(
          'success',
          `已取消待審核申請 ${target.id}（${target.equipmentId} ${target.equipmentName}，${target.reservationDate} ${target.slotName} ${target.slotTime}），已自管理員待審清單移除並保留歷史紀錄。`,
          true
        );
        markState('cancel-pending-success');
      } else {
        showBanner(
          'success',
          `已取消已核准／有效預約 ${target.id}（${target.equipmentId} ${target.equipmentName}，${target.reservationDate} ${target.slotName} ${target.slotTime}），該時段已立即釋出恢復為可預約狀態。`,
          true
        );
        markState('cancel-confirmed-success');
      }
    }, 600));
  });

  // 雛形狀態（ui/plan.md 第 4、5 節）
  const STATES = [
    {
      key: 'loading',
      label: '載入中',
      apply: () => {
        $('#view-loading').hidden = false;
        $('#view-main').hidden = true;
        $('#cancel-modal').hidden = true;
        $('#page-banner').hidden = true;
      }
    },
    {
      key: 'list',
      label: '個人預約清單（含四種審核狀態與駁回原因）',
      apply: () => {
        $('#view-loading').hidden = true;
        $('#view-main').hidden = false;
        resetReservations();
        renderList(false);
      }
    },
    {
      key: 'confirm-cancel-pending',
      label: '確認取消待審核申請',
      apply: () => {
        $('#view-loading').hidden = true;
        $('#view-main').hidden = false;
        resetReservations();
        renderList(false);
        openCancelModal('RV-20261109-08', false);
      }
    },
    {
      key: 'confirm-cancel-confirmed',
      label: '確認取消已核准／有效預約',
      apply: () => {
        $('#view-loading').hidden = true;
        $('#view-main').hidden = false;
        resetReservations();
        renderList(false);
        openCancelModal('RV-20261108-03', false);
      }
    },
    {
      key: 'cancelling',
      label: '取消處理中',
      apply: () => {
        $('#view-loading').hidden = true;
        $('#view-main').hidden = false;
        resetReservations();
        renderList(false);
        openCancelModal('RV-20261109-08', true);
      }
    },
    {
      key: 'cancel-pending-success',
      label: '已取消待審核申請',
      apply: () => {
        $('#view-loading').hidden = true;
        $('#view-main').hidden = false;
        resetReservations();
        const item = reservations.find(r => r.id === 'RV-20261109-08');
        item.status = 'cancelled';
        item.cancelledAt = '2026-11-09 10:32';
        renderList(false);
        showBanner(
          'success',
          '已取消待審核申請 RV-20261109-08（EQ-101 高解析度光學顯微鏡 Olympus BX53，2026-11-10 晚間 18:00–21:00），已自管理員待審清單移除並保留歷史紀錄。',
          true
        );
      }
    },
    {
      key: 'cancel-confirmed-success',
      label: '已取消有效預約並釋出時段',
      apply: () => {
        $('#view-loading').hidden = true;
        $('#view-main').hidden = false;
        resetReservations();
        const item = reservations.find(r => r.id === 'RV-20261108-03');
        item.status = 'cancelled';
        item.cancelledAt = '2026-11-09 10:33';
        renderList(false);
        showBanner(
          'success',
          '已取消已核准／有效預約 RV-20261108-03（EQ-101 高解析度光學顯微鏡 Olympus BX53，2026-11-10 上午 09:00–12:00），該時段已立即釋出恢復為可預約狀態。',
          true
        );
      }
    },
    {
      key: 'empty',
      label: '尚無預約紀錄',
      apply: () => {
        $('#view-loading').hidden = true;
        $('#view-main').hidden = false;
        resetReservations();
        renderList(true);
      }
    },
    {
      key: 'cancel-started-error',
      label: '取消已開始或已過期申請',
      apply: () => {
        $('#view-loading').hidden = true;
        $('#view-main').hidden = false;
        resetReservations();
        renderList(false);
        showBanner(
          'danger',
          '無法取消：預約編號 RV-20261108-01（2026-11-09 上午 09:00–12:00）已到達或超過時段開始時間，僅能在預約時段開始前取消待審核或已核准／有效申請。',
          false
        );
      }
    },
    {
      key: 'cancel-non-active-error',
      label: '取消已駁回或已取消申請',
      apply: () => {
        $('#view-loading').hidden = true;
        $('#view-main').hidden = false;
        resetReservations();
        renderList(false);
        showBanner(
          'danger',
          '無法取消：預約編號 RV-20261109-07 目前狀態為「已駁回」（或已取消），僅處於「待審核」或「已核准／有效」狀態的申請可執行取消。',
          false
        );
      }
    },
    {
      key: 'cancel-forbidden-error',
      label: '越權取消他人預約申請',
      apply: () => {
        $('#view-loading').hidden = true;
        $('#view-main').hidden = false;
        resetReservations();
        renderList(false);
        showBanner(
          'danger',
          '權限不足：預約編號 RV-20261109-09 不屬於您本人名下，系統拒絕取消他人預約申請。',
          false
        );
      }
    }
  ];

  const protoBody = $('.proto-body');
  const protoToggle = $('.proto-toggle');
  protoBody.innerHTML = '<p>切換畫面狀態</p>' + STATES.map(s =>
    `<label><input type="radio" name="proto-state" value="${s.key}">${s.label}</label>`).join('');
  protoToggle.addEventListener('click', () => {
    protoBody.hidden = !protoBody.hidden;
    protoToggle.setAttribute('aria-expanded', String(!protoBody.hidden));
  });
  protoBody.addEventListener('change', event => applyState(event.target.value));

  function markState(key) {
    protoBody.querySelector(`input[value="${key}"]`).checked = true;
    protoToggle.textContent = '雛形狀態：' + STATES.find(s => s.key === key).label;
  }

  function applyState(key) {
    timers.forEach(clearTimeout);
    timers = [];
    STATES.find(s => s.key === key).apply();
    markState(key);
  }

  initTheme();
  applyState('list');
</script>
</body>
</html>
