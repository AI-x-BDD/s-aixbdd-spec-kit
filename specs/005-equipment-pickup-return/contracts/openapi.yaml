    post:
      operationId: approveReservation
      tags: [B4 管理員待審清單、全體借還紀錄查詢與審核核准駁回 API]
      summary: 管理員核准待審核預約申請並重檢時段衝突後鎖定占用時段
      description: 依 FR-004、FR-007、FR-009、NFR-001、NFR-002、SC-004、SC-005 允許管理員（admin）對處於 pending_approval（待審核）狀態且尚未到達時段開始時間（依 Asia/Taipei 業務時區解讀）的申請執行核准。核准時於單一資料庫交易內即時重檢同一設備、同一日期與同一固定時段是否仍未被其他占用狀態紀錄（confirmed 已核准／有效、checked_out 借用中或當日已履約完畢之 returned 已歸還）鎖定占用（FR-007、Edge Cases 當日借用提早歸還後的時段占用保護）：驗證通過時將申請狀態更新為 confirmed、記錄 reviewedBy 審核管理員與 reviewedAt 審核時間並正式鎖定占用該時段，回應 200。當預約時段已到達或超過開始時間時拒絕核准並回應 400（RESERVATION_ALREADY_STARTED）；未登入時回應 401（UNAUTHORIZED）；一般成員（member）嘗試呼叫核准時回應 403（FORBIDDEN）；申請紀錄不存在時回應 404（RESOURCE_NOT_FOUND）；當目標時段已被另一筆 confirmed、checked_out 或 returned 紀錄占用時，攔截拒絕核准並回應 409（RESERVATION_CONFLICT），保持本筆申請為 pending_approval 狀態；當申請已被申請人取消或已非 pending_approval 狀態時回應 409（INVALID_RESERVATION_STATUS）。
      responses:
        '200':
          description: 核准成功並已正式鎖定占用該設備時段，回傳更新後的預約借還紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReservationItem'
        '400':
          $ref: '#/components/responses/ReviewReservationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReviewReservationConflict'
  /admin/reservations/{reservationId}/reject:
