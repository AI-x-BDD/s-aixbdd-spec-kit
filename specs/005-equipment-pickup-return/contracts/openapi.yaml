  responses:
    ValidationFailed:
      description: 請求欄位或路徑參數格式不合法（VALIDATION_FAILED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaginationOrQueryInvalid:
      description: page 或 pageSize 分頁參數不合法（PAGINATION_INVALID），或查詢篩選參數格式不符（VALIDATION_FAILED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LoginBadRequest:
      description: 登入欄位格式不符（VALIDATION_FAILED）、7 位數驗證碼內容或英文大小寫不符（CAPTCHA_MISMATCH），或驗證碼挑戰已超過 5 分鐘有效期限／已單次消耗失效（CAPTCHA_EXPIRED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: 帳號或密碼不正確，且原驗證碼已單次消耗失效（INVALID_CREDENTIALS）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未登入或工作階段無效（UNAUTHORIZED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 已登入但角色不符（非管理員嘗試執行登記領取、登記歸還或管理操作）或無權操作他人預約資源（FORBIDDEN）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 指定的設備、固定時段或預約借用紀錄不存在（RESOURCE_NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CreateReservationBadRequest:
      description: 欄位格式不符（VALIDATION_FAILED）、預約日期不在當日起算 7 天開放範圍內（DATE_OUT_OF_RANGE），或所選固定時段已開始／已結束（SLOT_ALREADY_STARTED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CreateReservationConflict:
      description: 同一成員已對同一設備、同一日期與同一固定時段持有未結束的待審核、已核准／有效或借用中紀錄（DUPLICATE_PENDING_OR_ACTIVE_RESERVATION）、該設備於指定日期與固定時段已被其他已核准／有效、借用中或當日已履約歸還紀錄占用（RESERVATION_CONFLICT），或該設備目前不可用（EQUIPMENT_UNAVAILABLE）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CancelReservationConflict:
      description: 該預約已完成現場登記領取進入借用中或已歸還狀態而禁止取消（RESERVATION_ALREADY_CHECKED_OUT）、已到達或超過時段開始時間無法取消（RESERVATION_ALREADY_STARTED）、已處於已取消狀態（RESERVATION_ALREADY_CANCELLED），或已處於已駁回狀態無法取消（INVALID_RESERVATION_STATUS）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReviewReservationBadRequest:
      description: 路徑參數或選填駁回原因格式不合法／超過 200 字上限（VALIDATION_FAILED），或該筆申請的預約時段已到達／超過開始時間無法執行核准或駁回（RESERVATION_ALREADY_STARTED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReviewReservationConflict:
      description: 該筆申請已非待審核狀態（如申請人已先行取消、已核准、借用中、已歸還或已駁回，INVALID_RESERVATION_STATUS）、核准時該設備於同一日期與同一固定時段已被另一筆已核准／有效、借用中或當日已歸還紀錄占用（RESERVATION_CONFLICT），或該申請時段已開始（RESERVATION_ALREADY_STARTED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PickupReservationBadRequest:
      description: 路徑參數格式不合法（VALIDATION_FAILED）、嘗試對未來日期的已核准預約提前執行登記領取（PICKUP_DATE_NOT_TODAY），或嘗試對過去日期／當日已超過該固定時段結束時間卻未領取的過期預約補登領取（PICKUP_WINDOW_EXPIRED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PickupOrReturnReservationConflict:
      description: 紀錄目前狀態不允許執行該操作（例如對非 confirmed 狀態紀錄執行登記領取，或對非 checked_out 狀態紀錄執行登記歸還，INVALID_RESERVATION_STATUS）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
