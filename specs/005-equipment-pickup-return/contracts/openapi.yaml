      tags: [B5 管理員現場登記領取與登記歸還 API]
      summary: 管理員於現場登記設備歸還並留存完整借用稽核紀錄
      description: 依 US2 情境 1–3、FR-003、FR-004、FR-005、FR-007、NFR-001、NFR-002、SC-002、SC-004、SC-005 供以管理員（admin）身分登入的使用者對成員帶回現場歸還的設備執行單鍵「登記歸還」。系統於資料庫交易內驗證該筆紀錄目前狀態必須為 checked_out（借用中）：驗證通過時，不論當前台灣時間（Asia/Taipei）是在該固定時段結束時間之前（一般時段內歸還或提早歸還，US2 情境 1），或是已超過該固定時段結束時間甚至跨日才拿回現場歸還（US2 情境 2、FR-004、SC-002、Edge Cases 成員超過固定時段結束時間才逾時歸還設備，屬 spec 定義之正常處理結果），系統皆照常允許完成歸還登記，將狀態更新為 returned（已歸還）、記錄實際歸還時間 returnedAt 與歸還經手管理員（returnedByUserId、returnedByName）、完整保留領取與歸還歷史稽核紀錄並回應 200；且當日固定時段於提早歸還更新為 returned 後即視為已履約結案，繼續保持該時段占用而不重新開放他人重複預約（FR-004、FR-007、Edge Cases 當日借用提早歸還後的時段占用保護）。當管理員嘗試對非 checked_out 狀態（如尚未領取的 confirmed 已核准／有效、已歸還的 returned 重複點擊歸還、pending_approval 待審核、rejected 已駁回或 cancelled 已取消）的紀錄執行登記歸還時，拒絕操作並回應 409（INVALID_RESERVATION_STATUS）（US2 情境 3、FR-004、SC-002、Edge Cases 重複點擊登記領取或登記歸還）。當路徑參數格式不合法時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；一般成員（member）嘗試呼叫登記歸還時攔截拒絕並回應 403（FORBIDDEN）（FR-003、SC-005）；指定的借用紀錄不存在時回應 404（RESOURCE_NOT_FOUND）。NFR-002、SC-004 執行登記歸還回應時間低於 2 秒。
      responses:
        '200':
          description: 現場登記歸還成功（含時段結束前歸還與超過時段結束時間之逾時歸還），狀態更新為 returned（已歸還）並記錄歸還時間與歸還經手管理員
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReservationItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PickupOrReturnReservationConflict'
  /admin/equipments:
    get:
      operationId: listAdminEquipments
      tags: [B6 管理員設備人工審核設定切換 API]
      summary: 管理員分頁查詢預建設備清單與目前人工審核設定
      description: 依 FR-009、NFR-001、NFR-002、SC-004、SC-005 供以管理員（admin）身分登入的使用者分頁查詢組織內所有預建單件設備的目前人工審核設定（requiresApproval：false 免審核、true 需人工審核）、設備編號、設備名稱、分類、可用狀態與最後修改時間，支援依分類（category）或人工審核設定（requiresApproval）篩選。排序依設備編號 equipmentCode 由小到大（ASC）排序，equipmentCode 相同時依唯一欄位 id 由小到大（ASC）排序；page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。當 page 或 pageSize 不合法時回應 400（PAGINATION_INVALID）；未登入時回應 401（UNAUTHORIZED）；一般成員（member）嘗試存取時回應 403（FORBIDDEN）。
      parameters:
        - name: category
          in: query
          required: false
          description: 選填的設備分類篩選條件
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: requiresApproval
          in: query
          required: false
          description: 選填的設備人工審核模式篩選條件（false 免審核、true 需人工審核）
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: 要查詢的頁碼，從 1 開始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每頁筆數，預設 20，上限 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分頁的預建設備與人工審核設定清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEquipmentPage'
        '400':
          $ref: '#/components/responses/PaginationOrQueryInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/equipments/{equipmentId}/approval-mode:
    parameters:
      - name: equipmentId
        in: path
        required: true
        description: 單件設備唯一識別碼
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateEquipmentApprovalMode
      tags: [B6 管理員設備人工審核設定切換 API]
      summary: 管理員切換指定設備的免審核／需人工審核設定
      description: 依 FR-009、NFR-001、NFR-002、SC-004、SC-005 允許以管理員（admin）身分登入的使用者將指定預建設備的 requiresApproval 設定在 false（免審核）與 true（需人工審核）之間切換並立即持久化保存。切換時保持既有已核准／有效（confirmed）、借用中（checked_out）、已歸還（returned）與待審核（pending_approval）紀錄原狀態與效力不變，新設定僅適用於切換完成後新送出的預約申請（FR-009、SC-005）。當路徑參數或請求欄位格式不合法時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；一般成員（member）嘗試修改設備人工審核設定時拒絕並回應 403（FORBIDDEN）；指定的設備不存在時回應 404（RESOURCE_NOT_FOUND）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentApprovalModeRequest'
      responses:
        '200':
          description: 成功更新設備人工審核設定（既有預約與借還紀錄維持原狀態不變）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEquipmentSetting'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Error:
      type: object
      description: 本合約所有錯誤回應共用的格式
      required: [code, message]
      properties:
        code:
          type: string
          description: 錯誤碼，指出錯誤情況
          enum:
            - VALIDATION_FAILED
            - PAGINATION_INVALID
            - CAPTCHA_MISMATCH
            - CAPTCHA_EXPIRED
            - INVALID_CREDENTIALS
            - UNAUTHORIZED
            - FORBIDDEN
            - RESOURCE_NOT_FOUND
            - DATE_OUT_OF_RANGE
            - SLOT_ALREADY_STARTED
            - EQUIPMENT_UNAVAILABLE
            - RESERVATION_CONFLICT
            - DUPLICATE_PENDING_OR_ACTIVE_RESERVATION
            - INVALID_RESERVATION_STATUS
            - PICKUP_DATE_NOT_TODAY
            - PICKUP_WINDOW_EXPIRED
            - RESERVATION_ALREADY_CHECKED_OUT
            - RESERVATION_ALREADY_STARTED
            - RESERVATION_ALREADY_CANCELLED
        message:
          type: string
          description: 給使用者看的繁體中文錯誤訊息
    ReservationStatus:
      type: string
      description: 預約與借用紀錄的 6 種標準狀態代碼（pending_approval 待審核、confirmed 已核准／有效、checked_out 借用中、returned 已歸還、rejected 已駁回、cancelled 已取消）
      enum:
        - pending_approval
        - confirmed
        - checked_out
        - returned
        - rejected
        - cancelled
    SlotStatus:
      type: string
      description: 單日固定時段對當前登入成員的 6 態借用狀態代碼（AVAILABLE 可預約、MY_PENDING 本人待審核、MY_CONFIRMED 本人已預約、MY_CHECKED_OUT 本人借用中、MY_RETURNED 本人已歸還、OCCUPIED 已被預約）
      enum:
        - AVAILABLE
        - MY_PENDING
        - MY_CONFIRMED
        - MY_CHECKED_OUT
        - MY_RETURNED
        - OCCUPIED
    CreateCaptchaChallengeRequest:
      type: object
      description: 手動重整驗證碼時可選填傳入上一筆驗證碼挑戰 ID 使其立即失效
      properties:
        previousChallengeId:
          type: string
          format: uuid
          description: 要立即作廢的上一筆驗證碼挑戰唯一識別碼
    CaptchaChallengeResponse:
      type: object
      description: 7 位數區分大小寫英數驗證碼挑戰資訊
      required: [challengeId, captchaCode, expiresAt]
      properties:
        challengeId:
          type: string
          format: uuid
          description: 驗證碼挑戰唯一識別碼
        captchaCode:
          type: string
          minLength: 7
          maxLength: 7
          pattern: '^(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9]{7}$'
          description: 以 A–Z、a–z、0–9 隨機產生且同時包含英文與阿拉伯數字的 7 位數驗證碼（嚴格區分大小寫）
        expiresAt:
          type: string
          format: date-time
          description: 驗證碼挑戰到期時間（建立後 5 分鐘，ISO 8601 UTC）
    LoginRequest:
      type: object
      description: 帳號密碼與 7 位數驗證碼登入請求
      required: [username, password, challengeId, captchaCode]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 預建使用者登入帳號（例如 lin.yating、chen.guanting、wu.chenghan）
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: 登入密碼
        challengeId:
          type: string
          format: uuid
          description: 登入頁目前顯示的驗證碼挑戰唯一識別碼
        captchaCode:
          type: string
          minLength: 7
          maxLength: 7
          pattern: '^[A-Za-z0-9]{7}$'
          description: 使用者輸入的 7 位數英數驗證碼（嚴格區分英文大小寫）
    AuthenticatedUser:
      type: object
      description: 已通過驗證的使用者帳號資訊
      required: [id, username, displayName, role]
      properties:
        id:
          type: string
          format: uuid
          description: 使用者唯一識別碼
        username:
          type: string
          description: 登入帳號
        displayName:
          type: string
          description: 使用者繁體中文顯示名稱
        role:
          type: string
          enum: [member, admin]
          description: 使用者角色（member 一般成員、admin 管理員）
    LoginResponse:
      type: object
      description: 登入成功回應的工作階段權杖與使用者資訊
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: 後續 API 請求帶入 Authorization Bearer 的工作階段權杖
        expiresAt:
          type: string
          format: date-time
          description: 工作階段權杖到期時間（ISO 8601 UTC）
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
    LogoutResponse:
      type: object
      description: 登出成功回應
      required: [message]
      properties:
        message:
          type: string
          description: 繁體中文登出完成訊息
    EquipmentSlotAvailability:
      type: object
      description: 單件設備於指定日期的單一固定時段 6 態狀態（對借用人本人區分顯示本人借用中與本人已歸還，對其他成員統一顯示已被預約且隱藏借用人身分）
      required: [slotId, slotCode, slotName, startTime, endTime, sortOrder, slotStatus, availabilityStatus, isBookable, myReservationId]
      properties:
        slotId:
          type: string
          format: uuid
          description: 固定時段唯一識別碼
        slotCode:
          type: string
          enum: [MORNING, AFTERNOON, EVENING]
          description: 固定時段代碼
        slotName:
          type: string
          enum: [上午, 下午, 晚間]
          description: 固定時段繁體中文名稱
        startTime:
          type: string
          enum: ['09:00', '13:00', '18:00']
          description: 時段開始時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        endTime:
          type: string
          enum: ['12:00', '17:00', '21:00']
          description: 時段結束時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        sortOrder:
          type: integer
          minimum: 1
          maximum: 3
          description: 單日固定時段排序順序（1 上午、2 下午、3 晚間）
        slotStatus:
          $ref: '#/components/schemas/SlotStatus'
        availabilityStatus:
          type: string
          enum: [available, pending_by_me, booked_by_me, checked_out_by_me, returned_by_me, booked_by_others]
          description: 向下相容的時段可用狀態欄位（available 對應 AVAILABLE 可預約、pending_by_me 對應 MY_PENDING 本人待審核、booked_by_me 對應 MY_CONFIRMED 本人已預約、checked_out_by_me 對應 MY_CHECKED_OUT 本人借用中、returned_by_me 對應 MY_RETURNED 本人已歸還、booked_by_others 對應 OCCUPIED 已被預約）
        isBookable:
          type: boolean
          description: 該時段是否處於可預約日期範圍內、尚未到達開始時間且狀態為 AVAILABLE（available）
        myReservationId:
          type: [string, 'null']
          format: uuid
          description: 當該時段屬於當前登入成員本人（MY_PENDING、MY_CONFIRMED、MY_CHECKED_OUT 或 MY_RETURNED）時回傳本人的預約借用紀錄 ID，其餘情況為 null
    EquipmentWithSlotAvailability:
      type: object
      description: 單件獨立設備基本資料、人工審核模式標示與指定日期的 3 個固定時段 6 態狀態
      required: [id, equipmentCode, name, category, isActive, requiresApproval, reservationDate, slots]
      properties:
        id:
          type: string
          format: uuid
          description: 設備唯一識別碼
        equipmentCode:
          type: string
          description: 唯一設備編號（例如 EQ-101）
        name:
          type: string
          description: 設備名稱
        category:
          type: string
          description: 設備分類
        isActive:
          type: boolean
          description: 設備目前是否可用
        requiresApproval:
          type: boolean
          description: 設備目前是否需要管理員人工審核（false 免審核、true 需人工審核）
        reservationDate:
          type: string
          format: date
          description: 查詢的預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        slots:
          type: array
          description: 該設備於該日的 3 個固定時段 6 態狀態清單
          items:
            $ref: '#/components/schemas/EquipmentSlotAvailability'
    EquipmentAvailabilityPage:
      type: object
      description: 單件設備與單日固定時段 6 態狀態的分頁回應
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          description: 本頁的單件設備與時段 6 態狀態清單
          items:
            $ref: '#/components/schemas/EquipmentWithSlotAvailability'
        page:
          type: integer
          minimum: 1
          description: 本次查詢採用的頁碼
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: 本次查詢採用的每頁筆數
        totalItems:
          type: integer
          minimum: 0
          description: 符合條件的設備總筆數
        totalPages:
          type: integer
          minimum: 0
          description: 總頁數，沒有資料時為 0
    CreateReservationRequest:
      type: object
      description: 建立單日固定時段設備預約或待審核申請的請求資料
      required: [equipmentId, reservationDate, slotId]
      properties:
        equipmentId:
          type: string
          format: uuid
          description: 要預約的單件設備唯一識別碼
        reservationDate:
          type: string
          format: date
          description: 預約借用日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀，須為當日起算 7 天內）
        slotId:
          type: string
          format: uuid
          description: 要預約的單日固定時段唯一識別碼
    RejectReservationRequest:
      type: object
      description: 管理員駁回待審核預約申請的請求資料（駁回原因為選填，上限 200 字）
      properties:
        rejectReason:
          type: [string, 'null']
          maxLength: 200
          description: 選填的駁回原因（上限 200 字，未填寫時可省略或傳入 null）
    UpdateEquipmentApprovalModeRequest:
      type: object
      description: 管理員切換指定設備人工審核設定的請求資料
      required: [requiresApproval]
      properties:
        requiresApproval:
          type: boolean
          description: 目標人工審核設定（false 免審核、true 需人工審核）
    AdminEquipmentSetting:
      type: object
      description: 管理員檢視與切換的單件設備人工審核設定資訊
      required: [id, equipmentCode, name, category, isActive, requiresApproval, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: 設備唯一識別碼
        equipmentCode:
          type: string
          description: 唯一設備編號（例如 EQ-101）
        name:
          type: string
          description: 設備名稱
        category:
          type: string
          description: 設備分類
        isActive:
          type: boolean
          description: 設備目前是否可用
        requiresApproval:
          type: boolean
          description: 設備目前是否需要管理員人工審核（false 免審核、true 需人工審核）
        updatedAt:
          type: string
          format: date-time
          description: 設備設定最後更新時間（ISO 8601 UTC）
    AdminEquipmentPage:
      type: object
      description: 管理員預建設備與人工審核設定的分頁回應
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          description: 本頁的預建設備與人工審核設定清單
          items:
            $ref: '#/components/schemas/AdminEquipmentSetting'
        page:
          type: integer
          minimum: 1
          description: 本次查詢採用的頁碼
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: 本次查詢採用的每頁筆數
        totalItems:
          type: integer
          minimum: 0
          description: 符合條件的設備總筆數
        totalPages:
          type: integer
          minimum: 0
          description: 總頁數，沒有資料時為 0
    Reservation:
      type: object
      description: 成員本人的設備預約與借還紀錄（涵蓋待審核、已核准／有效、借用中、已歸還、已駁回與已取消共 6 種狀態，含領取與歸還時間及經手管理員）
      required:
        - id
        - reservationNumber
        - userId
        - equipmentId
        - equipmentCode
        - equipmentName
        - equipmentCategory
        - equipmentRequiresApproval
        - reservationDate
        - slotId
        - slotName
        - slotStartTime
        - slotEndTime
        - slotSortOrder
        - status
        - reviewedBy
        - reviewedByDisplayName
        - reviewedAt
        - rejectReason
        - checkedOutAt
        - checkedOutByUserId
        - checkedOutByName
        - returnedAt
        - returnedByUserId
        - returnedByName
        - canCancel
        - createdAt
        - cancelledAt
      properties:
        id:
          type: string
          format: uuid
          description: 預約借用紀錄唯一識別碼
        reservationNumber:
          type: string
          description: 供畫面顯示的唯一預約編號（例如 RV-20261108-03）
        userId:
          type: string
          format: uuid
