      description: 依 US1 情境 1–5、FR-001、FR-002、FR-003、FR-005、NFR-001、NFR-002、SC-001、SC-004、SC-005 供以管理員（admin）身分登入的使用者對成員到場領取的預約執行單鍵「登記領取」。系統於單一資料庫交易內依序驗證：(1) 該筆預約目前狀態必須為 confirmed（已核准／有效），若處於 pending_approval（待審核）、checked_out（借用中，重複點擊登記領取）、returned（已歸還）、rejected（已駁回）或 cancelled（已取消）狀態則拒絕領取並回應 409（INVALID_RESERVATION_STATUS）（US1 情境 2、FR-001、SC-001、Edge Cases 重複點擊登記領取或登記歸還）；(2) 以 Asia/Taipei 業務時區檢核預約日期與固定時段結束時間：若預約日期大於台灣當日日期（明日或未來日期的預約提前領取），拒絕操作並回應 400（PICKUP_DATE_NOT_TODAY）（US1 情境 3、FR-002、SC-001、Edge Cases 管理員對非當日預約或過期未領取預約嘗試登記領取）；若預約日期小於台灣當日日期（過去日期未領取），或預約日期為當日但台灣當前時間已達到或超過該固定時段結束時間（endTime，時段已結束卻未領取的過期預約），拒絕補登領取並回應 400（PICKUP_WINDOW_EXPIRED）（US1 情境 4、FR-002、SC-001、Edge Cases 管理員對非當日預約或過期未領取預約嘗試登記領取）。驗證通過時將狀態更新為 checked_out（借用中），寫入實際領取時間 checkedOutAt 與領取經手管理員（checkedOutByUserId、checkedOutByName），回應 200（US1 情境 1、FR-001、SC-001）。未登入時回應 401（UNAUTHORIZED）；一般成員（member）嘗試呼叫登記領取時攔截拒絕並回應 403（FORBIDDEN）（US1 情境 5、FR-003、SC-005）；指定的預約紀錄不存在時回應 404（RESOURCE_NOT_FOUND）。NFR-002、SC-004 執行登記領取回應時間低於 2 秒。
      responses:
        '200':
          description: 現場登記領取成功，狀態更新為 checked_out（借用中）並記錄領取時間與領取經手管理員
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReservationItem'
        '400':
          $ref: '#/components/responses/PickupReservationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PickupOrReturnReservationConflict'
