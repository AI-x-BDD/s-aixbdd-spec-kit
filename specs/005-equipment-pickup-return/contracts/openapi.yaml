      tags: [B4 管理員待審清單、全體借還紀錄查詢與審核核准駁回 API]
      summary: 管理員駁回待審核預約申請並記錄選填駁回原因
      description: 依 FR-009、NFR-001、NFR-002、SC-004、SC-005 允許管理員（admin）對處於 pending_approval（待審核）狀態且尚未到達時段開始時間（依 Asia/Taipei 業務時區解讀）的申請執行駁回，並允許選填駁回原因 rejectReason（上限 200 字）。駁回成功後將申請狀態更新為 rejected（已駁回）、記錄 reviewedBy 審核管理員、reviewedAt 審核時間與 rejectReason 駁回原因，自待審佇列移出並完整保留於歷史紀錄中。當選填的 rejectReason 超過 200 字或路徑參數格式不合法時回應 400（VALIDATION_FAILED）；當預約時段已到達或超過開始時間時拒絕駁回並回應 400（RESERVATION_ALREADY_STARTED）；未登入時回應 401（UNAUTHORIZED）；一般成員（member）嘗試呼叫駁回時回應 403（FORBIDDEN）；申請紀錄不存在時回應 404（RESOURCE_NOT_FOUND）；當申請已被申請人先行取消或已非 pending_approval 狀態時回應 409（INVALID_RESERVATION_STATUS）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectReservationRequest'
      responses:
        '200':
          description: 駁回申請成功並保留歷史紀錄，回傳更新後的預約借還紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReservationItem'
        '400':
          $ref: '#/components/responses/ReviewReservationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReviewReservationConflict'
