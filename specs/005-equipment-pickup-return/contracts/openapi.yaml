openapi: 3.1.0
info:
  title: 設備現場領取與歸還登記及借用狀態檢視 (Equipment Pickup, Return Registration and Loan Status Tracking)
  version: 0.1.0
  description: |
    前端呼叫後端的 HTTP 介面合約，涵蓋 B1 驗證碼挑戰與登入工作階段 API、B2 設備時段借用狀態查詢與預約申請建立 API、B3 成員目前借用中與歷史狀態查詢及領取前取消 API、B4 管理員待審清單、全體借還紀錄查詢與審核核准駁回 API、B5 管理員現場登記領取與登記歸還 API、B6 管理員設備人工審核設定切換 API。需登入的端點透過 HTTP Header `Authorization: Bearer <token>` 傳遞工作階段權杖。
servers:
  - url: http://localhost:3000/api
    description: 本機開發用 Express 伺服器
tags:
  - name: B1 驗證碼挑戰與登入工作階段 API
    description: FR-009 保留前兩版 7 位數區分大小寫英數驗證碼挑戰與登入工作階段維持；NFR-001 全介面與錯誤提示使用臺灣繁體中文；SC-005 前兩次迭代既有功能回歸測試通過率達 100%
  - name: B2 設備時段借用狀態查詢與預約申請建立 API
    description: US3 情境 3；FR-007 將已核准／有效、借用中與當日已歸還視為已占用該設備時段（禁止其他待審申請核准或他人預約同一時段），並對借用人本人回傳「本人借用中」與「本人已歸還」、對其他成員回傳「已被預約」且隱藏借用人身分；FR-009 保留單日 3 個固定時段、7 天內預約範圍與需人工審核／免審核申請建立邏輯；Edge Cases 當日借用提早歸還後的時段占用保護
  - name: B3 成員目前借用中與歷史狀態查詢及領取前取消 API
    description: US3 情境 1、2、4；FR-006 分頁查詢本人名下 6 種狀態紀錄（含領取時間與歸還時間，支援依狀態篩選以提供目前借用中設備與全歷史清單）；FR-008 僅允許成員在時段開始前取消待審核或尚未領取的已核准／有效申請，一旦進入借用中或已歸還即攔截拒絕取消請求並回傳繁體中文錯誤提示；NFR-002 查詢回應時間低於 2 秒；SC-003 借用中或已歸還狀態下成員嘗試取消 100% 攔截拒絕；SC-004 查詢回應時間低於 2 秒；Edge Cases 成員於當日提早領取後，在時段開始前嘗試自行取消預約
  - name: B4 管理員待審清單、全體借還紀錄查詢與審核核准駁回 API
    description: US2 情境 4；FR-005 支援管理員依全部 6 種狀態分頁篩選全體預約與借還紀錄，並回傳領取時間、領取經手管理員、歸還時間、歸還經手管理員與可操作狀態條件；FR-007 核准待審申請時驗證目標時段未被已核准／有效、借用中或當日已歸還紀錄占用；FR-009 保留管理員待審清單查詢、核准衝突重檢與駁回原因記錄功能；NFR-002 依狀態篩選回應時間低於 2 秒；SC-004 操作回應時間低於 2 秒；SC-005 前兩次迭代既有功能回歸測試通過率達 100%；Edge Cases 當日借用提早歸還後的時段占用保護
  - name: B5 管理員現場登記領取與登記歸還 API
    description: US1 情境 1–5；US2 情境 1–3；FR-001 驗證紀錄狀態為已核准／有效後更新為借用中並記錄領取時間與領取經手管理員，非已核准狀態拒絕領取；FR-002 驗證預約日期為當日（依 Asia/Taipei 時區）且當前時間尚未超過該固定時段結束時間，拒絕未來日期提前領取與過期未領補登領取；FR-003 限制登記領取與登記歸還僅供管理員角色執行，一般成員呼叫時拒絕並回傳權限不足提示；FR-004 驗證紀錄狀態為借用中後（不論在固定時段結束前或結束後逾時歸還）更新為已歸還、記錄歸還時間與歸還經手管理員並保留歷史紀錄，非借用中狀態拒絕歸還；NFR-001 臺灣繁體中文錯誤提示明確說明失敗原因；NFR-002 登記領取與登記歸還回應時間低於 2 秒；SC-001 當日未結束已核准預約領取 100% 成功，非已核准、未來日期或過期未領 100% 攔截；SC-002 借用中紀錄（含逾時）歸還 100% 成功，非借用中 100% 攔截；SC-004 操作回應時間低於 2 秒；SC-005 一般成員呼叫領取或歸還功能 100% 攔截拒絕；Edge Cases 管理員對非當日預約或過期未領取預約嘗試登記領取、成員超過固定時段結束時間才逾時歸還設備、重複點擊登記領取或登記歸還
  - name: B6 管理員設備人工審核設定切換 API
    description: FR-009 保留管理員查看與切換預建設備免審核／需人工審核設定並維持既有預約效力功能；SC-005 前兩次迭代既有功能回歸測試通過率達 100%
paths:
  /auth/captcha:
    post:
      operationId: createCaptchaChallenge
      tags: [B1 驗證碼挑戰與登入工作階段 API]
      summary: 產生或手動重整 7 位數區分大小寫英數驗證碼挑戰
      description: 依 FR-009、NFR-001、SC-005 完整保留並向下相容前兩版 7 位數區分大小寫英數驗證碼挑戰機制，隨機產生一組由完整大小寫英文與阿拉伯數字（A–Z、a–z、0–9）組成且同時包含英文與數字的 7 位數驗證碼挑戰，有效期限為建立後 5 分鐘。支援未登入使用者首次開啟登入頁取得驗證碼，或傳入選填的 previousChallengeId 手動重整更換驗證碼；手動重整時原驗證碼挑戰立即標記失效並回傳新挑戰（FR-009）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaptchaChallengeRequest'
      responses:
        '201':
          description: 成功產生新的 7 位數英數驗證碼挑戰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaChallengeResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      operationId: login
      tags: [B1 驗證碼挑戰與登入工作階段 API]
      summary: 以預建帳號、密碼與 7 位數區分大小寫英數驗證碼登入
      description: 依 US1、US2、US3、FR-009、NFR-001、SC-005 驗證預建一般成員（member）或管理員（admin）帳號（username）、密碼（password）、驗證碼挑戰識別碼（challengeId）與 7 位數英數驗證碼（captchaCode）。驗證時嚴格區分驗證碼英文大小寫（例如 a123456 與 A123456 視為不同），且一旦送出登入驗證（無論成功或失敗），原驗證碼挑戰立即單次消耗並失效。當驗證碼挑戰不存在、超過 5 分鐘有效期限或已使用／已重整失效時回應 400（CAPTCHA_EXPIRED）；當驗證碼字元或英文大小寫不符時回應 400（CAPTCHA_MISMATCH）；當帳號或密碼不正確時回應 401（INVALID_CREDENTIALS）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登入成功，回傳工作階段 Bearer token 與使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/LoginBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [B1 驗證碼挑戰與登入工作階段 API]
      summary: 查詢目前登入工作階段的使用者資訊
      description: 依 US1、US2、US3、FR-003、FR-009、NFR-001、SC-005 驗證目前工作階段的 Bearer token 並回傳已登入使用者資訊（含角色 member 或 admin），供前端重新載入頁面時維持工作階段與角色權限守門；未登入或工作階段已失效時回應 401（UNAUTHORIZED）。
      responses:
        '200':
          description: 目前登入的使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      tags: [B1 驗證碼挑戰與登入工作階段 API]
      summary: 登出並使目前工作階段立即失效
      description: 依 FR-009、NFR-001、SC-005 結束目前登入工作階段並使 Bearer token 立即失效；未登入或工作階段已失效時回應 401（UNAUTHORIZED）。
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /equipments:
    get:
      operationId: listEquipments
      tags: [B2 設備時段借用狀態查詢與預約申請建立 API]
      summary: 分頁查詢預建單件設備清單、人工審核模式標示與指定日期的固定時段 6 態借用狀態
      description: 依 US3 情境 3、FR-007、FR-009、NFR-001、NFR-002、SC-003、SC-004、SC-005 分頁查詢組織內預建的單件獨立設備清單（含唯一設備編號、設備名稱、分類、可用狀態，以及 requiresApproval 免審核／需人工審核標示），並搭配所選日期（date，依 Asia/Taipei 業務時區解讀）回傳每台設備於當日 3 個固定時段（上午 09:00–12:00、下午 13:00–17:00、晚間 18:00–21:00）對當前登入成員的 6 態時段狀態（slotStatus：AVAILABLE 可預約、MY_PENDING 本人待審核、MY_CONFIRMED 本人已預約、MY_CHECKED_OUT 本人借用中、MY_RETURNED 本人已歸還、OCCUPIED 已被預約；同時向下相容提供 availabilityStatus：available、pending_by_me、booked_by_me、checked_out_by_me、returned_by_me、booked_by_others）。當該時段存在處於 confirmed（已核准／有效）、checked_out（借用中）或當日已履行完畢之 returned（已歸還）紀錄時，系統將其視為已占用該設備時段（Edge Cases 當日借用提早歸還後的時段占用保護，即使成員於固定時段結束前提前歸還並登記為 returned，該時段仍視為已履約結案而不重新開放預約，isBookable 為 false）：對借用人本人區分回傳 MY_CONFIRMED（booked_by_me）、MY_CHECKED_OUT（checked_out_by_me）或 MY_RETURNED（returned_by_me），對其他成員則統一回傳 OCCUPIED（booked_by_others）且不揭露借用人身分（US3 情境 3、FR-007）。當其他成員僅送出 pending_approval 待審申請但尚未經管理員核准占用時，該時段對當前成員仍回傳 AVAILABLE（available）並允許送出申請（FR-009）。排序依設備編號 equipmentCode 由小到大（ASC）排序，equipmentCode 相同時依唯一欄位 id 由小到大（ASC）排序；page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。當 page 或 pageSize 不合法時回應 400（PAGINATION_INVALID）；未登入時回應 401（UNAUTHORIZED）。
      parameters:
        - name: date
          in: query
          required: true
          description: 查詢時段借用狀態的單一日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
          schema:
            type: string
            format: date
        - name: category
          in: query
          required: false
          description: 選填的設備分類篩選條件
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: requiresApproval
          in: query
          required: false
          description: 選填的設備人工審核模式篩選條件（false 免審核、true 需人工審核）
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: 要查詢的頁碼，從 1 開始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每頁筆數，預設 20，上限 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分頁的單件設備、人工審核模式標示與單日固定時段 6 態借用狀態清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentAvailabilityPage'
        '400':
          $ref: '#/components/responses/PaginationOrQueryInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reservations:
    get:
      operationId: listMyReservations
      tags: [B3 成員目前借用中與歷史狀態查詢及領取前取消 API]
      summary: 分頁查詢目前登入成員本人的目前借用中設備與 6 態預約借還紀錄清單
      description: 依 US3 情境 1–2、FR-006、FR-009、NFR-001、NFR-002、SC-003、SC-004、SC-005 分頁查詢目前登入成員名下的預約與借用紀錄，完整回傳待審核（pending_approval）、已核准／有效（confirmed）、借用中（checked_out）、已歸還（returned）、已駁回（rejected）與已取消（cancelled）共 6 種狀態、設備資訊、預約日期、固定時段、審核管理員、審核時間、駁回原因、領取時間（checkedOutAt）、領取經手管理員（checkedOutByUserId、checkedOutByName）、歸還時間（returnedAt）、歸還經手管理員（returnedByUserId、returnedByName）、建立時間、取消時間與是否可取消（canCancel），支援依 status 篩選（例如傳入 status=checked_out 供「我的預約」頁頂「目前借用中設備」醒目區塊取得本人目前借用中設備清單，或依全部與 6 種狀態切換篩選歷史清單，FR-006）。排序依預約日期 reservationDate 由新到舊（DESC）排序，reservationDate 相同時依固定時段順序 slotSortOrder 由小到大（ASC）排序，slotSortOrder 相同時依建立時間 createdAt 由新到舊（DESC）排序，createdAt 相同時依唯一欄位 id 由小到大（ASC）排序；page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。當 page 或 pageSize 不合法時回應 400（PAGINATION_INVALID）；未登入時回應 401（UNAUTHORIZED）。NFR-002、SC-004 查詢回應時間低於 2 秒。
      parameters:
        - name: status
          in: query
          required: false
          description: 選填的預約與借用狀態篩選條件（pending_approval 待審核、confirmed 已核准／有效、checked_out 借用中、returned 已歸還、rejected 已駁回、cancelled 已取消）
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - name: page
          in: query
          required: false
          description: 要查詢的頁碼，從 1 開始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每頁筆數，預設 20，上限 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分頁的成員個人目前借用中與 6 態預約借還紀錄清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPage'
        '400':
          $ref: '#/components/responses/PaginationOrQueryInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createReservation
      tags: [B2 設備時段借用狀態查詢與預約申請建立 API]
      summary: 建立單件設備於指定日期與固定時段的待審核申請或免審核預約
      description: 依 US3 情境 3、FR-004、FR-007、FR-009、NFR-001、NFR-002、SC-004、SC-005 允許已登入的成員選擇當日起算 7 天內（含當日，依 Asia/Taipei 業務時區解讀）尚未開始且未被已占用狀態（confirmed 已核准／有效、checked_out 借用中或當日已履約完畢之 returned 已歸還）占用的設備固定時段送出申請，並依目標設備目前的 requiresApproval 設定決定結果：當設備設定為「需人工審核」（requiresApproval 為 true）時，建立狀態為 pending_approval（待審核）的預約申請且不鎖定時段，回應 201；當設備設定為「免審核」（requiresApproval 為 false）時，直接建立狀態為 confirmed（已核准／有效）的預約並立即鎖定占用該時段，回應 201（FR-009）。當成員於固定時段結束前提前歸還設備並由管理員登記為 returned 時，該設備時段視為已完成借用履約結案，不重新開放他人或本人重複預約同一時段（Edge Cases 當日借用提早歸還後的時段占用保護，FR-004、FR-007）。當選擇過去日期或超過當日起 7 天的日期時回應 400（DATE_OUT_OF_RANGE）；當選擇已開始或已結束的固定時段時回應 400（SLOT_ALREADY_STARTED）；未登入時回應 401（UNAUTHORIZED）；設備或固定時段不存在時回應 404（RESOURCE_NOT_FOUND）；當同一成員已對同一設備、同一日期與同一固定時段持有一筆未結束的 pending_approval、confirmed 或 checked_out 紀錄時拒絕重複申請並回應 409（DUPLICATE_PENDING_OR_ACTIVE_RESERVATION）（FR-007、FR-009）；當該時段已被其他 confirmed、checked_out 或當日已履約 returned 紀錄占用時回應 409（RESERVATION_CONFLICT），或設備不可用時回應 409（EQUIPMENT_UNAVAILABLE）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: 預約申請建立成功（免審核設備立即為 confirmed 並占用時段；需人工審核設備為 pending_approval 且核准前不占用時段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/CreateReservationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
