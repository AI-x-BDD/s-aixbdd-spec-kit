      tags: [B3 成員目前借用中與歷史狀態查詢及領取前取消 API]
      summary: 取消本人尚未領取且尚未開始的待審核或已核准／有效預約申請
      description: 依 US3 情境 4、FR-001、FR-008、FR-009、NFR-001、SC-003、SC-005 允許已登入的成員在預約時段開始時間之前（依 Asia/Taipei 業務時區解讀）取消屬於本人且處於 pending_approval（待審核）或尚未領取之 confirmed（已核准／有效）狀態的申請：若原為 confirmed 則立即釋出該設備時段供後續重新申請，若原為 pending_approval 則自管理員待審清單移除，兩者皆將狀態更新為 cancelled、記錄 cancelledAt 取消時間並完整保留歷史紀錄。一旦該筆預約已被管理員完成現場登記領取而進入 checked_out（借用中）或 returned（已歸還）狀態，即使當日該固定時段尚未正式開始或尚未結束（Edge Cases 成員於當日提早領取後，在時段開始前嘗試自行取消預約），系統一律嚴格禁止成員取消並立即攔截拒絕，回應 409（RESERVATION_ALREADY_CHECKED_OUT）（US3 情境 4、FR-008、SC-003）。未登入時回應 401（UNAUTHORIZED）；當一般成員嘗試取消非本人擁有的預約申請時回應 403（FORBIDDEN）；預約紀錄不存在時回應 404（RESOURCE_NOT_FOUND）；當尚未領取的預約已到達或超過時段開始時間時回應 409（RESERVATION_ALREADY_STARTED），當預約已處於 cancelled 狀態時回應 409（RESERVATION_ALREADY_CANCELLED），當預約處於 rejected（已駁回）狀態時回應 409（INVALID_RESERVATION_STATUS）。
      responses:
        '200':
          description: 取消申請成功，回傳更新為 cancelled 的預約紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CancelReservationConflict'
