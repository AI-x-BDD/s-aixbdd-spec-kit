<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定秘密答案｜1A2B 對戰</title>
<style>
  /* 視覺風格（ui/plan.md 第 2 節） */
  :root {
    --bg: #F3F2FF;
    --surface: #FFFFFF;
    --ink: #24224A;
    --muted: #6D6A92;
    --line: #E2E0F5;
    --primary: #5B5BD6;
    --primary-soft: #E7E6FB;
    --danger: #D2454B;
    --danger-soft: #FBE6E7;
    --pending: #A0710B;
    --pending-soft: #FFF4D6;
    --success: #2B9468;
    --success-soft: #DEF3EA;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(36, 34, 74, .06), 0 6px 20px rgba(91, 91, 214, .08);
    --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root {
    --accent: #FFC83D;
    --accent-soft: #FFF4D6;
    --accent-ink: #5C4300;
    --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font); }
  a { color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .site-header { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
  .site-header .inner { max-width: 720px; margin: 0 auto; padding: 0 16px; height: 60px; display: flex; align-items: center; gap: 12px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; color: var(--primary); text-decoration: none; white-space: nowrap; }
  .brand::before { content: "A"; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-family: var(--mono); font-size: 16px; transform: rotate(-8deg); }
  .site-nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; }
  .site-nav a { padding: 6px 12px; border-radius: 999px; color: var(--muted); text-decoration: none; white-space: nowrap; font-size: 14px; }
  .site-nav a[aria-current="page"] { color: var(--primary); background: var(--primary-soft); font-weight: 700; }
  .me-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--bg); font-size: 14px; white-space: nowrap; }
  @media (max-width: 640px) { .me-chip { display: none; } .brand { font-size: 0; gap: 0; } .site-nav a { padding: 6px 8px; } }

  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 96px; }
  h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.3; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .form-card { padding: 24px; margin-bottom: 16px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-block { width: 100%; }

  .banner { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; font-weight: 600; }
  .banner-info { background: var(--primary-soft); color: var(--primary); }
  .banner-accent { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--accent); }
  .banner-success { background: var(--success-soft); color: var(--success); }
  .banner-danger { background: var(--danger-soft); color: var(--danger); }

  .field { margin-bottom: 18px; }
  .field label { display: block; margin-bottom: 6px; font-weight: 700; }
  .field input { width: 100%; height: 48px; padding: 0 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); font: inherit; }
  .field input:focus { outline: 3px solid var(--primary-soft); border-color: var(--primary); }
  .field input:disabled { background: var(--bg); color: var(--muted); }
  .field.has-error input { border-color: var(--danger); outline-color: var(--danger-soft); }
  .field .hint { margin-top: 4px; color: var(--muted); font-size: 13px; }
  .field .error { margin-top: 4px; color: var(--danger); font-size: 14px; font-weight: 600; }
  .big-digits { height: 64px !important; font-family: var(--mono); font-size: 30px !important; letter-spacing: .5em; text-align: center; padding-left: .5em !important; }

  .avatar { display: inline-grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 800; }
  .avatar-guest { background: var(--accent); color: var(--accent-ink); }
  .avatar-sm { width: 26px; height: 26px; font-size: 13px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; vertical-align: middle; }
  .tag-host { background: var(--primary-soft); color: var(--primary); }
  .tag-me { background: var(--bg); color: var(--muted); }
  .code-chip { display: inline-block; padding: 2px 12px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 800; letter-spacing: .15em; }
  .digit-boxes { display: inline-flex; gap: 6px; }
  .digit-boxes span { display: inline-grid; place-items: center; width: 36px; height: 44px; border-radius: 10px; background: var(--bg); border: 2px solid var(--line); font-family: var(--mono); font-size: 22px; font-weight: 800; }
  .digit-boxes.hidden-digits span { color: var(--muted); }
  .wait-line { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0; color: var(--muted); font-weight: 600; }

  .spinner { width: 20px; height: 20px; flex-shrink: 0; border: 3px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(36, 34, 74, .4); }
  .modal-box { width: 100%; max-width: 400px; padding: 24px; }
  .modal-box p { margin: 0 0 20px; color: var(--muted); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  /* 雛形狀態面板 */
  .proto-panel { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 13px; }
  .proto-toggle { padding: 8px 14px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font: inherit; cursor: pointer; box-shadow: var(--shadow); }
  .proto-body { width: 220px; max-height: 60vh; overflow: auto; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .proto-body p { margin: 0 0 6px; color: var(--muted); }
  .proto-body label { display: flex; gap: 8px; padding: 3px 0; cursor: pointer; }
  @media (max-width: 640px) { .proto-panel { top: 68px; bottom: auto; flex-direction: column-reverse; } }

  /* 設定秘密答案 */
  .stage-head { text-align: center; margin: 4px 0 20px; }
  .stage-head .code-chip { font-size: 13px; letter-spacing: .08em; margin-bottom: 10px; }
  .stage-head p { margin: 0; }
  .ready-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .ready-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .ready-card .name { font-weight: 800; }
  .ready-card .status { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .ready-card .status.done { color: var(--success); }
  .ready-card .status .spinner { width: 14px; height: 14px; border-width: 2px; }
  .locked { padding: 28px 24px; margin-bottom: 16px; text-align: center; }
  .locked .lock { display: inline-grid; place-items: center; width: 52px; height: 52px; margin-bottom: 8px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); }
  .locked .lock svg { width: 26px; height: 26px; }
  .locked .label { margin-bottom: 10px; color: var(--muted); font-size: 14px; }
  .locked .digit-boxes { margin-bottom: 18px; }
  .locked .digit-boxes span { width: 48px; height: 58px; font-size: 30px; background: var(--surface); border-color: var(--primary); color: var(--primary); }
  .private-note { margin: -6px 0 18px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html">1A2B 對戰</a>
    <nav class="site-nav" aria-label="主要導覽">
      <a href="index.html">進站</a>
      <a href="room.html">房間</a>
      <a href="secret.html" aria-current="page">設定答案</a>
      <a href="battle.html">對戰</a>
    </nav>
    <span class="me-chip" id="me-chip" hidden></span>
  </div>
</header>

<main>
  <section class="stage-head">
    <span class="code-chip num" id="pair-code"></span>
    <h1>設定你的秘密答案</h1>
    <p class="muted">設定 4 個不重複的數字，可以 0 開頭，只有你看得到。</p>
  </section>

  <section class="ready-row" aria-live="polite">
    <div class="card ready-card">
      <span class="avatar" id="me-avatar"></span>
      <div><div class="name" id="me-name"></div><div class="status" id="me-status"></div></div>
    </div>
    <div class="card ready-card">
      <span class="avatar avatar-guest" id="opp-avatar"></span>
      <div><div class="name" id="opp-name"></div><div class="status" id="opp-status"></div></div>
    </div>
  </section>

  <div id="opp-ready" class="banner banner-success" role="status" hidden></div>
  <div id="ready-banner" class="banner banner-accent" role="status" hidden></div>

  <form id="secret-form" class="card form-card" novalidate>
    <div class="field" data-field="secret">
      <label for="secret">秘密答案</label>
      <input id="secret" name="secret" class="big-digits" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="····">
      <div class="error" hidden></div>
    </div>
    <p class="private-note">對手只會看到「已設定」，看不到你的數字。</p>
    <button id="submit-btn" class="btn btn-primary btn-block" type="submit">確定答案</button>
  </form>

  <section id="locked" class="card locked" hidden>
    <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <div class="label">你的答案</div>
    <div class="digit-boxes" id="my-secret"></div>
    <p class="wait-line" id="locked-wait"><span class="spinner"></span>等待對手設定答案</p>
  </section>

  <button id="leave-btn" class="btn btn-ghost btn-block" type="button">離開房間</button>
</main>

<div id="leave-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="leave-title" hidden>
  <div class="card modal-box">
    <h2 id="leave-title">確定要離開嗎？</h2>
    <p>離開後這局會取消，不判定勝負。</p>
    <div class="modal-actions">
      <button id="stay-btn" class="btn" type="button">留下來</button>
      <a class="btn btn-danger" href="index.html">離開</a>
    </div>
  </div>
</div>

<div id="aborted-modal" class="modal" role="alertdialog" aria-modal="true" aria-labelledby="aborted-title" hidden>
  <div class="card modal-box">
    <h2 id="aborted-title">這局無法繼續</h2>
    <p id="aborted-desc"></p>
    <div class="modal-actions">
      <a class="btn btn-primary" href="index.html?from=aborted">回到入口</a>
    </div>
  </div>
</div>

<aside class="proto-panel" aria-label="雛形狀態">
  <div class="proto-body" hidden></div>
  <button class="proto-toggle" type="button" aria-expanded="false"></button>
</aside>

<script>
  // 假資料：與 index.html、room.html、battle.html 同一場對局（阿哲 為房主，答案 7310；小米 為對手）
  const MOCK = {
    me: { nickname: '阿哲', secret: '7310', isHost: true },
    opponent: { nickname: '小米' },
    pairCode: '5208',
    invalidSecret: '1123',
  };

  function secretError(v) {
    if (!/^\d{4}$/.test(v)) return '答案要是 4 位數字（0–9）';
    const dup = [...v].find((d, i) => v.indexOf(d) !== i);
    return dup ? `答案要是 4 個不重複的數字，${dup} 重複了` : '';
  }

  const $ = sel => document.querySelector(sel);
  function setMe(name) {
    const chip = $('#me-chip');
    chip.hidden = !name;
    chip.innerHTML = name ? `<span class="avatar avatar-sm">${name[0]}</span>${name}` : '';
  }
  function later(ms, fn) { timers.push(setTimeout(fn, ms)); }
  let timers = [];
  let submitted = false;
  let oppDone = false;
  const form = $('#secret-form');
  const input = $('#secret');
  const submitBtn = $('#submit-btn');
  const field = input.closest('.field');

  function setStatus(who, done) {
    const el = $(who === 'me' ? '#me-status' : '#opp-status');
    el.className = `status${done ? ' done' : ''}`;
    el.innerHTML = done ? '✓ 已設定' : '<span class="spinner"></span>設定中…';
  }

  // view：input 輸入答案、locked 已送出答案
  function reset({ view = 'input', value = '', opp = false } = {}) {
    submitted = false;
    oppDone = opp;
    setMe(MOCK.me.nickname);
    $('#pair-code').textContent = `配對碼 ${MOCK.pairCode}`;
    $('#me-avatar').textContent = MOCK.me.nickname[0];
    $('#me-name').textContent = `${MOCK.me.nickname}（你）`;
    $('#opp-avatar').textContent = MOCK.opponent.nickname[0];
    $('#opp-name').textContent = MOCK.opponent.nickname;
    setStatus('me', view === 'locked');
    setStatus('opp', opp);
    input.value = value;
    clearError();
    setSubmitting(false);
    form.hidden = view !== 'input';
    $('#locked').hidden = view !== 'locked';
    $('#my-secret').innerHTML = [...MOCK.me.secret].map(d => `<span>${d}</span>`).join('');
    $('#locked-wait').hidden = opp;
    $('#opp-ready').hidden = !(opp && view === 'input');
    $('#opp-ready').textContent = `${MOCK.opponent.nickname} 已經準備好了，換你設定`;
    $('#ready-banner').hidden = true;
    $('#leave-btn').hidden = false;
    $('#leave-modal').hidden = true;
    $('#aborted-modal').hidden = true;
  }

  function clearError() {
    field.classList.remove('has-error');
    input.setAttribute('aria-invalid', 'false');
    field.querySelector('.error').hidden = true;
  }

  function validate(focus) {
    const message = secretError(input.value);
    field.classList.toggle('has-error', Boolean(message));
    input.setAttribute('aria-invalid', String(Boolean(message)));
    const error = field.querySelector('.error');
    error.textContent = message;
    error.hidden = !message;
    if (message && focus) input.focus();
    return !message;
  }

  function setSubmitting(on) {
    submitBtn.disabled = on;
    input.disabled = on;
    submitBtn.innerHTML = on ? '<span class="spinner"></span>送出中…' : '確定答案';
  }

  function showBothReady() {
    reset({ view: 'locked', opp: true });
    $('#ready-banner').innerHTML = `雙方都準備好了！${MOCK.me.isHost ? MOCK.me.nickname : MOCK.opponent.nickname} 先猜`;
    $('#ready-banner').hidden = false;
    $('#leave-btn').hidden = true;
    later(2500, () => { location.href = 'battle.html'; });
  }

  function waitForOpponent() {
    later(3000, () => { showBothReady(); markState('ready'); });
  }

  function showAborted() {
    reset({ view: 'locked' });
    $('#locked-wait').hidden = true;
    $('#aborted-desc').textContent = `${MOCK.opponent.nickname} 離開了房間，這局無法繼續，不判定勝負。`;
    $('#aborted-modal').hidden = false;
  }

  form.addEventListener('submit', event => {
    event.preventDefault();
    submitted = true;
    if (!validate(true)) { markState('invalid'); return; }
    MOCK.me.secret = input.value;
    setSubmitting(true);
    markState('submitting');
    later(700, () => {
      if (oppDone) { showBothReady(); markState('ready'); return; }
      reset({ view: 'locked' });
      markState('waiting');
      waitForOpponent();
    });
  });

  input.addEventListener('input', () => { if (submitted) validate(false); });
  $('#leave-btn').addEventListener('click', () => { $('#leave-modal').hidden = false; markState('leave'); });
  $('#stay-btn').addEventListener('click', () => { $('#leave-modal').hidden = true; markState(form.hidden ? 'waiting' : 'input'); });

  // 雛形狀態（ui/plan.md 第 4、5 節）
  const STATES = [
    { key: 'input', label: '設定秘密答案', apply: () => reset() },
    { key: 'submitting', label: '送出答案中', apply: () => { reset({ value: MOCK.me.secret }); setSubmitting(true); } },
    { key: 'opp-ready', label: '對手先完成設定', apply: () => reset({ opp: true }) },
    { key: 'waiting', label: '等待對手設定答案', apply: () => { reset({ view: 'locked' }); waitForOpponent(); } },
    { key: 'ready', label: '雙方設定完成', apply: () => showBothReady() },
    { key: 'leave', label: '確認離開房間', apply: () => { reset(); $('#leave-modal').hidden = false; } },
    { key: 'invalid', label: '欄位驗證錯誤', apply: () => { reset({ value: MOCK.invalidSecret }); submitted = true; validate(false); } },
    { key: 'aborted', label: '對手在設定階段離開', apply: () => showAborted() },
  ];

  const protoBody = $('.proto-body');
  const protoToggle = $('.proto-toggle');
  protoBody.innerHTML = '<p>切換畫面狀態</p>' + STATES.map(s =>
    `<label><input type="radio" name="proto-state" value="${s.key}">${s.label}</label>`).join('');
  protoToggle.addEventListener('click', () => {
    protoBody.hidden = !protoBody.hidden;
    protoToggle.setAttribute('aria-expanded', String(!protoBody.hidden));
  });
  protoBody.addEventListener('change', event => applyState(event.target.value));

  function markState(key) {
    protoBody.querySelector(`input[value="${key}"]`).checked = true;
    protoToggle.textContent = '雛形狀態：' + STATES.find(s => s.key === key).label;
  }

  function applyState(key) {
    timers.forEach(clearTimeout);
    timers = [];
    STATES.find(s => s.key === key).apply();
    markState(key);
  }

  applyState('input');
</script>
</body>
</html>
