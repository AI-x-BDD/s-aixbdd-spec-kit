      - B4 前五版既有 API（驗證碼登入、設備與時段、預約、改期、審核、領取歸還、設備狀態）
      summary: 管理員切換設備的免審核／需人工審核設定
      description: |
        依 FR-020、SC-007 與 US1 情境 10，完整保留前五版的人工審核設定切換，路徑、請求、回應與錯誤碼和 `specs/007-equipment-maintenance-retire/contracts/openapi.yaml` 的同名 operation 相同，本次不修改。
        既有預約、借還紀錄與改期審核中申請維持原狀態，切換後的新預約與新改期依最新設定處理；只改 requiresApproval，不改設備 status。
        欄位格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；設備不存在時回應 404（RESOURCE_NOT_FOUND）；依 FR-019 沿用既有 requireAdmin 角色檢查，一般成員呼叫時回應 403（FORBIDDEN）。錯誤訊息使用臺灣繁體中文。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentApprovalModeRequest'
      responses:
        '200':
          description: 成功更新設備人工審核設定，回傳更新後的設備
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEquipmentSetting'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/equipments/{equipmentId}/status-change-preview:
    parameters:
    - name: equipmentId
      in: path
      required: true
      description: 設備唯一識別碼
      schema:
        type: string
        format: uuid
    get:
      operationId: getEquipmentStatusChangePreview
      tags:
      - B4 前五版既有 API（驗證碼登入、設備與時段、預約、改期、審核、領取歸還、設備狀態）
      summary: 管理員預覽設為送修或停用時將取消的預約數與將失效的改期申請數
      description: |
        依 FR-020、SC-007 與 US1 情境 10，完整保留前五版的設備狀態變更預覽，路徑、請求、回應與錯誤碼和 `specs/007-equipment-maintenance-retire/contracts/openapi.yaml` 的同名 operation 相同，本次不修改。
        本操作只讀取：處理前先讓到期的改期申請失效，再回傳設為 targetStatus 時將取消的預約數 cancelCount、將失效的改期申請數 expireCount，以及借用中預約 hasCheckedOutReservation、checkedOutReservations（含逾期未還，isOverdue 標示是否已超過時段結束時間）。逾期借用仍是 checked_out，所以設備有逾期未還的借用時，確認視窗照舊提示先登記歸還。
        targetStatus 等於設備目前狀態時回應 409（EQUIPMENT_STATUS_UNCHANGED）；targetStatus 缺少或不是 maintenance、retired，或路徑參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；設備不存在時回應 404（RESOURCE_NOT_FOUND）；依 FR-019 沿用既有 requireAdmin 角色檢查，一般成員呼叫時回應 403（FORBIDDEN）。錯誤訊息使用臺灣繁體中文。
      parameters:
      - name: targetStatus
        in: query
        required: true
        description: 要預覽的目標狀態（maintenance 送修中、retired 停用）；恢復可用不需要預覽
        schema:
          type: string
          enum:
          - maintenance
          - retired
      responses:
        '200':
          description: 設備目前狀態、將取消的預約數、將失效的改期申請數與借用中預約資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentStatusChangePreview'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EquipmentStatusUnchanged'
  /admin/equipments/{equipmentId}/status:
    parameters:
    - name: equipmentId
      in: path
      required: true
      description: 設備唯一識別碼
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateEquipmentStatus
      tags:
      - B4 前五版既有 API（驗證碼登入、設備與時段、預約、改期、審核、領取歸還、設備狀態）
      summary: 管理員把設備設為送修、停用或恢復可用（送修與停用時同一交易內取消受影響預約並使改期申請失效）
      description: |
        依 FR-020、SC-007 與 US1 情境 10，完整保留前五版的設備送修、停用與恢復可用，路徑、請求、回應與錯誤碼和 `specs/007-equipment-maintenance-retire/contracts/openapi.yaml` 的同名 operation 相同，本次不修改。
        在單一互動式交易（READ COMMITTED）內完成，交易第一個語句以 `SELECT status FROM equipments ... FOR UPDATE` 鎖定設備列，與新預約、核准待審預約、即時改期與核准改期申請序列化。targetStatus 為 maintenance 或 retired 時必須帶 expectedCurrentStatus、expectedCancelCount、expectedExpireCount：設備有 checked_out 預約（含逾期未還）時回應 409（EQUIPMENT_ON_LOAN）；目前狀態或重新計算的數量和 expected 欄位不同時回應 409（EQUIPMENT_STATE_CHANGED）；通過時取消時段結束時間晚於目前時間的 pending_approval 與 confirmed 預約（cancelReason 為 equipment_maintenance 或 equipment_retired），使這些預約的改期審核中申請失效，更新設備 status 並新增一筆狀態變更紀錄。targetStatus 為 available 時只更新 status 並新增狀態變更紀錄，不復原已取消的預約。目標狀態等於目前狀態時回應 409（EQUIPMENT_STATUS_UNCHANGED）。
        欄位缺少或格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；設備不存在時回應 404（RESOURCE_NOT_FOUND）；依 FR-019 沿用既有 requireAdmin 角色檢查，一般成員呼叫時回應 403（FORBIDDEN）。錯誤訊息使用臺灣繁體中文並說明失敗原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentStatusRequest'
      responses:
        '200':
          description: 狀態變更成功，回傳更新後的設備、本次狀態變更紀錄與失效的改期申請數
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentStatusChangeResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UpdateEquipmentStatusConflict'
components:
  schemas:
    Error:
      type: object
      description: 本合約所有錯誤回應共用的格式
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 錯誤碼，指出錯誤情況
          enum:
          - VALIDATION_FAILED
          - PAGINATION_INVALID
          - CAPTCHA_MISMATCH
          - CAPTCHA_EXPIRED
          - INVALID_CREDENTIALS
          - UNAUTHORIZED
          - FORBIDDEN
          - RESOURCE_NOT_FOUND
          - DATE_OUT_OF_RANGE
          - SLOT_ALREADY_STARTED
          - EQUIPMENT_UNAVAILABLE
          - RESERVATION_CONFLICT
          - DUPLICATE_PENDING_OR_ACTIVE_RESERVATION
          - INVALID_RESERVATION_STATUS
          - PICKUP_DATE_NOT_TODAY
          - PICKUP_WINDOW_EXPIRED
          - RESERVATION_ALREADY_CHECKED_OUT
          - RESERVATION_ALREADY_STARTED
          - RESERVATION_ALREADY_CANCELLED
          - RESCHEDULE_NOT_ALLOWED
          - RESCHEDULE_TARGET_INVALID
          - RESCHEDULE_SLOT_CONFLICT
          - RESCHEDULE_ALREADY_PENDING
          - INVALID_RESCHEDULE_STATUS
          - EQUIPMENT_ON_LOAN
          - EQUIPMENT_STATUS_UNCHANGED
          - EQUIPMENT_STATE_CHANGED
          - OVERDUE_LOAN_RETURNED
          - OVERDUE_NOTIFICATION_NOT_RESENDABLE
        message:
          type: string
          description: 給使用者看的繁體中文錯誤訊息
    EquipmentStatus:
      type: string
      description: 設備的 3 種狀態（available 可用、maintenance 送修中、retired 停用）；只有 available 可以被預約。006 的 unavailable 已無損遷移為 retired
      enum:
      - available
      - maintenance
      - retired
    MemberVisibleEquipmentStatus:
      type: string
      description: 成員設備清單可見的設備狀態（available 可用、maintenance 送修中）；retired 停用設備不出現在成員清單
      enum:
      - available
      - maintenance
    ReservationStatus:
      type: string
      description: 預約與借用紀錄的 6 種狀態（pending_approval 待審核、confirmed 已核准／有效、checked_out 借用中、returned 已歸還、rejected 已駁回、cancelled 已取消），名稱與 006 相同
      enum:
      - pending_approval
      - confirmed
      - checked_out
      - returned
      - rejected
      - cancelled
    ReservationCancelReason:
      type: string
      description: 預約的取消原因（member_cancelled 成員取消、equipment_maintenance 設備送修、equipment_retired 設備停用）；006 以前的既有取消紀錄遷移為 member_cancelled
      enum:
      - member_cancelled
      - equipment_maintenance
      - equipment_retired
    RescheduleRequestStatus:
      type: string
      description: 改期申請的 5 種狀態（pending_approval 改期審核中、approved 改期成功、rejected 改期被駁回、withdrawn 改期已撤回、expired 改期已失效）
      enum:
      - pending_approval
      - approved
      - rejected
      - withdrawn
      - expired
    RescheduleExpireReason:
      type: string
      description: 改期申請的失效原因（original_slot_started 原時段開始、new_slot_started 新時段開始、reservation_cancelled 原預約已取消、reservation_checked_out 原預約被登記領取）；原預約因設備送修或停用被取消時沿用 reservation_cancelled
      enum:
      - original_slot_started
      - new_slot_started
      - reservation_cancelled
      - reservation_checked_out
    SlotStatus:
      type: string
      description: 單日固定時段對目前登入成員的狀態（AVAILABLE 可預約、MY_PENDING 本人待審核、MY_CONFIRMED 本人已預約、MY_CHECKED_OUT 本人借用中、MY_RETURNED 本人已歸還、OCCUPIED 已被預約、MY_RESCHEDULE_PENDING 本人改期審核中），與 006 相同；設備送修中時以設備 status 與 isBookable 表示，不新增時段狀態
      enum:
      - AVAILABLE
      - MY_PENDING
      - MY_CONFIRMED
      - MY_CHECKED_OUT
      - MY_RETURNED
      - OCCUPIED
      - MY_RESCHEDULE_PENDING
    TimeSlotSummary:
      type: object
      description: 固定時段摘要（上午 09:00–12:00、下午 13:00–17:00、晚間 18:00–21:00）
      required:
      - slotId
      - slotName
      - startTime
      - endTime
      - sortOrder
      properties:
        slotId:
          type: string
          format: uuid
          description: 固定時段唯一識別碼
        slotName:
          type: string
          enum:
          - 上午
          - 下午
          - 晚間
          description: 固定時段名稱
        startTime:
          type: string
          enum:
          - 09:00
          - '13:00'
          - '18:00'
          description: 時段開始時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        endTime:
          type: string
          enum:
          - '12:00'
          - '17:00'
          - '21:00'
          description: 時段結束時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        sortOrder:
          type: integer
          minimum: 1
          maximum: 3
          description: 單日固定時段排序順序（1 上午、2 下午、3 晚間）
    CreateCaptchaChallengeRequest:
      type: object
      description: 手動重整驗證碼時可選填傳入上一筆驗證碼挑戰 ID 使其立即失效
      properties:
        previousChallengeId:
          type: string
          format: uuid
          description: 要立即作廢的上一筆驗證碼挑戰唯一識別碼
    CaptchaChallengeResponse:
      type: object
      description: 7 位數區分大小寫英數驗證碼挑戰資訊
      required:
      - challengeId
      - captchaCode
      - expiresAt
      properties:
        challengeId:
          type: string
          format: uuid
          description: 驗證碼挑戰唯一識別碼
        captchaCode:
          type: string
          minLength: 7
          maxLength: 7
          pattern: ^(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9]{7}$
          description: 同時包含英文與數字的 7 位數驗證碼（區分大小寫）
        expiresAt:
          type: string
          format: date-time
          description: 驗證碼挑戰到期時間（建立後 5 分鐘，ISO 8601 UTC）
    LoginRequest:
      type: object
      description: 帳號密碼與 7 位數驗證碼登入請求
      required:
      - username
      - password
      - challengeId
      - captchaCode
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 預建使用者登入帳號（例如 lin.yating）
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: 登入密碼
        challengeId:
          type: string
          format: uuid
          description: 登入頁目前顯示的驗證碼挑戰唯一識別碼
        captchaCode:
          type: string
          minLength: 7
          maxLength: 7
          pattern: ^[A-Za-z0-9]{7}$
          description: 使用者輸入的 7 位數英數驗證碼（區分大小寫）
    AuthenticatedUser:
      type: object
      description: 已通過驗證的使用者帳號資訊
      required:
      - id
      - username
      - displayName
      - role
      properties:
        id:
          type: string
          format: uuid
          description: 使用者唯一識別碼
        username:
          type: string
          description: 登入帳號
        displayName:
          type: string
          description: 使用者繁體中文顯示名稱
        role:
          type: string
          enum:
          - member
          - admin
          description: 使用者角色（member 一般成員、admin 管理員；只有 admin 可以執行管理員操作，含設定送修、停用與恢復可用，以及查看逾期通知紀錄、重送通知與手動逾期檢查）
    LoginResponse:
      type: object
      description: 登入成功回應的工作階段權杖與使用者資訊
      required:
      - token
      - expiresAt
      - user
      properties:
        token:
          type: string
          description: 後續 API 請求帶入 Authorization Bearer 的工作階段權杖
        expiresAt:
          type: string
          format: date-time
          description: 工作階段權杖到期時間（ISO 8601 UTC）
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
    LogoutResponse:
      type: object
      description: 登出成功回應
      required:
      - message
      properties:
        message:
          type: string
          description: 繁體中文登出完成訊息
    MyRescheduleSlotRef:
      type: object
      description: 時段為本人改期審核中申請的新時段時，回傳該申請與原預約的摘要（只對申請人本人回傳）
      required:
      - rescheduleRequestId
      - requestNumber
      - reservationId
      - reservationNumber
      - fromReservationDate
      - fromSlot
      properties:
        rescheduleRequestId:
          type: string
          format: uuid
          description: 改期申請唯一識別碼
        requestNumber:
          type: string
          description: 供畫面顯示的改期申請編號（例如 RR-20261110-01）
        reservationId:
          type: string
          format: uuid
          description: 原預約唯一識別碼
        reservationNumber:
          type: string
          description: 原預約編號（例如 RV-20261109-21）
        fromReservationDate:
          type: string
          format: date
          description: 原預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        fromSlot:
          $ref: '#/components/schemas/TimeSlotSummary'
    EquipmentSlotAvailability:
      type: object
      description: 設備於指定日期單一固定時段的狀態；對本人區分本人狀態，對其他成員只回傳可預約或已被預約，不揭露預約人與改期申請
      required:
      - slotId
      - slotCode
      - slotName
      - startTime
      - endTime
      - sortOrder
      - slotStatus
      - availabilityStatus
      - isBookable
      - myReservationId
      - myRescheduleRequest
      properties:
        slotId:
          type: string
          format: uuid
          description: 固定時段唯一識別碼
        slotCode:
          type: string
          enum:
          - MORNING
          - AFTERNOON
          - EVENING
          description: 固定時段代碼
        slotName:
          type: string
          enum:
          - 上午
          - 下午
          - 晚間
          description: 固定時段繁體中文名稱
        startTime:
          type: string
          enum:
          - 09:00
          - '13:00'
          - '18:00'
          description: 時段開始時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        endTime:
          type: string
          enum:
          - '12:00'
          - '17:00'
          - '21:00'
          description: 時段結束時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        sortOrder:
          type: integer
          minimum: 1
          maximum: 3
          description: 單日固定時段排序順序（1 上午、2 下午、3 晚間）
        slotStatus:
