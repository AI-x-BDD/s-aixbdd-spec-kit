openapi: 3.1.0
info:
  title: 逾期借用的 Discord 通知、送出結果查看與重送、手動逾期檢查 (Overdue Discord Notification)
  version: 0.1.0
  description: |
    前端呼叫後端的 HTTP 介面合約，涵蓋 B1 逾期通知紀錄查詢 API、B2 通知重送 API、B3 手動逾期檢查 API，以及 B4 前五版既有 API（驗證碼登入、設備與時段、預約、改期、審核、領取歸還、設備狀態）。
    B4 延續 `specs/007-equipment-maintenance-retire/contracts/openapi.yaml` 的全部端點、路徑、請求、回應與錯誤碼，行為不變（FR-020 向下相容）；依 research §4 新增 3 個管理員端點與錯誤碼 OVERDUE_LOAN_RETURNED、OVERDUE_NOTIFICATION_NOT_RESENDABLE。
    需登入的端點透過 HTTP Header `Authorization: Bearer <token>` 傳遞工作階段權杖；B1～B3 掛在既有 requireAuth、requireAdmin 之後，未登入回應 401（UNAUTHORIZED），一般成員回應 403（FORBIDDEN）。
    逾期通知的狀態只有 4 種：sending 送出中、sent 送出成功、failed 送出失敗、unknown 結果不明（FR-017）。「送出中」包含等待送出、等待自動重試與等待 Discord 回應，API 不區分這三種情況。Discord 的呼叫、自動重試與結果分類由後端排程（research §2、§3）處理，不在本合約的 HTTP 介面內。
    依 research §4，B2、B3 的寫入都以 PostgreSQL 單一語句完成，維持 READ COMMITTED：重送以條件式更新領取重送權，手動檢查以 `INSERT ... ON CONFLICT (reservation_id) DO NOTHING` 建立通知。
    依 NFR-003，本合約的所有回應（含 failureReason 與錯誤訊息）都不得含有 Discord Webhook 位址；失敗原因只以 Enum 回傳，畫面文字由前端對應臺灣繁體中文（NFR-002）。
servers:
- url: http://localhost:3000/api
  description: 本機開發用 Express 伺服器
tags:
- name: B1 逾期通知紀錄查詢 API
  description: US2 情境 1–3、9–12、15；FR-003 回傳清單欄位、送出時間與失敗原因並由新到舊排序；FR-004 依狀態篩選；FR-008 回傳借用是否已歸還與可否重送；FR-019 只允許管理員查看，一般成員回傳權限不足
- name: B2 通知重送 API
  description: US2 情境 4–8、13–15；FR-005 重送更新同一則通知為「送出中」且不等送出結果；FR-007 只對送出失敗與結果不明提供重送；FR-008 借用已歸還時拒絕；FR-018 多位管理員同時重送時只送出一次；FR-019 只允許管理員重送；SC-004 重送後通知總數不增加；Edge Cases 通知送出中或結果不明時借用被歸還
- name: B3 手動逾期檢查 API
  description: US3 情境 1–5；FR-009 使用和自動檢查相同的逾期判定與通知規則；FR-010 回傳新建立的通知數，不等送出結果；FR-012 已有通知的逾期借用不再建立通知；FR-018 和自動檢查同時執行時同一筆逾期借用只有一則通知；FR-019 只允許管理員執行；NFR-001、SC-005 100 筆以內低於 2 秒；SC-002 同一筆逾期借用的通知數恰好 1 則；Edge Cases 手動檢查與自動檢查同時執行
- name: B4 前五版既有 API（驗證碼登入、設備與時段、預約、改期、審核、領取歸還、設備狀態）
  description: US1 情境 10；FR-020 完整保留並向下相容前五次迭代的 API；FR-019 沿用既有管理員角色檢查；SC-007 前五次迭代既有功能回歸測試通過率 100%
paths:
  /admin/overdue-notifications:
    get:
      operationId: listOverdueNotifications
      tags:
      - B1 逾期通知紀錄查詢 API
      summary: 管理員分頁查詢逾期通知紀錄（可依通知狀態篩選）
      description: |
        依 FR-003、US2 情境 1，回傳每則逾期通知的設備編號與名稱、借用成員姓名、預約日期與固定時段、通知狀態、嘗試次數 attemptCount 與最後嘗試時間 lastAttemptedAt；依 US2 情境 9，送出成功（sent）的通知回傳送出時間 sentAt 與 Discord 訊息編號 discordMessageId（FR-017）；依 US2 情境 2，送出失敗（failed）的通知回傳失敗原因 failureReason。依 FR-004、US2 情境 3，選填 status 篩選 4 種通知狀態之一，未傳入時回傳全部狀態。
        依 FR-008、US2 情境 12，每則通知回傳 loanReturned（預約狀態為 returned 時為 true）與 returnedAt；依 FR-007、FR-008 與 research §4，canResend 只有在通知狀態為 failed 或 unknown、且預約仍為 checked_out 時為 true，前端只在 canResend 為 true 時顯示「重送」。依 US2 情境 10、11，sent 與 sending（含等待 Discord 要求的時間後自動重試）的通知 canResend 為 false。
        Edge Cases 通知送出中或結果不明時借用被歸還：通知的 status 照原值回傳，loanReturned 為 true，canResend 為 false；這是正常結果，回應 200。Edge Cases 逾期好幾天仍未歸還：同一筆借用只有一則通知（FR-012），清單不會每天多一列。
        排序依通知建立時間 createdAt 由新到舊（DESC），createdAt 相同時依唯一欄位 id 由小到大（ASC）；page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。本操作只讀取，不改變通知與預約。
        page 或 pageSize 不合法時回應 400（PAGINATION_INVALID），status 不是 4 種通知狀態之一時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；依 FR-019、US2 情境 15，一般成員呼叫時回應 403（FORBIDDEN），沿用 requireAdmin，message 為說明權限不足的臺灣繁體中文。依 NFR-003，回應不含 Discord Webhook 位址；依 NFR-002，錯誤訊息使用臺灣繁體中文。
      parameters:
      - name: status
        in: query
        required: false
        description: 選填的通知狀態篩選條件（sending 送出中、sent 送出成功、failed 送出失敗、unknown 結果不明）；未傳入時回傳全部狀態
        schema:
          $ref: '#/components/schemas/OverdueNotificationStatus'
      - name: page
        in: query
        required: false
        description: 要查詢的頁碼，從 1 開始
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: 每頁筆數，預設 20，上限 100
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 分頁的逾期通知紀錄，依 createdAt 由新到舊排列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverdueNotificationPage'
        '400':
          $ref: '#/components/responses/PaginationOrQueryInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/overdue-notifications/{notificationId}/resend:
    parameters:
    - name: notificationId
      in: path
      required: true
      description: 逾期通知唯一識別碼
      schema:
        type: string
        format: uuid
    post:
      operationId: resendOverdueNotification
      tags:
      - B2 通知重送 API
      summary: 管理員重送一則「送出失敗」或「結果不明」的逾期通知（不等送出結果）
      description: |
        依 FR-005、US2 情境 4、8 與 research §4，以一條條件式更新領取重送權：通知狀態為 failed 或 unknown、且預約仍為 checked_out 時，把同一則通知改為 sending，next_attempt_at 設為目前時間，auto_retry_count 歸 0，failureReason 清為 null，updated_by 記為呼叫的管理員。更新成功時立即回應 202 與狀態為 sending、canResend 為 false 的通知，不等 Discord 送出結果；送出由後端送出程序在約 1 秒內接手，依 FR-014～FR-016 處理，並在領取時把 attemptCount 加 1、更新 lastAttemptedAt。送出結束後，管理員重新整理清單（GET /admin/overdue-notifications）看到結果。依 SC-004、US2 情境 5，重送只更新同一則通知，不建立新的通知，通知總數不變。
        依 FR-006、US2 情境 6、7，重送「結果不明」前的確認視窗由前端處理；管理員取消時前端不呼叫本操作，通知不變。本操作不另外要求確認欄位。
        依 FR-018、US2 情境 14，兩位管理員同時重送同一則通知時，後執行的條件式更新在前一個交易提交後重新檢查條件，看到狀態已是 sending，更新 0 列並回應 409（OVERDUE_NOTIFICATION_NOT_RESENDABLE），所以 Discord 只收到一次。
        條件式更新 0 列時，重新讀取通知與預約，依序判斷：通知不存在時回應 404（RESOURCE_NOT_FOUND）；依 FR-008、US2 情境 13、Edge Cases 通知送出中或結果不明時借用被歸還，預約已不是 checked_out 時回應 409（OVERDUE_LOAN_RETURNED），message 為「借用已歸還，不需要重送」並可附上預約編號、成員、設備與歸還時間，通知不變；依 FR-007，通知狀態為 sending 或 sent 時回應 409（OVERDUE_NOTIFICATION_NOT_RESENDABLE），message 說明目前狀態（sent 時附上送出時間），通知不變。
        notificationId 不是 UUID 時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；依 FR-019、US2 情境 15，一般成員呼叫時回應 403（FORBIDDEN），沿用 requireAdmin，message 為說明權限不足的臺灣繁體中文，通知不變，也不送出任何通知。依 NFR-002，錯誤訊息使用臺灣繁體中文；依 NFR-003，回應與錯誤訊息不含 Discord Webhook 位址。
      responses:
        '202':
          description: 已領取重送權，同一則通知改為 sending（送出中），不等 Discord 送出結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverdueNotification'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResendOverdueNotificationConflict'
  /admin/overdue-checks:
    post:
      operationId: runOverdueCheck
      tags:
      - B3 手動逾期檢查 API
      summary: 管理員手動執行一次逾期檢查，回傳這次新建立的通知數（不等送出結果）
      description: |
        依 FR-009、US3 情境 1 與 research §2、§4，呼叫和自動檢查相同的 runOverdueCheck(now)：依 FR-011，把狀態為 checked_out、未刪除、且目前時間已超過 reservationDate 加固定時段結束時間（依 Asia/Taipei 解讀）的預約判定為逾期借用，不設寬限時間；以一條 `INSERT INTO overdue_notifications ... SELECT ... ON CONFLICT (reservation_id) DO NOTHING RETURNING id` 為還沒有通知的逾期借用建立通知，新通知狀態為 sending、next_attempt_at 為目前時間，由後端送出程序依 FR-013～FR-016 送出。
        依 FR-010，回應 200 與 createdCount（RETURNING 的列數，即這次新建立的通知數），不等待 Discord 送出結果；前端在 createdCount 大於 0 時顯示「這次建立 N 則逾期通知」，為 0 時顯示「沒有新的逾期借用」（US3 情境 2）。依 NFR-001、SC-005，逾期借用在 100 筆以內時回應低於 2 秒。
        依 FR-012、SC-002、US3 情境 3，已經有通知的逾期借用不論那則通知的狀態都不再建立通知，原通知不變；依 FR-018、US3 情境 4、Edge Cases 手動檢查與自動檢查同時執行，後寫入的一方由唯一索引在前一方提交後略過，同一筆借用只有一則通知，這是正常結果，回應 200，createdCount 只計入這次實際建立的通知。自動檢查開關 OVERDUE_AUTO_CHECK_ENABLED 為 false 時，本操作照常執行，建立的通知照常送出（research §2）。
        本操作不需要請求內容。未登入時回應 401（UNAUTHORIZED）；依 FR-019、US3 情境 5，一般成員呼叫時回應 403（FORBIDDEN），沿用 requireAdmin，message 為說明權限不足的臺灣繁體中文，不建立任何通知。依 NFR-002，錯誤訊息使用臺灣繁體中文。
      responses:
        '200':
          description: 逾期檢查完成，回傳這次新建立的通知數（0 表示沒有新的逾期借用）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverdueCheckResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/captcha:
    post:
      operationId: createCaptchaChallenge
      tags:
      - B4 前五版既有 API（驗證碼登入、設備與時段、預約、改期、審核、領取歸還、設備狀態）
      summary: 產生或手動重整 7 位數區分大小寫英數驗證碼挑戰
      description: |
        依 FR-020、SC-007 與 US1 情境 10，完整保留前五版的驗證碼挑戰行為，路徑、請求、回應與錯誤碼和 `specs/007-equipment-maintenance-retire/contracts/openapi.yaml` 的同名 operation 相同，本次不修改。
        產生同時包含英文與數字、區分大小寫的 7 位數英數驗證碼，有效期限 5 分鐘；傳入選填的 previousChallengeId 時，原挑戰立即失效並回傳新挑戰。欄位格式不符時回應 400（VALIDATION_FAILED）。錯誤訊息使用臺灣繁體中文。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaptchaChallengeRequest'
      responses:
        '201':
          description: 成功產生新的 7 位數英數驗證碼挑戰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaChallengeResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      operationId: login
      tags:
      - B4 前五版既有 API（驗證碼登入、設備與時段、預約、改期、審核、領取歸還、設備狀態）
      summary: 以預建帳號、密碼與 7 位數驗證碼登入
      description: |
        依 FR-020、SC-007 與 US1 情境 10，完整保留前五版的登入行為，路徑、請求、回應與錯誤碼和 `specs/007-equipment-maintenance-retire/contracts/openapi.yaml` 的同名 operation 相同，本次不修改。
        驗證帳號、密碼、驗證碼挑戰識別碼與區分大小寫的驗證碼；送出後原挑戰單次消耗失效。回傳的使用者角色（member 或 admin）是 FR-019 只允許管理員查看逾期通知紀錄、重送通知與手動逾期檢查的依據。
        挑戰不存在、逾期或已失效時回應 400（CAPTCHA_EXPIRED），驗證碼不符時回應 400（CAPTCHA_MISMATCH），欄位格式不符時回應 400（VALIDATION_FAILED），帳號或密碼不正確時回應 401（INVALID_CREDENTIALS）。錯誤訊息使用臺灣繁體中文。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登入成功，回傳工作階段 Bearer token 與使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/LoginBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
      - B4 前五版既有 API（驗證碼登入、設備與時段、預約、改期、審核、領取歸還、設備狀態）
      summary: 查詢目前登入工作階段的使用者資訊
      description: |
        依 FR-020、SC-007 與 US1 情境 10，完整保留前五版的目前使用者查詢行為，路徑、請求、回應與錯誤碼和 `specs/007-equipment-maintenance-retire/contracts/openapi.yaml` 的同名 operation 相同，本次不修改。
        回傳目前工作階段的使用者資訊與角色（member 或 admin），供前端維持登入狀態；依 FR-019，前端只在角色為 admin 時顯示「逾期通知紀錄」頁籤。未登入或工作階段已失效時回應 401（UNAUTHORIZED）。
      responses:
        '200':
          description: 目前登入的使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - B4 前五版既有 API（驗證碼登入、設備與時段、預約、改期、審核、領取歸還、設備狀態）
      summary: 登出並使目前工作階段立即失效
      description: |
        依 FR-020、SC-007 與 US1 情境 10，完整保留前五版的登出行為，路徑、請求、回應與錯誤碼和 `specs/007-equipment-maintenance-retire/contracts/openapi.yaml` 的同名 operation 相同，本次不修改。
        結束目前工作階段並使 Bearer token 立即失效；未登入或工作階段已失效時回應 401（UNAUTHORIZED）。
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /equipments:
    get:
      operationId: listEquipments
      tags:
      - B4 前五版既有 API（驗證碼登入、設備與時段、預約、改期、審核、領取歸還、設備狀態）
      summary: 分頁查詢成員可見的設備清單（排除停用）與指定日期 3 個固定時段的狀態
      description: |
        依 FR-020、SC-007 與 US1 情境 10，完整保留前五版的成員設備清單與時段狀態查詢，路徑、請求、回應與錯誤碼和 `specs/007-equipment-maintenance-retire/contracts/openapi.yaml` 的同名 operation 相同，本次不修改。
        status 為 retired（停用）的設備不出現在結果中，也不計入 totalItems；每台設備回傳 status（available 或 maintenance），maintenance 設備所有時段的 isBookable 一律為 false。時段狀態含本人改期審核中 MY_RESCHEDULE_PENDING；查詢前先讓到期的改期申請失效。依 FR-011，逾期借用不新增預約狀態，仍以 checked_out 占用時段。
        排序依設備編號 equipmentCode 由小到大（ASC），equipmentCode 相同時依唯一欄位 id 由小到大（ASC）。page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。page 或 pageSize 不合法時回應 400（PAGINATION_INVALID），其他查詢參數格式不符時回應 400（VALIDATION_FAILED）。未登入時回應 401（UNAUTHORIZED）。
      parameters:
      - name: date
        in: query
        required: true
        description: 查詢時段狀態的單一日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        schema:
          type: string
          format: date
