        requiresApproval:
          type: boolean
          description: 設備目前是否需要人工審核（false 免審核、true 需人工審核）
        reservationDate:
          type: string
          format: date
          description: 查詢的日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        slots:
          type: array
          description: 該設備於該日的 3 個固定時段狀態
          items:
            $ref: '#/components/schemas/EquipmentSlotAvailability'
    EquipmentAvailabilityPage:
      type: object
      description: 成員可見設備（不含停用設備）與單日固定時段狀態的分頁回應
      required:
      - items
      - page
      - pageSize
      - totalItems
      - totalPages
      properties:
        items:
          type: array
          description: 本頁的設備與時段狀態
          items:
            $ref: '#/components/schemas/EquipmentWithSlotAvailability'
        page:
          type: integer
          minimum: 1
          description: 本次查詢採用的頁碼
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: 本次查詢採用的每頁筆數
        totalItems:
          type: integer
          minimum: 0
          description: 符合條件的設備總筆數（不含停用設備）
        totalPages:
          type: integer
          minimum: 0
          description: 總頁數，沒有資料時為 0
    CreateReservationRequest:
      type: object
      description: 建立預約或待審核申請的請求資料
      required:
      - equipmentId
      - reservationDate
      - slotId
      properties:
        equipmentId:
          type: string
          format: uuid
          description: 要預約的設備唯一識別碼
        reservationDate:
          type: string
          format: date
          description: 預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀，須為當日起算 7 天內）
        slotId:
          type: string
          format: uuid
          description: 要預約的固定時段唯一識別碼
    CreateRescheduleRequestRequest:
      type: object
      description: 成員送出改期的請求資料；新時段固定為原預約的同一台設備，所以不接受設備欄位
      required:
      - toReservationDate
      - toSlotId
      properties:
        toReservationDate:
          type: string
          format: date
          description: 新預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀，須為當日起算 7 天內）
        toSlotId:
          type: string
          format: uuid
          description: 新固定時段唯一識別碼
    CreateRescheduleRequestResponse:
      type: object
      description: 送出改期的結果，同時回傳改期申請與目前的原預約
      required:
      - rescheduleRequest
      - reservation
      properties:
        rescheduleRequest:
          $ref: '#/components/schemas/RescheduleRequest'
        reservation:
          $ref: '#/components/schemas/Reservation'
    RejectReservationRequest:
      type: object
      description: 管理員駁回待審核預約申請的請求資料（駁回原因選填，上限 200 字）
      properties:
        rejectReason:
          type:
          - string
          - 'null'
          maxLength: 200
          description: 選填的駁回原因（上限 200 字，未填寫時可省略或傳入 null）
    RejectRescheduleRequestRequest:
      type: object
      description: 管理員駁回改期申請的請求資料（駁回原因選填，上限 200 字）
      properties:
        rejectReason:
          type:
          - string
          - 'null'
          maxLength: 200
          description: 選填的駁回原因（上限 200 字，未填寫時可省略或傳入 null）
    UpdateEquipmentApprovalModeRequest:
      type: object
      description: 管理員切換設備人工審核設定的請求資料
      required:
      - requiresApproval
      properties:
        requiresApproval:
          type: boolean
          description: 目標人工審核設定（false 免審核、true 需人工審核）
    LastEquipmentStatusChange:
      type: object
      description: 設備最近一次狀態變更的摘要，供設備清單顯示經手管理員與時間
      required:
      - changedBy
      - changedByDisplayName
      - changedAt
      - fromStatus
      - toStatus
      properties:
        changedBy:
          type: string
          format: uuid
          description: 經手管理員唯一識別碼
        changedByDisplayName:
          type: string
          description: 經手管理員繁體中文顯示名稱
        changedAt:
          type: string
          format: date-time
          description: 狀態變更時間（ISO 8601 UTC）
        fromStatus:
          $ref: '#/components/schemas/EquipmentStatus'
        toStatus:
          $ref: '#/components/schemas/EquipmentStatus'
    AdminEquipmentSetting:
      type: object
      description: 管理員檢視的設備（含停用設備）、設備狀態、最近一次狀態變更與人工審核設定
      required:
      - id
      - equipmentCode
      - name
      - category
      - status
      - requiresApproval
      - lastStatusChange
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: 設備唯一識別碼
        equipmentCode:
          type: string
          description: 唯一設備編號（例如 EQ-101）
        name:
          type: string
          description: 設備名稱
        category:
          type: string
          description: 設備分類
        status:
          $ref: '#/components/schemas/EquipmentStatus'
        requiresApproval:
          type: boolean
          description: 設備目前是否需要人工審核（false 免審核、true 需人工審核）；狀態變更不會改變此設定
        lastStatusChange:
          description: 最近一次狀態變更的經手管理員與時間；沒有任何狀態變更紀錄時為 null，前端顯示「尚無狀態變更」
          oneOf:
          - $ref: '#/components/schemas/LastEquipmentStatusChange'
          - type: 'null'
        updatedAt:
          type: string
          format: date-time
          description: 設備資料最後更新時間（ISO 8601 UTC）
    EquipmentStatusCounts:
      type: object
      description: 全部設備依狀態的台數（不受查詢篩選條件影響）
      required:
      - available
      - maintenance
      - retired
      properties:
        available:
          type: integer
          minimum: 0
          description: 可用設備台數
        maintenance:
          type: integer
          minimum: 0
          description: 送修中設備台數
        retired:
          type: integer
          minimum: 0
          description: 停用設備台數
    AdminEquipmentPage:
      type: object
      description: 管理員設備清單的分頁回應
      required:
      - items
      - page
      - pageSize
      - totalItems
      - totalPages
      - statusCounts
      properties:
        items:
          type: array
          description: 本頁的設備
          items:
            $ref: '#/components/schemas/AdminEquipmentSetting'
        page:
          type: integer
          minimum: 1
          description: 本次查詢採用的頁碼
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: 本次查詢採用的每頁筆數
        totalItems:
          type: integer
          minimum: 0
          description: 符合條件的設備總筆數
        totalPages:
          type: integer
          minimum: 0
          description: 總頁數，沒有資料時為 0
        statusCounts:
          $ref: '#/components/schemas/EquipmentStatusCounts'
    CheckedOutReservationSummary:
      type: object
      description: 設備目前借用中預約的摘要，供確認視窗提示管理員先登記歸還
      required:
      - reservationId
      - reservationNumber
      - userDisplayName
      - reservationDate
      - slotName
      - slotStartTime
      - slotEndTime
      - isOverdue
      properties:
        reservationId:
          type: string
          format: uuid
          description: 借用中預約唯一識別碼
        reservationNumber:
          type: string
          description: 預約編號（例如 RV-20261109-10）
        userDisplayName:
          type: string
          description: 借用成員顯示名稱
        reservationDate:
          type: string
          format: date
          description: 預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        slotName:
          type: string
          enum:
          - 上午
          - 下午
          - 晚間
          description: 固定時段名稱
        slotStartTime:
          type: string
          enum:
          - 09:00
          - '13:00'
          - '18:00'
          description: 固定時段開始時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        slotEndTime:
          type: string
          enum:
          - '12:00'
          - '17:00'
          - '21:00'
          description: 固定時段結束時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        isOverdue:
          type: boolean
          description: 是否已超過時段結束時間仍未歸還
    EquipmentStatusChangePreview:
      type: object
      description: 設為送修或停用前的預覽結果；確認時把 currentStatus、cancelCount、expireCount 原樣放入 UpdateEquipmentStatusRequest 的 expected 欄位
      required:
      - equipmentId
      - equipmentCode
      - equipmentName
      - currentStatus
      - targetStatus
      - cancelCount
      - expireCount
      - hasCheckedOutReservation
      - checkedOutReservations
      properties:
        equipmentId:
          type: string
          format: uuid
          description: 設備唯一識別碼
        equipmentCode:
          type: string
          description: 唯一設備編號
        equipmentName:
          type: string
          description: 設備名稱
        currentStatus:
          $ref: '#/components/schemas/EquipmentStatus'
        targetStatus:
          type: string
          enum:
          - maintenance
          - retired
          description: 預覽的目標狀態
        cancelCount:
          type: integer
          minimum: 0
          description: 將被取消的預約數（時段結束時間晚於目前時間的 pending_approval 與 confirmed 預約）
        expireCount:
          type: integer
          minimum: 0
          description: 將失效的改期申請數（上述預約中改期審核中的申請）
        hasCheckedOutReservation:
          type: boolean
          description: 設備是否有借用中（checked_out，含逾期未還）的預約；為 true 時確認會被拒絕
        checkedOutReservations:
          type: array
          description: 借用中預約的摘要，沒有時為空陣列；依 reservationDate 由舊到新（ASC）、slotStartTime 由早到晚（ASC）、reservationId 由小到大（ASC）排序
          items:
            $ref: '#/components/schemas/CheckedOutReservationSummary'
    SetEquipmentUnavailableRequest:
      type: object
      description: 把設備設為送修中或停用的請求；expected 欄位取自確認視窗顯示的預覽結果
      required:
      - targetStatus
      - expectedCurrentStatus
      - expectedCancelCount
      - expectedExpireCount
      properties:
        targetStatus:
          type: string
          enum:
          - maintenance
          - retired
          description: 目標狀態（maintenance 送修中、retired 停用）
        expectedCurrentStatus:
          $ref: '#/components/schemas/EquipmentStatus'
        expectedCancelCount:
          type: integer
          minimum: 0
          description: 確認視窗顯示的將取消預約數
        expectedExpireCount:
          type: integer
          minimum: 0
          description: 確認視窗顯示的將失效改期申請數
    RestoreEquipmentRequest:
      type: object
      description: 把送修中或停用的設備恢復成可用的請求
      required:
      - targetStatus
      properties:
        targetStatus:
          type: string
          const: available
          description: 目標狀態固定為 available
    UpdateEquipmentStatusRequest:
      description: 設備狀態變更請求；targetStatus 為 maintenance 或 retired 時必須帶 expected 欄位，為 available 時不需要
      oneOf:
      - $ref: '#/components/schemas/SetEquipmentUnavailableRequest'
      - $ref: '#/components/schemas/RestoreEquipmentRequest'
    EquipmentStatusChange:
      type: object
      description: 一筆設備狀態變更紀錄；只新增、不修改、不刪除
      required:
      - id
      - equipmentId
      - fromStatus
      - toStatus
      - changedBy
      - changedByDisplayName
      - changedAt
      - cancelledReservationCount
      properties:
        id:
          type: string
          format: uuid
          description: 狀態變更紀錄唯一識別碼
        equipmentId:
          type: string
          format: uuid
          description: 設備唯一識別碼
        fromStatus:
          $ref: '#/components/schemas/EquipmentStatus'
        toStatus:
          $ref: '#/components/schemas/EquipmentStatus'
        changedBy:
          type: string
          format: uuid
          description: 經手管理員唯一識別碼
        changedByDisplayName:
          type: string
          description: 經手管理員繁體中文顯示名稱
        changedAt:
          type: string
          format: date-time
          description: 狀態變更時間（ISO 8601 UTC），也是本次被取消預約的取消時間
        cancelledReservationCount:
          type: integer
          minimum: 0
          description: 本次被取消的預約數（恢復可用時為 0）
    EquipmentStatusChangeResult:
      type: object
      description: 設備狀態變更的結果
      required:
      - equipment
      - statusChange
      - expiredRescheduleRequestCount
      properties:
        equipment:
          $ref: '#/components/schemas/AdminEquipmentSetting'
        statusChange:
          $ref: '#/components/schemas/EquipmentStatusChange'
        expiredRescheduleRequestCount:
          type: integer
          minimum: 0
          description: 本次失效的改期申請數（恢復可用時為 0）
    RescheduleRequest:
      type: object
      description: 成員檢視的一筆改期申請紀錄；所有改期申請完整保留，不實體刪除
      required:
      - id
      - requestNumber
      - reservationId
      - status
      - fromReservationDate
      - fromSlot
      - toReservationDate
      - toSlot
      - createdAt
      - reviewedBy
      - reviewedByDisplayName
      - reviewedAt
      - rejectReason
      - withdrawnAt
      - expiredAt
      - expireReason
      - canWithdraw
      properties:
        id:
          type: string
          format: uuid
          description: 改期申請唯一識別碼
        requestNumber:
          type: string
          description: 供畫面顯示的改期申請編號（例如 RR-20261110-01）
        reservationId:
          type: string
          format: uuid
          description: 所屬預約唯一識別碼
        status:
          $ref: '#/components/schemas/RescheduleRequestStatus'
        fromReservationDate:
          type: string
          format: date
          description: 原預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        fromSlot:
          $ref: '#/components/schemas/TimeSlotSummary'
        toReservationDate:
          type: string
          format: date
          description: 新預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        toSlot:
          $ref: '#/components/schemas/TimeSlotSummary'
        createdAt:
          type: string
          format: date-time
          description: 申請時間（ISO 8601 UTC）
        reviewedBy:
          type:
          - string
          - 'null'
          format: uuid
          description: 核准或駁回的管理員唯一識別碼（免審核即時改期、尚未審核、已撤回或已失效時為 null）
        reviewedByDisplayName:
          type:
          - string
          - 'null'
          description: 核准或駁回的管理員繁體中文顯示名稱（reviewedBy 為 null 時為 null）
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 管理員核准或駁回的審核時間（ISO 8601 UTC；免審核即時改期、尚未審核、已撤回或已失效時為 null）
        rejectReason:
          type:
          - string
          - 'null'
          maxLength: 200
          description: 管理員駁回時選填的駁回原因（上限 200 字，其餘為 null）
        withdrawnAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 成員撤回時間（ISO 8601 UTC，未撤回時為 null）
        expiredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 失效時間（ISO 8601 UTC，未失效時為 null）；因原預約被設備送修或停用取消而失效時為設備狀態變更時間
        expireReason:
          description: 失效原因（未失效時為 null）
          oneOf:
          - $ref: '#/components/schemas/RescheduleExpireReason'
          - type: 'null'
        canWithdraw:
          type: boolean
          description: 成員目前是否可撤回此申請（只有 status 為 pending_approval 時為 true）
    PendingRescheduleSummary:
      type: object
      description: 預約目前「改期審核中」申請的摘要（同一預約最多一筆）
      required:
      - id
      - requestNumber
      - toReservationDate
      - toSlot
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 改期申請唯一識別碼
        requestNumber:
          type: string
          description: 供畫面顯示的改期申請編號（例如 RR-20261110-01）
        toReservationDate:
          type: string
          format: date
          description: 新預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        toSlot:
          $ref: '#/components/schemas/TimeSlotSummary'
        createdAt:
          type: string
          format: date-time
          description: 申請時間（ISO 8601 UTC）
    Reservation:
      type: object
      description: 成員本人的預約借還紀錄（6 種狀態，含領取歸還、改期與取消原因）；設備送修中或停用時照常回傳
      required:
      - id
      - reservationNumber
      - userId
      - equipmentId
      - equipmentCode
      - equipmentName
      - equipmentCategory
      - equipmentRequiresApproval
      - reservationDate
      - slotId
      - slotName
      - slotStartTime
      - slotEndTime
      - slotSortOrder
      - status
      - reviewedBy
      - reviewedByDisplayName
      - reviewedAt
      - rejectReason
      - checkedOutAt
      - checkedOutByUserId
      - checkedOutByName
      - returnedAt
      - returnedByUserId
      - returnedByName
      - canCancel
      - createdAt
      - cancelledAt
      - cancelReason
      - canReschedule
      - pendingRescheduleRequest
      - rescheduleRequests
      properties:
        id:
          type: string
          format: uuid
          description: 預約借用紀錄唯一識別碼
        reservationNumber:
          type: string
          description: 供畫面顯示的預約編號（例如 RV-20261108-14），改期後不變
        userId:
          type: string
          format: uuid
          description: 預約成員唯一識別碼
        equipmentId:
          type: string
          format: uuid
          description: 設備唯一識別碼
        equipmentCode:
          type: string
          description: 唯一設備編號（例如 EQ-105）
        equipmentName:
          type: string
          description: 設備名稱（設備送修中或停用時照常回傳）
        equipmentCategory:
          type: string
          description: 設備分類
        equipmentRequiresApproval:
          type: boolean
          description: 設備目前是否需要人工審核（false 免審核、true 需人工審核），決定送出改期時即時改期或進入改期審核
        reservationDate:
          type: string
          format: date
          description: 目前預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀），改期成功後為新日期
        slotId:
          type: string
          format: uuid
          description: 目前固定時段唯一識別碼，改期成功後為新時段
        slotName:
          type: string
          enum:
          - 上午
          - 下午
          - 晚間
          description: 固定時段名稱
        slotStartTime:
          type: string
          enum:
          - 09:00
          - '13:00'
          - '18:00'
          description: 固定時段開始時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        slotEndTime:
          type: string
          enum:
          - '12:00'
          - '17:00'
          - '21:00'
          description: 固定時段結束時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        slotSortOrder:
          type: integer
          minimum: 1
          maximum: 3
          description: 固定時段排序順序（1 上午、2 下午、3 晚間）
        status:
          $ref: '#/components/schemas/ReservationStatus'
        reviewedBy:
          type:
          - string
          - 'null'
          format: uuid
          description: 預約申請的審核管理員唯一識別碼（免審核直接成立或尚未審核時為 null）
        reviewedByDisplayName:
          type:
          - string
          - 'null'
          description: 預約申請的審核管理員顯示名稱（免審核直接成立或尚未審核時為 null）
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 預約申請的審核時間（ISO 8601 UTC，免審核直接成立或尚未審核時為 null）
        rejectReason:
          type:
          - string
          - 'null'
          maxLength: 200
          description: 預約申請被駁回時的選填原因（上限 200 字，其餘為 null）
        checkedOutAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 實際領取時間（ISO 8601 UTC，尚未領取時為 null）
        checkedOutByUserId:
          type:
          - string
          - 'null'
          format: uuid
          description: 登記領取的經手管理員唯一識別碼（尚未領取時為 null）
        checkedOutByName:
          type:
          - string
          - 'null'
          description: 登記領取的經手管理員顯示名稱（尚未領取時為 null）
        returnedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 實際歸還時間（ISO 8601 UTC，尚未歸還時為 null）
        returnedByUserId:
          type:
          - string
          - 'null'
          format: uuid
          description: 登記歸還的經手管理員唯一識別碼（尚未歸還時為 null）
        returnedByName:
          type:
          - string
