<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的預約｜精密實驗設備借用中心</title>
<style>
  /* 視覺風格（ui/plan.md 第 2 節） */
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --surface-muted: #F1F5F9;
    --ink: #0F172A;
    --muted: #475569;
    --line: #E2E8F0;
    --primary: #2563EB;
    --primary-soft: #DBEAFE;
    --danger: #DC2626;
    --danger-soft: #FEE2E2;
    --pending: #D97706;
    --pending-soft: #FEF3C7;
    --success: #16A34A;
    --success-soft: #DCFCE7;
    --occupied: #64748B;
    --occupied-soft: #F1F5F9;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .06);
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #0F172A;
    --surface: #1E293B;
    --surface-muted: #162032;
    --ink: #F8FAFC;
    --muted: #94A3B8;
    --line: #334155;
    --primary: #3B82F6;
    --primary-soft: #1E3A8A;
    --danger: #EF4444;
    --danger-soft: #7F1D1D;
    --pending: #F59E0B;
    --pending-soft: #78350F;
    --success: #22C55E;
    --success-soft: #14532D;
    --occupied: #94A3B8;
    --occupied-soft: #334155;
    --shadow: 0 1px 3px rgba(15, 23, 42, .35), 0 6px 20px rgba(15, 23, 42, .35);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); transition: background-color .15s, color .15s; }
  a { color: inherit; }
  code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .site-header { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
  .site-header .inner { max-width: 1120px; margin: 0 auto; padding: 0 16px; min-height: 64px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: .04em; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .brand-mark { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: #FFFFFF; font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
  .site-nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .site-nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
  .site-nav a[aria-current="page"] { color: var(--primary); background: var(--primary-soft); font-weight: 600; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .user-pill { padding: 4px 10px; border-radius: 999px; background: var(--surface-muted); border: 1px solid var(--line); color: var(--muted); font-size: 13px; white-space: nowrap; }
  .btn-theme, .btn-logout { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .btn-theme:hover, .btn-logout:hover { border-color: var(--primary); color: var(--primary); }
  @media (max-width: 720px) { .user-pill { display: none; } .site-header .inner { padding: 8px 12px; } }

  main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 96px; }
  h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.3; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  .page-lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .section-card { margin-bottom: 20px; padding: 20px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .section-head h2 { margin: 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; transition: border-color .15s, background-color .15s; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--primary); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #FFFFFF; }
  .btn-pending { background: var(--pending); border-color: var(--pending); color: #FFFFFF; }
  .btn-success { background: var(--success); border-color: var(--success); color: #FFFFFF; }
  .btn-outline-danger { color: var(--danger); border-color: var(--danger); }
  .btn-sm { height: 34px; padding: 0 12px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-block { width: 100%; }

  .banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; padding: 12px 16px; border-radius: var(--radius); border: 1px solid transparent; font-size: 14px; }
  .banner-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .banner-success { background: var(--success-soft); color: var(--success); border-color: var(--success); }
  .banner-pending { background: var(--pending-soft); color: var(--pending); border-color: var(--pending); }
  .banner-info { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  [data-theme="dark"] .banner { color: var(--ink); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
  .badge-available { background: var(--success-soft); color: var(--success); }
  .badge-mine { background: var(--primary-soft); color: var(--primary); }
  .badge-loan { background: var(--primary); color: #FFFFFF; }
  .badge-returned { background: var(--success-soft); color: var(--success); }
  .badge-pending { background: var(--pending-soft); color: var(--pending); }
  .badge-occupied { background: var(--occupied-soft); color: var(--occupied); }
  .badge-rejected { background: var(--danger-soft); color: var(--danger); }
  .badge-reschedule { background: var(--surface); color: var(--pending); border: 1px dashed var(--pending); }
  [data-theme="dark"] .badge-available, [data-theme="dark"] .badge-mine, [data-theme="dark"] .badge-returned, [data-theme="dark"] .badge-pending, [data-theme="dark"] .badge-rejected { color: var(--ink); }

  .spinner { width: 20px; height: 20px; border: 3px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { background: var(--surface-muted); border-radius: 8px; min-height: 20px; border: 1px dashed var(--line); }
  .loading-line { display: flex; align-items: center; gap: 10px; color: var(--muted); margin-bottom: 14px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
  .field .req { margin-left: 2px; color: var(--danger); }
  .field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
  .field input { height: 42px; }
  .field textarea { min-height: 96px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: 3px solid var(--primary-soft); border-color: var(--primary); }
  .field input:disabled { background: var(--surface-muted); color: var(--muted); }
  .field.has-error input, .field.has-error textarea { border-color: var(--danger); outline-color: var(--danger-soft); }
  .field .hint { margin-top: 4px; color: var(--muted); font-size: 12px; }
  .field .error { margin-top: 4px; color: var(--danger); font-size: 13px; font-weight: 500; }

  .dialog-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(15, 23, 42, .45); display: grid; place-items: center; padding: 16px; }
  .dialog { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px; }
  .dialog-wide { width: min(880px, 100%); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .dialog-error { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); font-size: 13px; font-weight: 500; }
  [data-theme="dark"] .dialog-error { color: var(--ink); }
  .notice { margin: 12px 0; padding: 10px 12px; border-radius: 8px; font-size: 13px; border: 1px solid var(--line); background: var(--surface-muted); }
  .notice-pending { background: var(--pending-soft); border-color: var(--pending); }
  .notice-success { background: var(--success-soft); border-color: var(--success); }
  @media (max-width: 640px) { .dialog-backdrop { padding: 0; } .dialog { width: 100%; min-height: 100vh; max-height: 100vh; border-radius: 0; } }
  .detail-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
  .detail-list dt { color: var(--muted); }
  .detail-list dd { margin: 0; font-weight: 600; }
  .empty-state { padding: 36px 20px; text-align: center; }

  /* 固定時段格子（設備預約與申請改期共用） */
  .slot { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .slot:hover { border-color: var(--primary); }
  .slot .slot-name { font-weight: 700; font-size: 14px; }
  .slot .slot-time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .slot .slot-state { font-weight: 600; font-size: 12px; }
  .slot-available { border-color: var(--success); }
  .slot-available .slot-state { color: var(--success); }
  .slot-mine { background: var(--primary-soft); border-color: var(--primary); }
  .slot-mine .slot-state { color: var(--primary); }
  .slot-my-loan { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
  .slot-my-loan .slot-time, .slot-my-loan .slot-state { color: #FFFFFF; }
  .slot-my-returned { background: var(--success-soft); border-color: var(--success); }
  .slot-my-returned .slot-state { color: var(--success); }
  .slot-my-pending { background: var(--pending-soft); border-color: var(--pending); }
  .slot-my-pending .slot-state { color: var(--pending); }
  .slot-my-reschedule { background: var(--surface); border: 1.5px dashed var(--pending); }
  .slot-my-reschedule .slot-state { color: var(--pending); }
  .slot-occupied, .slot-closed { background: var(--occupied-soft); border-color: var(--line); color: var(--muted); }
  .slot-occupied .slot-state, .slot-closed .slot-state { color: var(--occupied); }
  .slot-original { background: var(--surface-muted); border: 1.5px solid var(--primary); }
  .slot-original .slot-state { color: var(--primary); }
  .slot.selected { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 3px var(--primary-soft); }
  .slot.selected .slot-state { color: var(--primary); }
  [data-theme="dark"] .slot-mine .slot-state, [data-theme="dark"] .slot-my-returned .slot-state, [data-theme="dark"] .slot-my-pending .slot-state, [data-theme="dark"] .slot.selected .slot-state { color: var(--ink); }

  /* 設備狀態、取消原因、篩選與表格（各頁共用） */
  .badge-maintenance { background: var(--pending); color: #FFFFFF; }
  .badge-retired { background: var(--occupied-soft); color: var(--occupied); border-color: var(--occupied); }
  .badge-cancelled { background: var(--occupied-soft); color: var(--occupied); }
  .badge-expired { background: var(--occupied-soft); color: var(--occupied); }
  .reason-line { margin-top: 8px; padding: 6px 10px; border-left: 4px solid var(--occupied); border-radius: 0 8px 8px 0; background: var(--surface-muted); font-size: 13px; }
  .reason-maintenance { border-left-color: var(--pending); background: var(--pending-soft); }
  [data-theme="dark"] .reason-maintenance { color: var(--ink); }
  .slot-maintenance { background: var(--pending-soft); border: 1.5px solid var(--pending); color: var(--muted); cursor: not-allowed; }
  .slot-maintenance:hover { border-color: var(--pending); }
  .slot-maintenance .slot-state { color: var(--pending); }
  [data-theme="dark"] .slot-maintenance .slot-state { color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
  [data-theme="dark"] .chip[aria-pressed="true"] { color: var(--ink); }
  .table-wrap { overflow-x: auto; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .data-table th, .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .data-table th { color: var(--muted); font-size: 12px; font-weight: 600; background: var(--surface-muted); white-space: nowrap; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .forbidden-card { max-width: 560px; margin: 24px auto; padding: 28px; text-align: center; border-color: var(--danger); }
  .forbidden-card .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }

  /* 雛形狀態面板 */
  .proto-panel { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 13px; }
  .proto-toggle { padding: 8px 14px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font: inherit; cursor: pointer; box-shadow: var(--shadow); }
  .proto-body { width: 220px; max-height: 60vh; overflow: auto; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .proto-body p { margin: 0 0 6px; color: var(--muted); }
  .proto-body label { display: flex; gap: 8px; padding: 3px 0; cursor: pointer; }
  @media (max-width: 640px) { .proto-panel { top: 68px; bottom: auto; flex-direction: column-reverse; } }

  /* 我的預約頁 */
  .res-list { display: grid; gap: 12px; }
  .res-card { padding: 16px; }
  .res-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .res-id { font-family: var(--font-mono); font-weight: 700; }
  .res-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .res-eq { margin-top: 4px; font-weight: 600; }
  .res-eq .mono { color: var(--primary); margin-right: 6px; }
  .res-time { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
  .res-meta { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .res-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .rr-list { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface-muted); display: grid; gap: 8px; font-size: 13px; }
  .rr-item { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .skeleton-card { height: 110px; margin-bottom: 12px; }
  .empty-state .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
</style>
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html"><span class="brand-mark">EL</span>精密實驗設備借用中心</a>
    <nav class="site-nav" aria-label="主要導覽">
      <a href="index.html">登入</a>
      <a href="booking.html">設備預約</a>
      <a href="my-reservations.html" aria-current="page">我的預約</a>
      <a href="equipment-status.html">設備狀態管理</a>
      <a href="admin.html">審核與借用管理</a>
    </nav>
    <div class="header-actions">
      <span id="header-user" class="user-pill">尚未登入</span>
      <button id="theme-toggle" class="btn-theme" type="button" aria-label="切換深淺色主題">深色模式</button>
      <a id="header-logout" class="btn-logout" href="index.html?state=logged-out">登出</a>
    </div>
  </div>
</header>

<main>
  <h1>我的預約</h1>
  <p class="page-lead">查看您的預約、借用與改期紀錄。因設備送修或停用被取消的預約，會顯示取消原因。</p>

  <div id="page-banner" class="banner" role="alert" hidden>
    <span id="page-banner-text"></span>
    <a id="page-banner-link" class="btn btn-sm" href="booking.html" hidden></a>
  </div>

  <section id="view-loading" hidden>
    <div class="loading-line"><span class="spinner" aria-hidden="true"></span><span>正在載入預約與改期紀錄…</span></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </section>

  <section id="view-list">
    <div id="filters" class="chips" aria-label="篩選預約"></div>
    <div id="res-list" class="res-list"></div>
    <div id="empty-state" class="card empty-state" hidden>
      <h2>目前沒有符合篩選條件的預約</h2>
      <p class="muted" style="margin:0;">可以顯示全部預約，或前往設備預約新增預約。</p>
      <div class="actions">
        <button id="show-all-btn" class="btn" type="button">顯示全部預約</button>
        <a class="btn btn-primary" href="booking.html">前往設備預約</a>
      </div>
    </div>
  </section>
</main>

<div id="cancel-dialog" class="dialog-backdrop" hidden>
  <div class="card dialog" role="dialog" aria-modal="true" aria-labelledby="cancel-title">
    <h2 id="cancel-title">確認取消預約</h2>
    <dl id="cancel-detail" class="detail-list"></dl>
    <div id="cancel-rr-notice" class="notice notice-pending" hidden></div>
    <p class="muted" style="font-size:13px;margin:12px 0 0;">取消後時段會釋出，這筆預約無法復原。</p>
    <div class="dialog-actions">
      <button id="cancel-close-btn" class="btn" type="button">返回</button>
      <button id="cancel-confirm-btn" class="btn btn-danger" type="button">確認取消</button>
    </div>
  </div>
</div>

<aside class="proto-panel" aria-label="雛形狀態">
  <div class="proto-body" hidden></div>
  <button class="proto-toggle" type="button" aria-expanded="false"></button>
</aside>

<script>
  // 假資料：booking.html、my-reservations.html、equipment-status.html、admin.html 共用同一批帳號、設備、預約與改期申請（目前時間 2026-11-10 14:30）

    ],
    equipments: [

  const hasEnded = (date, slotId) => date < MOCK.today || (date === MOCK.today && slotOf(slotId).end <= MOCK.nowHour);
  const hasStarted = (date, slotId) => date < MOCK.today || (date === MOCK.today && slotOf(slotId).start <= MOCK.nowHour);
  const sortKey = r => r.date + String(slotOf(r.slot).start).padStart(2, '0');

  // 設為送修或停用前的預覽：與確認時使用相同的條件
  function previewChange(world, eqId) {
    const onLoan = world.reservations.find(r => r.eq === eqId && r.status === 'checked_out') || null;
    const affected = world.reservations.filter(r => r.eq === eqId && ['pending_approval', 'confirmed'].includes(r.status) && !hasEnded(r.date, r.slot));
    const ids = affected.map(r => r.id);
    const expiring = world.reschedules.filter(rr => rr.status === 'pending' && ids.includes(rr.reservationId));
    return { onLoan, affected, expiring, cancelCount: affected.length, expireCount: expiring.length };
  }

  function applyStatusChange(world, event) {
    const eq = eqOf(world, event.eq);
    const result = { from: eq.status, cancelCount: 0, expireCount: 0 };
    if (event.to !== 'available') {
      const p = previewChange(world, event.eq);
      const reason = event.to === 'maintenance' ? 'equipment_maintenance' : 'equipment_retired';
      p.affected.forEach(r => { r.status = 'cancelled'; r.cancelReason = reason; r.cancelledAt = event.at; });
      p.expiring.forEach(rr => { rr.status = 'expired'; rr.expireReason = '原預約已取消'; rr.expiredAt = event.at; });
      result.cancelCount = p.cancelCount;
      result.expireCount = p.expireCount;
    }
    eq.lastChange = { by: event.by, at: event.at, from: eq.status, to: event.to };
    eq.status = event.to;
    return result;
  }

  function worldAt(step) {
    const world = clone({ equipments: MOCK.equipments, reservations: MOCK.reservations, reschedules: MOCK.reschedules });
    if (step === 'base') return world;
    applyStatusChange(world, MOCK.events.maintenance);
    if (step === 'maintenance') return world;
    applyStatusChange(world, MOCK.events.restore105);
    applyStatusChange(world, MOCK.events.restore106);
    return world;
  }

  function applyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      $('#theme-toggle').textContent = '淺色模式';
    } else {
      document.documentElement.removeAttribute('data-theme');

  function matches(r) {
    if (filter === 'all') return true;

    return r.status === filter;

  function cardMeta(r) {
    if (r.status === 'cancelled') {
      if (r.cancelReason === 'equipment_maintenance' || r.cancelReason === 'equipment_retired') {
        const cls = r.cancelReason === 'equipment_maintenance' ? 'reason-maintenance' : '';
        return `<div class="reason-line ${cls}">取消原因：${CANCEL_REASON[r.cancelReason]}｜取消時間 <span class="mono">${r.cancelledAt}</span></div>`;
      }
      return `<div class="res-meta">取消時間 <span class="mono">${r.cancelledAt}</span></div>`;
    }
    if (r.status === 'rejected') return `<div class="reason-line">駁回原因：${r.rejectReason}｜審核時間 <span class="mono">${r.reviewedAt}</span></div>`;
    if (r.status === 'checked_out') return `<div class="res-meta">領取時間 <span class="mono">${r.checkedOutAt}</span></div>`;
    if (r.status === 'returned') return `<div class="res-meta">領取 <span class="mono">${r.checkedOutAt}</span>｜歸還 <span class="mono">${r.returnedAt}</span></div>`;
    return `<div class="res-meta">申請時間 <span class="mono">${r.createdAt}</span></div>`;
  }

  function rrBlock(r) {
    const rrs = world.reschedules.filter(rr => rr.reservationId === r.id);
    if (!rrs.length) return '';
    const open = expanded.has(r.id);
    const items = rrs.map(rr => {
      const st = RR_STATUS[rr.status];
      const extra = rr.status === 'expired' ? `<span>失效原因：${rr.expireReason}｜失效時間 <span class="mono">${rr.expiredAt}</span></span>` : `<span>申請時間 <span class="mono">${rr.appliedAt}</span></span>`;

    return `<button class="btn btn-sm" type="button" data-toggle-rr="${r.id}" aria-expanded="${open}">${open ? '收合改期紀錄' : `改期紀錄（${rrs.length}）`}</button>${open ? `<div class="rr-list">${items}</div>` : ''}`;

  protoBody.addEventListener('change', event => applyState(event.target.value));

  function markState(key) {
    protoBody.querySelector(`input[value="${key}"]`).checked = true;
    protoToggle.textContent = '雛形狀態：' + STATES.find(s => s.key === key).label;
  }

  function applyState(key) {
    timers.forEach(clearTimeout);
    timers = [];
    STATES.find(s => s.key === key).apply();
    markState(key);
  }

  initTheme();
  setUser('林雅婷（一般成員）');
  const params = new URLSearchParams(window.location.search);
  applyState(STATES.some(s => s.key === params.get('state')) ? params.get('state') : 'list');
</script>
</body>
</html>
