openapi: 3.1.0
info:
  title: 設備送修與停用、恢復可用及受影響未來預約的處理 (Equipment Maintenance and Retirement)
  version: 0.1.0
  description: |
    前端呼叫後端的 HTTP 介面合約，涵蓋 B1 驗證碼挑戰與登入工作階段 API、B2 成員設備清單、時段狀態查詢與預約建立 API、B3 管理員設備清單與人工審核設定 API、B4 設備狀態變更預覽與送修、停用、恢復可用 API、B5 成員預約查詢、取消與改期 API、B6 管理員待審核准駁回（含改期申請）、全體預約與現場領取歸還 API。
    本合約延續 `specs/006-reservation-reschedule/contracts/openapi.yaml` 的全部端點與路徑（FR-018 向下相容）；依 research §2 新增設備狀態預覽與狀態變更兩個管理員端點，設備資料以 `status`（available、maintenance、retired）取代 `isActive` 布林值，成員預約與全體預約加入 `cancelReason`，並新增錯誤碼 EQUIPMENT_ON_LOAN、EQUIPMENT_STATUS_UNCHANGED、EQUIPMENT_STATE_CHANGED。
    需登入的端點透過 HTTP Header `Authorization: Bearer <token>` 傳遞工作階段權杖。
    改期申請沿用 006 的查詢前惰性失效：原時段或新時段開始時間已到的「改期審核中」申請，在相關查詢與寫入處理前先更新為 `expired`；設備狀態預覽與狀態變更同樣先執行惰性失效，再計算數量。
    依 research §3，設備狀態變更交易以 `SELECT ... FOR UPDATE` 鎖定設備列；成員新增預約、管理員核准待審預約、成員即時改期與管理員核准改期申請，交易第一個語句以 `SELECT ... FOR SHARE` 鎖定設備列後才檢查設備是否為 available，不是時回應 409（EQUIPMENT_UNAVAILABLE）。
servers:
  - url: http://localhost:3000/api
    description: 本機開發用 Express 伺服器
tags:
  - name: B1 驗證碼挑戰與登入工作階段 API
    description: FR-018 保留前四次迭代的驗證碼登入與工作階段；FR-017 以管理員角色限制設備狀態操作；SC-005 既有功能回歸 100% 通過
  - name: B2 成員設備清單、時段狀態查詢與預約建立 API
    description: US3 情境 1–2；US1 情境 9、12；US2 情境 1–2、4；FR-014 成員設備清單排除停用設備並回傳送修中狀態；FR-006 非可用設備的新預約以說明設備狀態的繁體中文錯誤拒絕；FR-009 新預約與設定送修或停用同時發生時不留下未結束預約；FR-013 恢復後新預約依人工審核設定直接成立或進入待審核；SC-002 非可用設備新預約成功率 0%、並發時留下未結束預約 0 筆
  - name: B3 管理員設備清單與人工審核設定 API
    description: US1 情境 10；FR-008 設備清單回傳每台設備最近一次狀態變更的管理員名稱與時間；FR-013 恢復可用時保留人工審核設定；FR-017 只允許管理員呼叫；FR-018 保留審核設定切換功能
  - name: B4 設備狀態變更預覽與送修、停用、恢復可用 API
    description: US1 情境 1–8、11、12、15、16；US2 情境 1–5；FR-001～FR-005、FR-007～FR-012、FR-017、FR-019；NFR-002；SC-001、SC-003、SC-004、SC-006
  - name: B5 成員預約查詢、取消與改期 API
    description: US3 情境 3–5；US2 情境 3；FR-015 回傳取消原因，成員自行取消為成員取消；FR-016 回傳送修中或停用設備上的歷史紀錄與設備名稱；FR-009 即時改期與設定送修或停用同時發生時序列化；FR-018 保留查詢、取消、改期與撤回功能
  - name: B6 管理員待審核准駁回（含改期申請）、全體預約與現場領取歸還 API
    description: US1 情境 17；FR-020 全體預約清單回傳取消原因；FR-009 核准待審預約或改期申請與設定送修或停用同時發生時序列化；FR-004 失效的改期申請不能核准；FR-018 保留審核、改期審核與領取歸還功能；Edge Cases 待審核的預約、改期申請審核中
paths:
  /auth/captcha:
    post:
      operationId: createCaptchaChallenge
      tags: [B1 驗證碼挑戰與登入工作階段 API]
      summary: 產生或手動重整 7 位數區分大小寫英數驗證碼挑戰
      description: |
        依 FR-018、SC-005 完整保留 006 的驗證碼挑戰行為：產生同時包含英文與數字、區分大小寫的 7 位數英數驗證碼，有效期限 5 分鐘；傳入選填的 previousChallengeId 時，原挑戰立即失效並回傳新挑戰。欄位格式不符時回應 400（VALIDATION_FAILED）。NFR-001 錯誤訊息使用臺灣繁體中文。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaptchaChallengeRequest'
      responses:
        '201':
          description: 成功產生新的 7 位數英數驗證碼挑戰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaChallengeResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      operationId: login
      tags: [B1 驗證碼挑戰與登入工作階段 API]
      summary: 以預建帳號、密碼與 7 位數驗證碼登入
      description: |
        依 FR-018、SC-005 完整保留 006 的登入行為：驗證帳號、密碼、驗證碼挑戰識別碼與區分大小寫的驗證碼；送出後原挑戰單次消耗失效。回傳的使用者角色（member 或 admin）是 FR-017 限制設定送修、停用與恢復可用的依據。
        挑戰不存在、逾期或已失效時回應 400（CAPTCHA_EXPIRED），驗證碼不符時回應 400（CAPTCHA_MISMATCH），欄位格式不符時回應 400（VALIDATION_FAILED），帳號或密碼不正確時回應 401（INVALID_CREDENTIALS）。NFR-001 錯誤訊息使用臺灣繁體中文。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登入成功，回傳工作階段 Bearer token 與使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/LoginBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [B1 驗證碼挑戰與登入工作階段 API]
      summary: 查詢目前登入工作階段的使用者資訊
      description: |
        依 FR-018、SC-005 回傳目前工作階段的使用者資訊與角色（member 或 admin），供前端維持登入狀態，並依 FR-017 決定是否顯示設備狀態管理等管理員專屬畫面；未登入或工作階段已失效時回應 401（UNAUTHORIZED）。
      responses:
        '200':
          description: 目前登入的使用者資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      tags: [B1 驗證碼挑戰與登入工作階段 API]
      summary: 登出並使目前工作階段立即失效
      description: |
        依 FR-018、SC-005 結束目前工作階段並使 Bearer token 立即失效；未登入或工作階段已失效時回應 401（UNAUTHORIZED）。
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /equipments:
    get:
      operationId: listEquipments
      tags: [B2 成員設備清單、時段狀態查詢與預約建立 API]
      summary: 分頁查詢成員可見的設備清單（排除停用）與指定日期 3 個固定時段的狀態
      description: |
        依 FR-018 保留 006 的設備清單、時段狀態（含本人改期審核中 MY_RESCHEDULE_PENDING）與篩選條件，並依 FR-014、US3 情境 1–2 調整：
        (1) status 為 retired（停用）的設備不出現在結果中，也不計入 totalItems；以 equipmentId 篩選停用設備時回應 200，items 為空陣列。
        (2) 每台設備回傳 status（available 或 maintenance），取代 006 的 isActive 布林值（research §2）。status 為 maintenance（送修中）的設備，所有時段的 isBookable 一律為 false，前端據此標示「送修中」且不提供預約操作。
        (3) 依 FR-011、US2 情境 1–2，設備恢復成 available 後重新出現在清單，未被占用的未來時段 isBookable 恢復為 true；依 FR-012、Edge Cases 恢復後原時段仍空著，因送修或停用被取消的預約不占用時段，原時段對所有成員回傳 AVAILABLE，不保留給原預約成員。
        查詢前先讓到期的改期申請失效。排序依設備編號 equipmentCode 由小到大（ASC），equipmentCode 相同時依唯一欄位 id 由小到大（ASC）；page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。page 或 pageSize 不合法時回應 400（PAGINATION_INVALID），其他查詢參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）。
      parameters:
        - name: date
          in: query
          required: true
          description: 查詢時段狀態的單一日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
          schema:
            type: string
            format: date
        - name: equipmentId
          in: query
          required: false
          description: 選填的設備唯一識別碼篩選條件（供申請改期對話框只查同一台設備）
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          required: false
          description: 選填的設備分類篩選條件
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: requiresApproval
          in: query
          required: false
          description: 選填的設備人工審核模式篩選條件（false 免審核、true 需人工審核）
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: 要查詢的頁碼，從 1 開始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每頁筆數，預設 20，上限 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分頁的設備（不含停用設備）與單日固定時段狀態清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentAvailabilityPage'
        '400':
          $ref: '#/components/responses/PaginationOrQueryInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reservations:
    get:
      operationId: listMyReservations
      tags: [B5 成員預約查詢、取消與改期 API]
      summary: 分頁查詢本人的預約借還紀錄（含取消原因、改期紀錄與停用設備上的歷史紀錄）
      description: |
        依 FR-018 保留 006 的本人預約清單、6 態狀態篩選、改期紀錄 rescheduleRequests、pendingRescheduleRequest、canReschedule 與 hasPendingRescheduleRequest 篩選，並新增：
        (1) 依 FR-015、US3 情境 3、5，每筆預約回傳 cancelReason：因設備送修被取消為 equipment_maintenance、因設備停用被取消為 equipment_retired、成員自行取消為 member_cancelled，未取消為 null；前端只為前兩種顯示「設備送修」「設備停用」。cancelledAt 為取消時間，因設備狀態被取消時為設定送修或停用的時間。
        (2) 依 FR-016、US3 情境 4、Edge Cases 停用設備的歷史紀錄，本人在「送修中」或「停用」設備上的所有紀錄照常回傳，含設備編號、設備名稱與紀錄狀態，不因設備狀態而排除。
        (3) 依 FR-012、US2 情境 3，設備恢復可用後，被取消的預約仍回傳 cancelled 與原取消原因；依 FR-004，被取消預約的改期申請在 rescheduleRequests 中為 expired，expireReason 為 reservation_cancelled。
        查詢前先讓到期的改期申請失效。排序依預約日期 reservationDate 由新到舊（DESC），相同時依固定時段順序 slotSortOrder 由小到大（ASC），再依建立時間 createdAt 由新到舊（DESC），最後依唯一欄位 id 由小到大（ASC）；page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。page 或 pageSize 不合法時回應 400（PAGINATION_INVALID），其他查詢參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）。
      parameters:
        - name: status
          in: query
          required: false
          description: 選填的預約狀態篩選條件（6 種預約狀態之一）
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - name: hasPendingRescheduleRequest
          in: query
          required: false
          description: 選填的改期審核中篩選條件（true 只回傳有改期審核中申請的預約，false 只回傳沒有的預約）
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: 要查詢的頁碼，從 1 開始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每頁筆數，預設 20，上限 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分頁的本人預約借還紀錄、取消原因與改期紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPage'
        '400':
          $ref: '#/components/responses/PaginationOrQueryInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createReservation
      tags: [B2 成員設備清單、時段狀態查詢與預約建立 API]
      summary: 建立指定設備、日期與固定時段的待審核申請或免審核預約（非可用設備拒絕）
      description: |
        依 FR-018 保留 006 的預約建立規則：只接受當日起算 7 天內、尚未開始、未被 confirmed、checked_out 或當日 returned 紀錄占用的時段；需人工審核設備建立 pending_approval，免審核設備建立 confirmed 並占用時段。依 FR-013、US2 情境 4，設備恢復可用後，新預約依設備目前的 requiresApproval 直接成立或進入 pending_approval。
        依 FR-009、US1 情境 12、SC-002 與 research §3，檢查與新增包在同一個交易內，交易第一個語句以 `SELECT status, requires_approval FROM equipments ... FOR SHARE` 鎖定設備列，取得鎖之後才檢查設備狀態；與設定送修或停用同時發生時，本操作不是被拒絕，就是成立後被該次設定取消（cancelReason 為 equipment_maintenance 或 equipment_retired）。
        依 FR-006、US1 情境 9 與 research §2，設備 status 不是 available 時回應 409（EQUIPMENT_UNAVAILABLE），message 依狀態寫「設備送修中，無法預約」或「設備已停用，無法預約」。
        日期超出範圍時回應 400（DATE_OUT_OF_RANGE），時段已開始時回應 400（SLOT_ALREADY_STARTED），欄位格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；設備或時段不存在時回應 404（RESOURCE_NOT_FOUND）；本人在同一設備、日期與時段已有未結束預約時回應 409（DUPLICATE_PENDING_OR_ACTIVE_RESERVATION）；時段已被占用或與其他占用操作同時搶同一時段而失敗時回應 409（RESERVATION_CONFLICT）。NFR-001 錯誤訊息使用臺灣繁體中文並說明失敗原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: 預約申請建立成功（免審核設備為 confirmed 並占用時段；需人工審核設備為 pending_approval 且核准前不占用時段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/CreateReservationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CreateReservationConflict'
  /reservations/my:
    get:
      operationId: listMyLoanReservations
      tags: [B5 成員預約查詢、取消與改期 API]
      summary: 分頁查詢本人的預約借還紀錄（對齊 /reservations/my 路徑）
      description: |
        依 FR-018 保留 006 的 /reservations/my 路徑，行為、篩選條件與回應結構與 GET /reservations 完全一致：依 FR-015 回傳 cancelReason（設備送修、設備停用或成員取消），依 FR-016 照常回傳本人在送修中或停用設備上的歷史紀錄與設備名稱。
        查詢前先讓到期的改期申請失效。排序依 reservationDate 由新到舊（DESC），相同時依 slotSortOrder 由小到大（ASC），再依 createdAt 由新到舊（DESC），最後依唯一欄位 id 由小到大（ASC）；page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。page 或 pageSize 不合法時回應 400（PAGINATION_INVALID），其他查詢參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）。
      parameters:
        - name: status
          in: query
          required: false
          description: 選填的預約狀態篩選條件（6 種預約狀態之一）
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - name: hasPendingRescheduleRequest
          in: query
          required: false
          description: 選填的改期審核中篩選條件（true 只回傳有改期審核中申請的預約，false 只回傳沒有的預約）
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: 要查詢的頁碼，從 1 開始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每頁筆數，預設 20，上限 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分頁的本人預約借還紀錄、取消原因與改期紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPage'
        '400':
          $ref: '#/components/responses/PaginationOrQueryInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reservations/{reservationId}/cancel:
    parameters:
      - name: reservationId
        in: path
        required: true
        description: 預約借用紀錄唯一識別碼
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelReservation
      tags: [B5 成員預約查詢、取消與改期 API]
      summary: 取消本人尚未開始的待審核或已核准／有效預約（取消原因記為成員取消）
      description: |
        依 FR-018 保留 006 的取消規則：只允許本人在時段開始前取消 pending_approval 或尚未領取的 confirmed 預約，取消後狀態變成 cancelled 並釋出時段；預約有「改期審核中」申請時，同一交易內把該申請更新為 expired（expireReason 為 reservation_cancelled）。
        依 FR-015、US3 情境 5 與 research §1，本操作把 cancelReason 記為 member_cancelled，所以「我的預約」不顯示「設備送修」或「設備停用」。
        預約已因設備送修或停用被取消時，與其他已取消預約相同，回應 409（RESERVATION_ALREADY_CANCELLED），message 寫出取消時間與取消原因。已領取或已歸還時回應 409（RESERVATION_ALREADY_CHECKED_OUT），時段已開始時回應 409（RESERVATION_ALREADY_STARTED），已駁回時回應 409（INVALID_RESERVATION_STATUS）；路徑參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；非本人預約時回應 403（FORBIDDEN）；預約不存在時回應 404（RESOURCE_NOT_FOUND）。NFR-001 錯誤訊息使用臺灣繁體中文。
      responses:
        '200':
          description: 取消成功，回傳更新為 cancelled、cancelReason 為 member_cancelled 的預約與其改期紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CancelReservationConflict'
  /reservations/{reservationId}/reschedule-requests:
    parameters:
      - name: reservationId
        in: path
        required: true
        description: 要改期的預約唯一識別碼
        schema:
          type: string
          format: uuid
    post:
      operationId: createRescheduleRequest
      tags: [B5 成員預約查詢、取消與改期 API]
      summary: 對本人預約送出改期（免審核設備即時改期，需人工審核設備建立改期審核中申請）
      description: |
        依 FR-018 保留 006 的改期規則：預約須屬於本人、狀態為 confirmed 且原時段尚未開始；新時段為同一台設備、當日起算 7 天內、尚未開始、不同於原時段且未被占用。依送出當下設備的 requiresApproval 決定結果：免審核設備即時把原預約改到新時段並建立 approved 的改期申請；需人工審核設備建立 pending_approval 的改期申請，原預約維持原時段。
        依 FR-009 與 research §3，免審核設備的即時改期在交易第一個語句以 `SELECT status, requires_approval FROM equipments ... FOR SHARE` 鎖定設備列，取得鎖之後才檢查設備狀態；設備 status 不是 available 時回應 409（EQUIPMENT_UNAVAILABLE），message 依狀態寫「設備送修中」或「設備已停用」。依 FR-002、FR-003，預約已因設備送修或停用被取消時，狀態不是 confirmed，回應 409（RESCHEDULE_NOT_ALLOWED）。
        預約狀態不是 confirmed 或原時段已開始時回應 409（RESCHEDULE_NOT_ALLOWED）；新時段與原時段相同、已開始、超出 7 天，或本人在該時段已有未結束預約時回應 400（RESCHEDULE_TARGET_INVALID）；新時段已被占用或同時搶占失敗時回應 409（RESCHEDULE_SLOT_CONFLICT）；同一預約已有改期審核中申請時回應 409（RESCHEDULE_ALREADY_PENDING）。欄位格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；非本人預約時回應 403（FORBIDDEN）；預約或時段不存在時回應 404（RESOURCE_NOT_FOUND）。NFR-001 錯誤訊息使用臺灣繁體中文並說明失敗原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRescheduleRequestRequest'
      responses:
        '201':
          description: 改期已送出；免審核設備時 rescheduleRequest.status 為 approved 且 reservation 已在新時段，需人工審核設備時 rescheduleRequest.status 為 pending_approval 且 reservation 維持原時段
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRescheduleRequestResponse'
        '400':
          $ref: '#/components/responses/RescheduleBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CreateRescheduleConflict'
  /reschedule-requests/{rescheduleRequestId}/withdraw:
    parameters:
      - name: rescheduleRequestId
        in: path
        required: true
        description: 改期申請唯一識別碼
        schema:
          type: string
          format: uuid
    post:
      operationId: withdrawRescheduleRequest
      tags: [B5 成員預約查詢、取消與改期 API]
      summary: 撤回本人改期審核中的改期申請
      description: |
        依 FR-018 保留 006 的撤回規則：成員撤回本人 pending_approval 的改期申請，申請更新為 withdrawn 並寫入 withdrawnAt，原預約不變。依 FR-004，原預約因設備送修或停用被取消後，申請已變成 expired，撤回時回應 409（INVALID_RESCHEDULE_STATUS）。
        處理前先讓到期的改期申請失效。申請已非 pending_approval 時回應 409（INVALID_RESCHEDULE_STATUS）；路徑參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；非本人申請時回應 403（FORBIDDEN）；申請不存在時回應 404（RESOURCE_NOT_FOUND）。NFR-001 錯誤訊息使用臺灣繁體中文。
      responses:
        '200':
          description: 撤回成功，回傳更新為 withdrawn 的改期申請
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleRequest'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RescheduleStatusConflict'
  /admin/reservations/pending:
    get:
      operationId: listPendingReservations
      tags: [B6 管理員待審核准駁回（含改期申請）、全體預約與現場領取歸還 API]
      summary: 管理員分頁查詢待審核預約申請清單
      description: |
        依 FR-018 保留 006 的待審核預約申請清單（只含 pending_approval 的預約；改期申請由 GET /admin/reschedule-requests 提供），支援依 equipmentId 篩選。依 FR-002、Edge Cases 待審核的預約，因設備送修或停用被取消的待審核預約已是 cancelled，不出現在本清單。
        排序依 reservationDate 由近到遠（ASC），相同時依 slotSortOrder 由小到大（ASC），再依 createdAt 由早到晚（ASC），最後依唯一欄位 id 由小到大（ASC）；page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。page 或 pageSize 不合法時回應 400（PAGINATION_INVALID），其他查詢參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；一般成員呼叫時回應 403（FORBIDDEN）。
      parameters:
        - name: equipmentId
          in: query
          required: false
          description: 選填的設備唯一識別碼篩選條件
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: 要查詢的頁碼，從 1 開始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每頁筆數，預設 20，上限 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分頁的待審核預約申請清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReservationPage'
        '400':
          $ref: '#/components/responses/PaginationOrQueryInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reservations:
    get:
      operationId: listAllReservations
      tags: [B6 管理員待審核准駁回（含改期申請）、全體預約與現場領取歸還 API]
      summary: 管理員分頁查詢全體成員的預約借還紀錄（含取消原因）
      description: |
        依 FR-018 保留 006 的全體預約借還紀錄查詢、6 態狀態與 equipmentId 篩選及 pendingRescheduleRequest。依 FR-020、US1 情境 17，每筆紀錄新增 cancelReason：因設備送修或停用被取消的預約為 equipment_maintenance 或 equipment_retired，前端顯示「設備送修」「設備停用」，管理員從這裡找出受影響的成員；成員自行取消為 member_cancelled，未取消為 null。送修中與停用設備上的紀錄照常回傳。
        查詢前先讓到期的改期申請失效。排序依 reservationDate 由新到舊（DESC），相同時依 slotSortOrder 由小到大（ASC），再依 createdAt 由新到舊（DESC），最後依唯一欄位 id 由小到大（ASC）；page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。page 或 pageSize 不合法時回應 400（PAGINATION_INVALID），其他查詢參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；一般成員呼叫時回應 403（FORBIDDEN）。
      parameters:
        - name: status
          in: query
          required: false
          description: 選填的預約狀態篩選條件（6 種預約狀態之一）
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - name: equipmentId
          in: query
          required: false
          description: 選填的設備唯一識別碼篩選條件
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: 要查詢的頁碼，從 1 開始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每頁筆數，預設 20，上限 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分頁的全體成員預約借還紀錄（含取消原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReservationPage'
        '400':
          $ref: '#/components/responses/PaginationOrQueryInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reservations/{reservationId}/approve:
    parameters:
      - name: reservationId
        in: path
        required: true
        description: 待審核預約申請唯一識別碼
        schema:
          type: string
          format: uuid
    post:
      operationId: approveReservation
      tags: [B6 管理員待審核准駁回（含改期申請）、全體預約與現場領取歸還 API]
      summary: 管理員核准待審核預約申請（鎖定設備列並檢查設備狀態）
      description: |
        依 FR-018 保留 006 的待審預約核准規則：申請須為 pending_approval 且時段尚未開始，交易內重檢時段未被占用，通過時更新為 confirmed 並記錄審核管理員與審核時間。
        依 FR-009 與 research §3，交易第一個語句以 `SELECT status, requires_approval FROM equipments ... FOR SHARE` 鎖定設備列，取得鎖之後才檢查設備狀態；與設定送修或停用同時發生時，本操作不是被拒絕，就是核准後被該次設定取消。取得鎖後，申請已非 pending_approval（含依 FR-002、Edge Cases 待審核的預約，已因設備送修或停用被取消）時回應 409（INVALID_RESERVATION_STATUS），message 寫出取消時間與原因；設備 status 不是 available 時回應 409（EQUIPMENT_UNAVAILABLE）。
        時段已被占用或同時搶占失敗時回應 409（RESERVATION_CONFLICT）；時段已開始時回應 400（RESERVATION_ALREADY_STARTED）；路徑參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；一般成員呼叫時回應 403（FORBIDDEN）；申請不存在時回應 404（RESOURCE_NOT_FOUND）。NFR-001 錯誤訊息使用臺灣繁體中文。
      responses:
        '200':
          description: 核准成功並占用時段，回傳更新後的預約紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReservationItem'
        '400':
          $ref: '#/components/responses/ReviewReservationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ApproveReservationConflict'
  /admin/reservations/{reservationId}/reject:
    parameters:
      - name: reservationId
        in: path
        required: true
        description: 待審核預約申請唯一識別碼
        schema:
          type: string
          format: uuid
    post:
      operationId: rejectReservation
      tags: [B6 管理員待審核准駁回（含改期申請）、全體預約與現場領取歸還 API]
      summary: 管理員駁回待審核預約申請並記錄選填駁回原因
      description: |
        依 FR-018 保留 006 的待審預約駁回規則：申請須為 pending_approval 且時段尚未開始，駁回後更新為 rejected 並記錄審核管理員、審核時間與選填駁回原因（上限 200 字）。依 FR-002，申請已因設備送修或停用被取消時回應 409（INVALID_RESERVATION_STATUS）。
        駁回原因超過 200 字或路徑參數格式不符時回應 400（VALIDATION_FAILED）；時段已開始時回應 400（RESERVATION_ALREADY_STARTED）；未登入時回應 401（UNAUTHORIZED）；一般成員呼叫時回應 403（FORBIDDEN）；申請不存在時回應 404（RESOURCE_NOT_FOUND）；已非 pending_approval 時回應 409（INVALID_RESERVATION_STATUS）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectReservationRequest'
      responses:
