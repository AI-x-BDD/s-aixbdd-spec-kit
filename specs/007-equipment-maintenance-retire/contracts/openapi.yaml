                $ref: '#/components/schemas/AdminReservationItem'
        '400':
          $ref: '#/components/responses/PickupReservationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReservationStatusConflict'
  /admin/reservations/{reservationId}/return:
