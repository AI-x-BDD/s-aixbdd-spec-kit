      summary: 管理員分頁查詢改期申請清單（待審清單的「改期申請」分頁）
      description: |
        依 FR-018 保留 006 的改期申請清單；待審清單以 status=pending_approval 查詢。依 FR-004、Edge Cases 改期申請審核中，原預約因設備送修或停用被取消時，申請已變成 expired（expireReason 為 reservation_cancelled），不再出現在 status=pending_approval 的結果。
        查詢前先讓到期的改期申請失效。排序依新日期 toReservationDate 由近到遠（ASC），相同時依新時段順序 toSlot.sortOrder 由小到大（ASC），再依申請時間 createdAt 由早到晚（ASC），最後依唯一欄位 id 由小到大（ASC）；page 大於 totalPages 時回應 200，items 為空陣列，totalItems 與 totalPages 照常回傳。page 或 pageSize 不合法時回應 400（PAGINATION_INVALID），其他查詢參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；一般成員呼叫時回應 403（FORBIDDEN）。
      parameters:
        - name: status
