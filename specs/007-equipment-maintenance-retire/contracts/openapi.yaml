          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: 要查詢的頁碼，從 1 開始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每頁筆數，預設 20，上限 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分頁的改期申請清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRescheduleRequestPage'
        '400':
          $ref: '#/components/responses/PaginationOrQueryInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reschedule-requests/{rescheduleRequestId}/approve:
    parameters:
      - name: rescheduleRequestId
        in: path
        required: true
        description: 改期申請唯一識別碼
        schema:
          type: string
          format: uuid
    post:
      operationId: approveRescheduleRequest
      tags: [B6 管理員待審核准駁回（含改期申請）、全體預約與現場領取歸還 API]
      summary: 管理員核准改期申請（鎖定設備列並檢查設備狀態）
      description: |
        依 FR-018 保留 006 的改期核准規則：申請仍為 pending_approval、原預約仍為 confirmed、原時段與新時段都尚未開始且新時段未被占用時，把原預約改到新時段並把申請更新為 approved。
        依 FR-009 與 research §3，交易第一個語句以 `SELECT status, requires_approval FROM equipments ... FOR SHARE` 鎖定設備列，取得鎖之後才檢查設備狀態。依 FR-004、Edge Cases 改期申請審核中，原預約因設備送修或停用被取消後，申請已是 expired（expireReason 為 reservation_cancelled），回應 409（INVALID_RESCHEDULE_STATUS），管理員不能核准；設備 status 不是 available 時回應 409（EQUIPMENT_UNAVAILABLE）。
        申請已撤回、已駁回、已核准或已失效時回應 409（INVALID_RESCHEDULE_STATUS）；新時段已被占用或同時搶占失敗時回應 409（RESCHEDULE_SLOT_CONFLICT），申請維持 pending_approval。路徑參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；一般成員呼叫時回應 403（FORBIDDEN）；申請不存在時回應 404（RESOURCE_NOT_FOUND）。NFR-001 錯誤訊息使用臺灣繁體中文。
      responses:
        '200':
          description: 核准成功，回傳更新為 approved 的改期申請（原預約已在新時段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRescheduleRequestItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ApproveRescheduleConflict'
  /admin/reschedule-requests/{rescheduleRequestId}/reject:
    parameters:
      - name: rescheduleRequestId
        in: path
        required: true
        description: 改期申請唯一識別碼
        schema:
          type: string
          format: uuid
    post:
      operationId: rejectRescheduleRequest
      tags: [B6 管理員待審核准駁回（含改期申請）、全體預約與現場領取歸還 API]
      summary: 管理員駁回改期申請並記錄選填駁回原因
      description: |
        依 FR-018 保留 006 的改期駁回規則：把 pending_approval 的改期申請更新為 rejected，記錄審核管理員、審核時間與選填駁回原因（上限 200 字），原預約不變。依 FR-004，原預約因設備送修或停用被取消後，申請已是 expired，回應 409（INVALID_RESCHEDULE_STATUS）。
        處理前先讓到期的改期申請失效。駁回原因超過 200 字或路徑參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；一般成員呼叫時回應 403（FORBIDDEN）；申請不存在時回應 404（RESOURCE_NOT_FOUND）；申請已非 pending_approval 時回應 409（INVALID_RESCHEDULE_STATUS）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRescheduleRequestRequest'
      responses:
        '200':
          description: 駁回成功，回傳更新為 rejected 的改期申請
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRescheduleRequestItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RescheduleStatusConflict'
  /admin/reservations/{reservationId}/pickup:
    parameters:
      - name: reservationId
        in: path
        required: true
        description: 要登記領取的預約唯一識別碼
        schema:
          type: string
          format: uuid
    post:
      operationId: pickupReservationByAdmin
      tags: [B6 管理員待審核准駁回（含改期申請）、全體預約與現場領取歸還 API]
      summary: 管理員現場登記領取
      description: |
        依 FR-018 保留 006 的登記領取規則：預約須為 confirmed、預約日期為 Asia/Taipei 當日，且目前時間尚未超過該時段結束時間；通過時更新為 checked_out 並記錄領取時間與經手管理員，有改期審核中申請時同一交易內使申請失效。
        依 FR-003、Edge Cases 時段進行中但尚未領取，時段已開始但尚未領取的預約因設備送修或停用被取消後，狀態為 cancelled，回應 409（INVALID_RESERVATION_STATUS），message 寫出取消時間與原因，成員不能再領取這台設備。
        未來日期時回應 400（PICKUP_DATE_NOT_TODAY），過去日期或時段已結束時回應 400（PICKUP_WINDOW_EXPIRED），路徑參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；一般成員呼叫時回應 403（FORBIDDEN）；預約不存在時回應 404（RESOURCE_NOT_FOUND）；非 confirmed 狀態時回應 409（INVALID_RESERVATION_STATUS）。
      responses:
        '200':
          description: 登記領取成功，狀態更新為 checked_out
          content:
            application/json:
