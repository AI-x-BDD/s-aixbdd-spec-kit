        依 FR-018 保留 006 的登記歸還規則：紀錄須為 checked_out，不論在時段結束前或逾時歸還都照常更新為 returned，記錄歸還時間與經手管理員。依 FR-005、Edge Cases 設備有逾期未還的借用，登記歸還後設備不再有借用中的預約，管理員才能把它設為送修或停用。
        路徑參數格式不符時回應 400（VALIDATION_FAILED）；未登入時回應 401（UNAUTHORIZED）；一般成員呼叫時回應 403（FORBIDDEN）；紀錄不存在時回應 404（RESOURCE_NOT_FOUND）；非 checked_out 狀態時回應 409（INVALID_RESERVATION_STATUS）。
      responses:
