<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設備固定時段狀態與預約｜精密實驗設備借用中心</title>
<style>
  /* 視覺風格（ui/plan.md 第 2 節） */
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --surface-muted: #F1F5F9;
    --ink: #0F172A;
    --muted: #475569;
    --line: #E2E8F0;
    --primary: #2563EB;
    --primary-soft: #DBEAFE;
    --danger: #DC2626;
    --danger-soft: #FEE2E2;
    --pending: #D97706;
    --pending-soft: #FEF3C7;
    --success: #16A34A;
    --success-soft: #DCFCE7;
    --occupied: #64748B;
    --occupied-soft: #F1F5F9;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .06);
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #0F172A;
    --surface: #1E293B;
    --surface-muted: #162032;
    --ink: #F8FAFC;
    --muted: #94A3B8;
    --line: #334155;
    --primary: #3B82F6;
    --primary-soft: #1E3A8A;
    --danger: #EF4444;
    --danger-soft: #7F1D1D;
    --pending: #F59E0B;
    --pending-soft: #78350F;
    --success: #22C55E;
    --success-soft: #14532D;
    --occupied: #94A3B8;
    --occupied-soft: #334155;
    --shadow: 0 1px 3px rgba(15, 23, 42, .35), 0 6px 20px rgba(15, 23, 42, .35);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); transition: background-color .15s, color .15s; }
  a { color: inherit; }
  code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .site-header { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
  .site-header .inner { max-width: 1120px; margin: 0 auto; padding: 0 16px; min-height: 64px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: .04em; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .brand-mark { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: #FFFFFF; font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
  .site-nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .site-nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
  .site-nav a[aria-current="page"] { color: var(--primary); background: var(--primary-soft); font-weight: 600; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .user-pill { padding: 4px 10px; border-radius: 999px; background: var(--surface-muted); border: 1px solid var(--line); color: var(--muted); font-size: 13px; white-space: nowrap; }
  .btn-theme, .btn-logout { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .btn-theme:hover, .btn-logout:hover { border-color: var(--primary); color: var(--primary); }
  @media (max-width: 720px) { .user-pill { display: none; } .site-header .inner { padding: 8px 12px; } }

  main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 96px; }
  h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.3; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  .page-lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .section-card { margin-bottom: 20px; padding: 20px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .section-head h2 { margin: 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; transition: border-color .15s, background-color .15s; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--primary); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #FFFFFF; }
  .btn-pending { background: var(--pending); border-color: var(--pending); color: #FFFFFF; }
  .btn-success { background: var(--success); border-color: var(--success); color: #FFFFFF; }
  .btn-outline-danger { color: var(--danger); border-color: var(--danger); }
  .btn-sm { height: 34px; padding: 0 12px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-block { width: 100%; }

  .banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; padding: 12px 16px; border-radius: var(--radius); border: 1px solid transparent; font-size: 14px; }
  .banner-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .banner-success { background: var(--success-soft); color: var(--success); border-color: var(--success); }
  .banner-pending { background: var(--pending-soft); color: var(--pending); border-color: var(--pending); }
  .banner-info { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  [data-theme="dark"] .banner { color: var(--ink); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
  .badge-available { background: var(--success-soft); color: var(--success); }
  .badge-mine { background: var(--primary-soft); color: var(--primary); }
  .badge-loan { background: var(--primary); color: #FFFFFF; }
  .badge-returned { background: var(--success-soft); color: var(--success); }
  .badge-pending { background: var(--pending-soft); color: var(--pending); }
  .badge-occupied { background: var(--occupied-soft); color: var(--occupied); }
  .badge-rejected { background: var(--danger-soft); color: var(--danger); }
  .badge-reschedule { background: var(--surface); color: var(--pending); border: 1px dashed var(--pending); }
  [data-theme="dark"] .badge-available, [data-theme="dark"] .badge-mine, [data-theme="dark"] .badge-returned, [data-theme="dark"] .badge-pending, [data-theme="dark"] .badge-rejected { color: var(--ink); }

  .spinner { width: 20px; height: 20px; border: 3px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { background: var(--surface-muted); border-radius: 8px; min-height: 20px; border: 1px dashed var(--line); }
  .loading-line { display: flex; align-items: center; gap: 10px; color: var(--muted); margin-bottom: 14px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
  .field .req { margin-left: 2px; color: var(--danger); }
  .field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
  .field input { height: 42px; }
  .field textarea { min-height: 96px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: 3px solid var(--primary-soft); border-color: var(--primary); }
  .field input:disabled { background: var(--surface-muted); color: var(--muted); }
  .field.has-error input, .field.has-error textarea { border-color: var(--danger); outline-color: var(--danger-soft); }
  .field .hint { margin-top: 4px; color: var(--muted); font-size: 12px; }
  .field .error { margin-top: 4px; color: var(--danger); font-size: 13px; font-weight: 500; }

  .dialog-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(15, 23, 42, .45); display: grid; place-items: center; padding: 16px; }
  .dialog { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px; }
  .dialog-wide { width: min(880px, 100%); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .dialog-error { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); font-size: 13px; font-weight: 500; }
  [data-theme="dark"] .dialog-error { color: var(--ink); }
  .notice { margin: 12px 0; padding: 10px 12px; border-radius: 8px; font-size: 13px; border: 1px solid var(--line); background: var(--surface-muted); }
  .notice-pending { background: var(--pending-soft); border-color: var(--pending); }
  .notice-success { background: var(--success-soft); border-color: var(--success); }
  @media (max-width: 640px) { .dialog-backdrop { padding: 0; } .dialog { width: 100%; min-height: 100vh; max-height: 100vh; border-radius: 0; } }
  .detail-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
  .detail-list dt { color: var(--muted); }
  .detail-list dd { margin: 0; font-weight: 600; }
  .empty-state { padding: 36px 20px; text-align: center; }

  /* 固定時段格子（設備預約與申請改期共用） */
  .slot { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .slot:hover { border-color: var(--primary); }
  .slot .slot-name { font-weight: 700; font-size: 14px; }
  .slot .slot-time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .slot .slot-state { font-weight: 600; font-size: 12px; }
  .slot-available { border-color: var(--success); }
  .slot-available .slot-state { color: var(--success); }
  .slot-mine { background: var(--primary-soft); border-color: var(--primary); }
  .slot-mine .slot-state { color: var(--primary); }
  .slot-my-loan { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
  .slot-my-loan .slot-time, .slot-my-loan .slot-state { color: #FFFFFF; }
  .slot-my-returned { background: var(--success-soft); border-color: var(--success); }
  .slot-my-returned .slot-state { color: var(--success); }
  .slot-my-pending { background: var(--pending-soft); border-color: var(--pending); }
  .slot-my-pending .slot-state { color: var(--pending); }
  .slot-my-reschedule { background: var(--surface); border: 1.5px dashed var(--pending); }
  .slot-my-reschedule .slot-state { color: var(--pending); }
  .slot-occupied, .slot-closed { background: var(--occupied-soft); border-color: var(--line); color: var(--muted); }
  .slot-occupied .slot-state, .slot-closed .slot-state { color: var(--occupied); }
  .slot-original { background: var(--surface-muted); border: 1.5px solid var(--primary); }
  .slot-original .slot-state { color: var(--primary); }
  .slot.selected { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 3px var(--primary-soft); }
  .slot.selected .slot-state { color: var(--primary); }
  [data-theme="dark"] .slot-mine .slot-state, [data-theme="dark"] .slot-my-returned .slot-state, [data-theme="dark"] .slot-my-pending .slot-state, [data-theme="dark"] .slot.selected .slot-state { color: var(--ink); }

  /* 雛形狀態面板 */
  .proto-panel { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 13px; }
  .proto-toggle { padding: 8px 14px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font: inherit; cursor: pointer; box-shadow: var(--shadow); }
  .proto-body { width: 220px; max-height: 60vh; overflow: auto; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .proto-body p { margin: 0 0 6px; color: var(--muted); }
  .proto-body label { display: flex; gap: 8px; padding: 3px 0; cursor: pointer; }
  @media (max-width: 640px) { .proto-panel { top: 68px; bottom: auto; flex-direction: column-reverse; } }

  /* 設備預約頁 */
  .toolbar { padding: 18px 20px; margin-bottom: 20px; }
  .toolbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .toolbar select { height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
  .date-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .date-chip { height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
  .date-chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #FFFFFF; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .legend .badge { font-size: 11px; }
  .booking-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .booking-layout { grid-template-columns: 1fr; } }
  .equipment-list { display: grid; gap: 14px; }
  .eq-card { padding: 16px 18px; }
  .eq-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .eq-head .badge { align-self: flex-start; }
  .eq-title { font-weight: 700; }
  .eq-meta { font-size: 12px; color: var(--muted); }
  .slots-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 640px) { .slots-grid { grid-template-columns: 1fr; } }
  .slot-note { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .slot-my-loan .slot-note { color: #FFFFFF; }
  .confirm-panel { position: sticky; top: 84px; padding: 20px; }
  .summary { margin: 12px 0; padding: 12px 14px; border-radius: 10px; background: var(--surface-muted); border: 1px solid var(--line); }
  .summary .detail-list { font-size: 13px; }
  .panel-error { margin-top: 10px; color: var(--danger); font-size: 13px; font-weight: 500; }
  .skeleton-card { padding: 18px; display: grid; gap: 12px; }
</style>
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html"><span class="brand-mark">EL</span>精密實驗設備借用中心</a>
    <nav class="site-nav" aria-label="主要導覽">
      <a href="index.html">登入</a>
      <a href="booking.html" aria-current="page">設備預約</a>
      <a href="my-reservations.html">我的預約</a>
      <a href="admin.html">審核與借用管理</a>
    </nav>
    <div class="header-actions">
      <span id="header-user" class="user-pill">尚未登入</span>
      <button id="theme-toggle" class="btn-theme" type="button" aria-label="切換深淺色主題">深色模式</button>
      <a id="header-logout" class="btn-logout" href="index.html?state=logged-out">登出</a>
    </div>
  </div>
</header>

<main>
  <h1>設備預約</h1>
  <p class="page-lead">選擇當日起算 7 天內的日期（<span class="mono">2026-11-09</span> 至 <span class="mono">2026-11-15</span>），查看每台設備 3 個固定時段的狀態，並送出預約。</p>

  <div id="page-banner" class="banner" role="alert" hidden>
    <span id="page-banner-text"></span>
    <a id="page-banner-link" class="btn btn-sm" href="my-reservations.html" hidden></a>
  </div>

  <section id="view-loading" hidden>
    <div class="card toolbar">
      <div class="loading-line"><span class="spinner" aria-hidden="true"></span><span>正在載入設備與固定時段狀態…</span></div>
      <div class="skeleton" style="height:36px;"></div>
    </div>
    <div class="equipment-list">
      <div class="card skeleton-card"><div class="skeleton" style="height:22px;width:45%;"></div><div class="skeleton" style="height:64px;"></div></div>
      <div class="card skeleton-card"><div class="skeleton" style="height:22px;width:50%;"></div><div class="skeleton" style="height:64px;"></div></div>
      <div class="card skeleton-card"><div class="skeleton" style="height:22px;width:40%;"></div><div class="skeleton" style="height:64px;"></div></div>
    </div>
  </section>

  <section id="view-main">
    <div class="card toolbar">
      <div class="toolbar-row">
        <div><strong>選擇日期</strong> <span class="muted" style="font-size:13px;">目前時間 <span class="mono">2026-11-09 14:30</span>（台灣時間）</span></div>
        <label class="muted" style="font-size:13px;">登入成員
          <select id="viewer-select">
            <option value="lin.yating">林雅婷 (lin.yating)</option>
            <option value="chen.guanting">陳冠廷 (chen.guanting)</option>
          </select>
        </label>
      </div>
      <div id="date-chips" class="date-chips" role="group" aria-label="開放預約日期"></div>
      <div class="legend" aria-label="時段狀態說明">
        <span class="badge badge-available">可預約</span>
        <span class="badge badge-pending">本人待審核</span>
        <span class="badge badge-mine">本人已預約</span>
        <span class="badge badge-loan">本人借用中</span>
        <span class="badge badge-returned">本人已歸還</span>
        <span class="badge badge-reschedule">本人改期審核中</span>
        <span class="badge badge-occupied">已被預約</span>
        <span class="badge badge-occupied">時段已開始</span>
      </div>
    </div>

    <div class="booking-layout">
      <div id="equipment-list" class="equipment-list"></div>
      <aside class="card confirm-panel" aria-label="預約確認">
        <h2>預約確認</h2>
        <div class="summary">
          <dl class="detail-list">
            <dt>申請成員</dt><dd id="sum-member">林雅婷</dd>
            <dt>日期</dt><dd id="sum-date" class="mono">2026-11-09（一）</dd>
            <dt>設備</dt><dd id="sum-eq">尚未選擇</dd>
            <dt>審核方式</dt><dd id="sum-mode">尚未選擇</dd>
            <dt>固定時段</dt><dd id="sum-slot" class="mono">尚未選擇</dd>
          </dl>
        </div>
        <div id="panel-notice" class="notice">請在左側點選一個標示「可預約」的固定時段。</div>
        <button id="submit-btn" class="btn btn-primary btn-block" type="button">送出預約</button>
        <a id="panel-link" class="btn btn-sm btn-block" style="margin-top:10px;" href="my-reservations.html" hidden>查看我的預約</a>
        <div id="panel-error" class="panel-error" role="alert" hidden></div>
      </aside>
    </div>
  </section>
</main>



<aside class="proto-panel" aria-label="雛形狀態">
  <div class="proto-body" hidden></div>
  <button class="proto-toggle" type="button" aria-expanded="false"></button>
</aside>

<script>
  // 假資料：與 index.html、my-reservations.html、admin.html 共用同一批成員、設備、預約與改期申請；目前時間 2026-11-09 14:30
  const MOCK = {
    today: '2026-11-09',
    nowHour: 14.5,
    members: { 'lin.yating': '林雅婷', 'chen.guanting': '陳冠廷' },
    dates: [
      { date: '2026-11-09', label: '11/09（一）今日' },
      { date: '2026-11-10', label: '11/10（二）' },
      { date: '2026-11-11', label: '11/11（三）' },
      { date: '2026-11-12', label: '11/12（四）' },
      { date: '2026-11-13', label: '11/13（五）' },
      { date: '2026-11-14', label: '11/14（六）' },
      { date: '2026-11-15', label: '11/15（日）' }
    ],
    slots: [
      { id: 'AM', name: '上午', time: '09:00–12:00', start: 9 },
      { id: 'PM', name: '下午', time: '13:00–17:00', start: 13 },
      { id: 'EV', name: '晚間', time: '18:00–21:00', start: 18 }
    ],
    equipments: [
      { id: 'EQ-101', name: '高解析度光學顯微鏡 Olympus BX53', category: '光學檢測', location: 'A 棟 302 光學實驗室', requiresApproval: true },
      { id: 'EQ-102', name: '四通道數位示波器 Keysight DSOX3024T', category: '電子量測', location: 'B 棟 205 電子量測室', requiresApproval: true },
      { id: 'EQ-103', name: '高精度工業熱像儀 FLIR E86', category: '熱流分析', location: 'B 棟 208 熱流實驗室', requiresApproval: false },
      { id: 'EQ-104', name: '微量分光光度計 Thermo NanoDrop One', category: '生醫分析', location: 'C 棟 401 生醫分析室', requiresApproval: false }
    ],
    records: [
      { id: 'RV-20261108-01', user: 'lin.yating', eq: 'EQ-102', date: '2026-11-09', slot: 'AM', status: 'returned' },
      { id: 'RV-20261108-03', user: 'lin.yating', eq: 'EQ-101', date: '2026-11-09', slot: 'PM', status: 'checked_out' },
      { id: 'RV-20261109-08', user: 'lin.yating', eq: 'EQ-101', date: '2026-11-09', slot: 'EV', status: 'pending_approval' },
      { id: 'RV-20261109-09', user: 'chen.guanting', eq: 'EQ-101', date: '2026-11-09', slot: 'EV', status: 'pending_approval' },
      { id: 'RV-20261108-06', user: 'lin.yating', eq: 'EQ-102', date: '2026-11-09', slot: 'EV', status: 'confirmed' },
      { id: 'RV-20261107-03', user: 'lin.yating', eq: 'EQ-104', date: '2026-11-09', slot: 'PM', status: 'confirmed' },
      { id: 'RV-20261108-10', user: 'chen.guanting', eq: 'EQ-104', date: '2026-11-09', slot: 'EV', status: 'confirmed' },
      { id: 'RV-20261108-05', user: 'lin.yating', eq: 'EQ-104', date: '2026-11-10', slot: 'AM', status: 'confirmed' },
      { id: 'RV-20261109-13', user: 'chen.guanting', eq: 'EQ-104', date: '2026-11-10', slot: 'EV', status: 'confirmed' },
      { id: 'RV-20261109-07', user: 'lin.yating', eq: 'EQ-102', date: '2026-11-10', slot: 'AM', status: 'rejected' },
      { id: 'RV-20261107-06', user: 'lin.yating', eq: 'EQ-101', date: '2026-11-10', slot: 'AM', status: 'cancelled' },
      { id: 'RV-20261108-04', user: 'lin.yating', eq: 'EQ-101', date: '2026-11-11', slot: 'AM', status: 'confirmed' },
      { id: 'RV-20261108-07', user: 'lin.yating', eq: 'EQ-103', date: '2026-11-12', slot: 'PM', status: 'confirmed' },
      { id: 'RV-20261109-12', user: 'lin.yating', eq: 'EQ-102', date: '2026-11-12', slot: 'PM', status: 'confirmed' },
      { id: 'RV-20261108-11', user: 'chen.guanting', eq: 'EQ-102', date: '2026-11-13', slot: 'AM', status: 'confirmed' },
      { id: 'RV-20261107-04', user: 'lin.yating', eq: 'EQ-101', date: '2026-11-13', slot: 'AM', status: 'confirmed' }
    ],
    pendingReschedules: [
      { id: 'RR-20261109-04', user: 'lin.yating', reservationId: 'RV-20261108-06', eq: 'EQ-102', fromDate: '2026-11-09', fromSlot: 'EV', toDate: '2026-11-10', toSlot: 'EV' },
      { id: 'RR-20261109-02', user: 'lin.yating', reservationId: 'RV-20261108-04', eq: 'EQ-101', fromDate: '2026-11-11', fromSlot: 'AM', toDate: '2026-11-11', toSlot: 'EV' },
      { id: 'RR-20261109-03', user: 'chen.guanting', reservationId: 'RV-20261108-11', eq: 'EQ-102', fromDate: '2026-11-13', fromSlot: 'AM', toDate: '2026-11-12', toSlot: 'PM' }
    ]
  };

  const OWN_STATUS = { pending_approval: 'pending', confirmed: 'mine', checked_out: 'loan', returned: 'returned' };
  const OCCUPYING = ['confirmed', 'checked_out', 'returned'];
  const SLOT_META = {
    available: { cls: 'slot-available', text: '可預約' },
    pending: { cls: 'slot-my-pending', text: '本人待審核' },
    mine: { cls: 'slot-mine', text: '本人已預約' },
    loan: { cls: 'slot-my-loan', text: '本人借用中' },
    returned: { cls: 'slot-my-returned', text: '本人已歸還' },
    reschedule: { cls: 'slot-my-reschedule', text: '本人改期審核中' },
    occupied: { cls: 'slot-occupied', text: '已被預約' },
    closed: { cls: 'slot-closed', text: '時段已開始' }
  };
  const WEEKDAY = { '2026-11-09': '一', '2026-11-10': '二', '2026-11-11': '三', '2026-11-12': '四', '2026-11-13': '五', '2026-11-14': '六', '2026-11-15': '日' };

  const $ = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));

  function initTheme() {
    let saved = 'light';
    try { saved = localStorage.getItem('el-theme') || 'light'; } catch (err) { saved = 'light'; }
    applyTheme(saved);
    $('#theme-toggle').addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }

  function applyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      $('#theme-toggle').textContent = '淺色模式';
    } else {
      document.documentElement.removeAttribute('data-theme');
      $('#theme-toggle').textContent = '深色模式';
    }
    try { localStorage.setItem('el-theme', theme); } catch (err) { /* 瀏覽器不允許儲存時只切換本次畫面 */ }
  }

  function showBanner(tone, text, linkText, linkHref) {
    const banner = $('#page-banner');
    banner.className = `banner banner-${tone}`;
    $('#page-banner-text').textContent = text;
    const link = $('#page-banner-link');
    if (linkText) {
      link.textContent = linkText;
      link.setAttribute('href', linkHref);
      link.hidden = false;
    } else {
      link.hidden = true;
    }
    banner.hidden = false;
  }

  function hideBanner() {
    $('#page-banner').hidden = true;
  }

  function setUser(text) {
    $('#header-user').textContent = text;
  }
  let viewer = 'lin.yating';
  let currentDate = '2026-11-09';
  let selected = null;
  let records = [];

  const eqOf = id => MOCK.equipments.find(e => e.id === id);
  const slotOf = id => MOCK.slots.find(s => s.id === id);
  const slotText = (date, slotId) => `${date} ${slotOf(slotId).name} ${slotOf(slotId).time}`;

  function resetData(changes) {
    records = MOCK.records.map(r => Object.assign({}, r));
    (changes || []).forEach(change => Object.assign(records.find(r => r.id === change.id), change));
  }

  function slotStatus(eqId, date, slotId) {
    const own = records.find(r => r.user === viewer && r.eq === eqId && r.date === date && r.slot === slotId && OWN_STATUS[r.status]);
    if (own) return { key: OWN_STATUS[own.status], note: own.id };
    const other = records.find(r => r.user !== viewer && r.eq === eqId && r.date === date && r.slot === slotId && OCCUPYING.includes(r.status));
    if (other) return { key: 'occupied', note: '' };
    const request = MOCK.pendingReschedules.find(q => q.user === viewer && q.eq === eqId && q.toDate === date && q.toSlot === slotId);
    if (request) return { key: 'reschedule', note: request.id, request };
    if (date === MOCK.today && slotOf(slotId).start <= MOCK.nowHour) return { key: 'closed', note: '' };
    return { key: 'available', note: '' };
  }

  function renderDates() {
    $('#date-chips').innerHTML = MOCK.dates.map(d =>
      `<button class="date-chip mono" type="button" data-date="${d.date}" aria-pressed="${d.date === currentDate}">${d.label}</button>`).join('');
  }

  function renderEquipments() {
    $('#equipment-list').innerHTML = MOCK.equipments.map(eq => `
      <article class="card eq-card">
        <div class="eq-head">
          <div>
            <div class="eq-title"><span class="mono">${eq.id}</span> ${eq.name}</div>
            <div class="eq-meta">${eq.category}｜${eq.location}</div>
          </div>
          <span class="badge ${eq.requiresApproval ? 'badge-pending' : 'badge-available'}">${eq.requiresApproval ? '需人工審核' : '免審核'}</span>
        </div>
        <div class="slots-grid">
          ${MOCK.slots.map(slot => {
            const st = slotStatus(eq.id, currentDate, slot.id);
            const isSelected = selected && selected.eq === eq.id && selected.slot === slot.id;
            return `<button class="slot ${SLOT_META[st.key].cls}${isSelected ? ' selected' : ''}" type="button" data-eq="${eq.id}" data-slot="${slot.id}">
              <span class="slot-name">${slot.name}</span>
              <span class="slot-time">${slot.time}</span>
              <span class="slot-state">${isSelected ? '已選取' : SLOT_META[st.key].text}</span>
              ${st.note ? `<span class="slot-note">${st.note}</span>` : ''}
            </button>`;
          }).join('')}
        </div>
      </article>`).join('');
  }

  function renderPanel() {
    $('#sum-member').textContent = MOCK.members[viewer];
    $('#sum-date').textContent = `${currentDate}（${WEEKDAY[currentDate]}）`;
    $('#panel-error').hidden = true;
    $('#panel-link').hidden = true;
    const notice = $('#panel-notice');
    if (!selected) {
      $('#sum-eq').textContent = '尚未選擇';
      $('#sum-mode').textContent = '尚未選擇';
      $('#sum-slot').textContent = '尚未選擇';
      notice.className = 'notice';
      notice.textContent = '請在左側點選一個標示「可預約」的固定時段。';
      return;
    }
    const eq = eqOf(selected.eq);
    $('#sum-eq').textContent = `${eq.id} ${eq.name}`;
    $('#sum-mode').textContent = eq.requiresApproval ? '需人工審核' : '免審核';
    $('#sum-slot').textContent = `${slotOf(selected.slot).name} ${slotOf(selected.slot).time}`;
    if (eq.requiresApproval) {
      notice.className = 'notice notice-pending';
      notice.textContent = '送出後為「待審核」，管理員核准前不占用時段。';
    } else {
      notice.className = 'notice notice-success';
      notice.textContent = '送出後立即成為「已核准／有效」並占用時段。';
    }
  }

  function render() {
    $('#view-loading').hidden = true;
    $('#view-main').hidden = false;
    $('#viewer-select').value = viewer;
    setUser(`${MOCK.members[viewer]}（一般成員）`);
    renderDates();
    renderEquipments();
    renderPanel();
  }

  function setSubmitting(on) {
    const btn = $('#submit-btn');
    btn.disabled = on;
    btn.textContent = on ? '送出預約中…' : '送出預約';
    $$('.slot, .date-chip').forEach(el => { el.disabled = on; });
    $('#viewer-select').disabled = on;
  }

  function showPanelError(text) {
    const el = $('#panel-error');
    el.textContent = text;
    el.hidden = false;
  }

  function showResult(newId) {
    const eq = eqOf(selected.eq);
    const status = eq.requiresApproval ? 'pending_approval' : 'confirmed';
    records.push({ id: newId, user: viewer, eq: eq.id, date: currentDate, slot: selected.slot, status });
    const text = slotText(currentDate, selected.slot);
    selected = null;
    render();
    if (status === 'confirmed') {
      showBanner('success', `預約已成立：預約編號 ${newId}（${eq.id} ${eq.name}，${text}），狀態為「已核准／有效」。`, '查看我的預約', 'my-reservations.html');
    } else {
      showBanner('pending', `申請已送出：預約編號 ${newId}（${eq.id} ${eq.name}，${text}）目前為「待審核」，管理員核准前不占用時段。`, '查看我的預約', 'my-reservations.html');
    }
  }

  function setView(opts) {
    hideBanner();
    viewer = opts.viewer;
    currentDate = opts.date;
    selected = opts.selected || null;
    resetData(opts.changes);
    setSubmitting(false);
    render();
  }
  let timers = [];
  $('#date-chips').addEventListener('click', event => {
    const chip = event.target.closest('[data-date]');
    if (!chip) return;
    currentDate = chip.dataset.date;
    selected = null;
    hideBanner();
    render();
  });

  $('#viewer-select').addEventListener('change', event => {
    viewer = event.target.value;
    selected = null;
    hideBanner();
    render();
  });

  $('#equipment-list').addEventListener('click', event => {
    const btn = event.target.closest('.slot');
    if (!btn) return;
    const st = slotStatus(btn.dataset.eq, currentDate, btn.dataset.slot);
    if (st.key === 'available') {
      selected = { eq: btn.dataset.eq, slot: btn.dataset.slot };
      render();
      markState('selected');
      return;
    }
    selected = null;
    render();
    const text = slotText(currentDate, btn.dataset.slot);
    if (st.key === 'reschedule') {
      const q = st.request;
      const notice = $('#panel-notice');
      notice.className = 'notice notice-pending';
      notice.textContent = `${text} 是您改期申請 ${q.id} 的新時段（預約 ${q.reservationId} 原為 ${slotText(q.fromDate, q.fromSlot)}）。管理員核准前，這個時段不會替您保留，原預約照常有效。`;
      $('#panel-link').hidden = false;
    } else if (st.key === 'occupied') {
      showPanelError(`${text} 已被預約，請選擇標示「可預約」的時段。`);
    } else if (st.key === 'closed') {
      showPanelError(`${text} 已開始，請選擇尚未開始的時段。`);
    } else {
      showPanelError(`您在 ${text} 已有這台設備的預約 ${st.note}（${SLOT_META[st.key].text}），不能重複預約。`);
    }
  });

  $('#submit-btn').addEventListener('click', () => {
    hideBanner();
    if (!selected) {
      renderPanel();
      showPanelError('請先在左側點選一個標示「可預約」的固定時段。');
      markState('no-slot');
      return;
    }
    const newId = eqOf(selected.eq).requiresApproval ? 'RV-20261109-15' : 'RV-20261109-14';
    const resultKey = eqOf(selected.eq).requiresApproval ? 'pending-submitted' : 'booked';
    setSubmitting(true);
    markState('submitting');
    timers.push(setTimeout(() => { setSubmitting(false); showResult(newId); markState(resultKey); }, 900));
  });

  // 雛形狀態（ui/plan.md 第 4、5 節）
  const STATES = [
    { key: 'loading', label: '載入中', apply: () => {
      hideBanner(); $('#view-loading').hidden = false; $('#view-main').hidden = true; setUser('林雅婷（一般成員）');
    } },
    { key: 'today-self', label: '檢視今日固定時段狀態（本人視角）', apply: () => setView({ viewer: 'lin.yating', date: '2026-11-09' }) },
    { key: 'reschedule-self', label: '本人改期審核中時段（本人視角）', apply: () => setView({ viewer: 'lin.yating', date: '2026-11-11' }) },
    { key: 'reschedule-other', label: '改期審核中時段（其他成員視角）', apply: () => setView({ viewer: 'chen.guanting', date: '2026-11-11' }) },
    { key: 'released-other', label: '即時改期後原時段釋出（其他成員視角）', apply: () => {
      setView({ viewer: 'chen.guanting', date: '2026-11-10', changes: [{ id: 'RV-20261108-05', slot: 'PM' }] });
    } },
    { key: 'selected', label: '已選取可預約時段', apply: () => setView({ viewer: 'lin.yating', date: '2026-11-11', selected: { eq: 'EQ-104', slot: 'AM' } }) },
    { key: 'submitting', label: '送出預約中', apply: () => {
      setView({ viewer: 'lin.yating', date: '2026-11-11', selected: { eq: 'EQ-104', slot: 'AM' } });
      setSubmitting(true);
    } },
    { key: 'booked', label: '預約已成立', apply: () => {
      setView({ viewer: 'lin.yating', date: '2026-11-11', selected: { eq: 'EQ-104', slot: 'AM' } });
      showResult('RV-20261109-14');
    } },
    { key: 'pending-submitted', label: '待審核申請已送出', apply: () => {
      setView({ viewer: 'lin.yating', date: '2026-11-11', selected: { eq: 'EQ-102', slot: 'PM' } });
      showResult('RV-20261109-15');
    } },
    { key: 'no-slot', label: '未選擇時段', apply: () => {
      setView({ viewer: 'lin.yating', date: '2026-11-11' });
      showPanelError('請先在左側點選一個標示「可預約」的固定時段。');
    } },
    { key: 'occupied-conflict', label: '時段已被占用', apply: () => {
      setView({ viewer: 'chen.guanting', date: '2026-11-10', changes: [{ id: 'RV-20261108-05', slot: 'PM' }] });
      showBanner('danger', '預約失敗：EQ-104 微量分光光度計 Thermo NanoDrop One 2026-11-10 下午 13:00–17:00 剛被其他預約占用，請改選其他時段。');
    } }
  ];

  const protoBody = $('.proto-body');
  const protoToggle = $('.proto-toggle');
  protoBody.innerHTML = '<p>切換畫面狀態</p>' + STATES.map(s =>
    `<label><input type="radio" name="proto-state" value="${s.key}">${s.label}</label>`).join('');
  protoToggle.addEventListener('click', () => {
    protoBody.hidden = !protoBody.hidden;
    protoToggle.setAttribute('aria-expanded', String(!protoBody.hidden));
  });
  protoBody.addEventListener('change', event => applyState(event.target.value));

  function markState(key) {
    protoBody.querySelector(`input[value="${key}"]`).checked = true;
    protoToggle.textContent = '雛形狀態：' + STATES.find(s => s.key === key).label;
  }

  function applyState(key) {
    timers.forEach(clearTimeout);
    timers = [];
    STATES.find(s => s.key === key).apply();
    markState(key);
  }

  initTheme();
  applyState('today-self');
</script>
</body>
</html>
