          type: integer
          minimum: 1
          description: 本次查詢採用的頁碼
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: 本次查詢採用的每頁筆數
        totalItems:
          type: integer
          minimum: 0
          description: 符合條件的紀錄總筆數
        totalPages:
          type: integer
          minimum: 0
          description: 總頁數，沒有資料時為 0
    AdminRescheduleRequestItem:
      type: object
      description: 管理員檢視的改期申請（待審清單標示為「改期申請」，FR-005）
      required:
        - id
        - requestNumber
        - reservationId
        - reservationNumber
        - userId
        - username
        - userDisplayName
        - equipmentId
        - equipmentCode
        - equipmentName
        - equipmentRequiresApproval
        - status
        - fromReservationDate
        - fromSlot
        - toReservationDate
        - toSlot
        - createdAt
        - reviewedBy
        - reviewedByUsername
        - reviewedByDisplayName
        - reviewedAt
        - rejectReason
        - withdrawnAt
        - expiredAt
        - expireReason
      properties:
        id:
          type: string
          format: uuid
          description: 改期申請唯一識別碼
        requestNumber:
          type: string
          description: 供畫面顯示的改期申請編號（例如 RR-20261109-03）
        reservationId:
          type: string
          format: uuid
          description: 所屬預約唯一識別碼
        reservationNumber:
          type: string
          description: 所屬預約編號（例如 RV-20261108-11）
        userId:
          type: string
          format: uuid
          description: 申請成員唯一識別碼
        username:
          type: string
          description: 申請成員登入帳號
        userDisplayName:
          type: string
          description: 申請成員顯示名稱
        equipmentId:
          type: string
          format: uuid
          description: 設備唯一識別碼
        equipmentCode:
          type: string
          description: 唯一設備編號
        equipmentName:
          type: string
          description: 設備名稱
        equipmentRequiresApproval:
          type: boolean
          description: 設備目前的人工審核設定（只供參考；已送出的改期審核中申請不受切換影響，FR-008）
        status:
          $ref: '#/components/schemas/RescheduleRequestStatus'
        fromReservationDate:
          type: string
          format: date
          description: 原預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        fromSlot:
          $ref: '#/components/schemas/TimeSlotSummary'
        toReservationDate:
          type: string
          format: date
          description: 新預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        toSlot:
          $ref: '#/components/schemas/TimeSlotSummary'
        createdAt:
          type: string
          format: date-time
          description: 申請時間（ISO 8601 UTC）
        reviewedBy:
          type: [string, 'null']
          format: uuid
          description: 核准或駁回的管理員唯一識別碼（免審核即時改期、尚未審核、已撤回或已失效時為 null）
        reviewedByUsername:
          type: [string, 'null']
          description: 核准或駁回的管理員登入帳號
        reviewedByDisplayName:
          type: [string, 'null']
          description: 核准或駁回的管理員顯示名稱
        reviewedAt:
          type: [string, 'null']
          format: date-time
          description: 管理員核准或駁回的審核時間（ISO 8601 UTC；免審核即時改期、尚未審核、已撤回或已失效時為 null）
        rejectReason:
          type: [string, 'null']
          maxLength: 200
          description: 駁回原因（上限 200 字，未駁回或未填寫時為 null）
        withdrawnAt:
          type: [string, 'null']
          format: date-time
          description: 成員撤回時間（ISO 8601 UTC，未撤回時為 null）
        expiredAt:
          type: [string, 'null']
          format: date-time
          description: 失效時間（ISO 8601 UTC，未失效時為 null）
        expireReason:
          description: 失效原因（未失效時為 null）
          oneOf:
            - $ref: '#/components/schemas/RescheduleExpireReason'
            - type: 'null'
    AdminRescheduleRequestPage:
      type: object
      description: 管理員改期申請清單的分頁回應
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          description: 本頁的改期申請
          items:
            $ref: '#/components/schemas/AdminRescheduleRequestItem'
        page:
          type: integer
          minimum: 1
          description: 本次查詢採用的頁碼
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: 本次查詢採用的每頁筆數
        totalItems:
          type: integer
          minimum: 0
          description: 符合條件的改期申請總筆數
        totalPages:
          type: integer
          minimum: 0
          description: 總頁數，沒有資料時為 0
  responses:
    ValidationFailed:
      description: 請求欄位或路徑參數格式不合法（VALIDATION_FAILED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaginationOrQueryInvalid:
      description: page 或 pageSize 不合法（PAGINATION_INVALID），或其他查詢參數格式不符（VALIDATION_FAILED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LoginBadRequest:
      description: 登入欄位格式不符（VALIDATION_FAILED）、驗證碼內容或大小寫不符（CAPTCHA_MISMATCH），或驗證碼挑戰已逾期或已失效（CAPTCHA_EXPIRED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: 帳號或密碼不正確（INVALID_CREDENTIALS）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未登入或工作階段無效（UNAUTHORIZED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 已登入但角色不符（一般成員呼叫管理員操作，含核准或駁回改期申請），或操作非本人的預約或改期申請（FORBIDDEN）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 指定的設備、固定時段、預約或改期申請不存在（RESOURCE_NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CreateReservationBadRequest:
      description: 欄位格式不符（VALIDATION_FAILED）、日期不在當日起算 7 天內（DATE_OUT_OF_RANGE），或時段已開始（SLOT_ALREADY_STARTED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CreateReservationConflict:
      description: 本人在同一設備、日期與時段已有未結束預約（DUPLICATE_PENDING_OR_ACTIVE_RESERVATION）、時段已被占用或同時搶占失敗（RESERVATION_CONFLICT），或設備不可用（EQUIPMENT_UNAVAILABLE）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CancelReservationConflict:
      description: 已領取或已歸還而禁止取消（RESERVATION_ALREADY_CHECKED_OUT）、時段已開始（RESERVATION_ALREADY_STARTED）、已取消（RESERVATION_ALREADY_CANCELLED），或已駁回（INVALID_RESERVATION_STATUS）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReviewReservationBadRequest:
      description: 路徑參數或駁回原因格式不符／超過 200 字（VALIDATION_FAILED），或時段已開始（RESERVATION_ALREADY_STARTED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReviewReservationConflict:
      description: 申請已非待審核（INVALID_RESERVATION_STATUS），或核准時時段已被占用或同時搶占失敗（RESERVATION_CONFLICT）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PickupReservationBadRequest:
      description: 路徑參數格式不符（VALIDATION_FAILED）、未來日期提前領取（PICKUP_DATE_NOT_TODAY），或過去日期／時段已結束的過期預約補登領取（PICKUP_WINDOW_EXPIRED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PickupOrReturnReservationConflict:
      description: 紀錄目前狀態不允許登記領取或登記歸還（INVALID_RESERVATION_STATUS）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RescheduleBadRequest:
      description: 欄位格式不符（VALIDATION_FAILED），或新時段與原時段相同、已開始、超出當日起算 7 天，或本人在該時段已有未結束預約（RESCHEDULE_TARGET_INVALID）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CreateRescheduleConflict:
      description: 預約不是已核准／有效或原時段已開始（RESCHEDULE_NOT_ALLOWED）、新時段已被占用或同時搶占失敗（RESCHEDULE_SLOT_CONFLICT），或同一預約已有改期審核中申請、須先撤回（RESCHEDULE_ALREADY_PENDING）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RescheduleStatusConflict:
      description: 改期申請已非改期審核中（已核准、已駁回、已撤回或已失效），無法撤回或審核（INVALID_RESCHEDULE_STATUS）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApproveRescheduleConflict:
      description: 改期申請已非改期審核中，含原時段或新時段開始後已自動失效（INVALID_RESCHEDULE_STATUS），或新時段已被占用或同時搶占失敗、申請維持改期審核中（RESCHEDULE_SLOT_CONFLICT）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
