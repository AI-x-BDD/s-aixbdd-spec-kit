        requiresApproval:
          type: boolean
          description: 設備目前是否需要人工審核（false 免審核、true 需人工審核）
        updatedAt:
          type: string
          format: date-time
          description: 設備設定最後更新時間（ISO 8601 UTC）
    AdminEquipmentPage:
