        equipmentId:
          type: string
          format: uuid
          description: 要預約的設備唯一識別碼
        reservationDate:
          type: string
          format: date
          description: 預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀，須為當日起算 7 天內）
        slotId:
          type: string
          format: uuid
