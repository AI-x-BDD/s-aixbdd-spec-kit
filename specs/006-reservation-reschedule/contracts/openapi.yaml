    RescheduleRequest:
      type: object
      description: 成員檢視的一筆改期申請紀錄（FR-009）；所有改期申請完整保留，不實體刪除
      required:
        - id
        - requestNumber
        - reservationId
        - status
        - fromReservationDate
        - fromSlot
        - toReservationDate
        - toSlot
        - createdAt
        - reviewedBy
        - reviewedByDisplayName
        - reviewedAt
        - rejectReason
        - withdrawnAt
        - expiredAt
        - expireReason
        - canWithdraw
      properties:
        id:
          type: string
          format: uuid
          description: 改期申請唯一識別碼
        requestNumber:
          type: string
          description: 供畫面顯示的改期申請編號（例如 RR-20261109-02）
        reservationId:
          type: string
          format: uuid
          description: 所屬預約唯一識別碼
        status:
          $ref: '#/components/schemas/RescheduleRequestStatus'
        fromReservationDate:
          type: string
          format: date
          description: 原預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        fromSlot:
          $ref: '#/components/schemas/TimeSlotSummary'
        toReservationDate:
          type: string
          format: date
          description: 新預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        toSlot:
          $ref: '#/components/schemas/TimeSlotSummary'
        createdAt:
          type: string
          format: date-time
          description: 申請時間（ISO 8601 UTC）
        reviewedBy:
          type: [string, 'null']
          format: uuid
          description: 核准或駁回的管理員唯一識別碼（免審核即時改期、尚未審核、已撤回或已失效時為 null）
        reviewedByDisplayName:
          type: [string, 'null']
          description: 核准或駁回的管理員繁體中文顯示名稱（reviewedBy 為 null 時為 null）
        reviewedAt:
          type: [string, 'null']
          format: date-time
          description: 管理員核准或駁回的審核時間（ISO 8601 UTC；免審核即時改期、尚未審核、已撤回或已失效時為 null）
        rejectReason:
          type: [string, 'null']
          maxLength: 200
          description: 管理員駁回時選填的駁回原因（上限 200 字，其餘為 null）
        withdrawnAt:
          type: [string, 'null']
          format: date-time
          description: 成員撤回時間（ISO 8601 UTC，未撤回時為 null）
        expiredAt:
          type: [string, 'null']
          format: date-time
          description: 失效時間（ISO 8601 UTC，未失效時為 null）；因時段開始而失效時為該時段開始時間，不是被查詢到的時間
        expireReason:
          description: 失效原因（未失效時為 null）
          oneOf:
            - $ref: '#/components/schemas/RescheduleExpireReason'
            - type: 'null'
        canWithdraw:
          type: boolean
          description: 成員目前是否可撤回此申請（只有 status 為 pending_approval 時為 true）
    PendingRescheduleSummary:
      type: object
      description: 預約目前「改期審核中」申請的摘要（同一預約最多一筆，FR-004）
      required: [id, requestNumber, toReservationDate, toSlot, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 改期申請唯一識別碼
        requestNumber:
          type: string
          description: 供畫面顯示的改期申請編號（例如 RR-20261109-04）
        toReservationDate:
          type: string
          format: date
          description: 新預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀）
        toSlot:
          $ref: '#/components/schemas/TimeSlotSummary'
        createdAt:
          type: string
          format: date-time
          description: 申請時間（ISO 8601 UTC）
    Reservation:
      type: object
      description: 成員本人的預約借還紀錄（6 種狀態，含領取與歸還資訊），本次新增可改期判斷、改期審核中摘要與改期紀錄；改期成功時 id、reservationNumber 與 status 不變，只有 reservationDate 與時段欄位改到新時段
      required:
        - id
        - reservationNumber
        - userId
        - equipmentId
        - equipmentCode
        - equipmentName
        - equipmentCategory
        - equipmentRequiresApproval
        - reservationDate
        - slotId
        - slotName
        - slotStartTime
        - slotEndTime
        - slotSortOrder
        - status
        - reviewedBy
        - reviewedByDisplayName
        - reviewedAt
        - rejectReason
        - checkedOutAt
        - checkedOutByUserId
        - checkedOutByName
        - returnedAt
        - returnedByUserId
        - returnedByName
        - canCancel
        - createdAt
        - cancelledAt
        - canReschedule
        - pendingRescheduleRequest
        - rescheduleRequests
      properties:
        id:
          type: string
          format: uuid
          description: 預約借用紀錄唯一識別碼
        reservationNumber:
          type: string
          description: 供畫面顯示的預約編號（例如 RV-20261108-03），改期後不變
        userId:
          type: string
          format: uuid
          description: 預約成員唯一識別碼
        equipmentId:
          type: string
          format: uuid
          description: 設備唯一識別碼
        equipmentCode:
          type: string
          description: 唯一設備編號（例如 EQ-101）
        equipmentName:
          type: string
          description: 設備名稱
        equipmentCategory:
          type: string
          description: 設備分類
        equipmentRequiresApproval:
          type: boolean
          description: 設備目前是否需要人工審核（false 免審核、true 需人工審核），決定送出改期時即時改期或進入改期審核
        reservationDate:
          type: string
          format: date
          description: 目前預約日期（YYYY-MM-DD，依 Asia/Taipei 業務時區解讀），改期成功後為新日期
        slotId:
          type: string
          format: uuid
          description: 目前固定時段唯一識別碼，改期成功後為新時段
        slotName:
          type: string
          enum: [上午, 下午, 晚間]
          description: 固定時段名稱
        slotStartTime:
          type: string
          enum: ['09:00', '13:00', '18:00']
          description: 固定時段開始時間（HH:mm，依 Asia/Taipei 業務時區解讀）
