          type: string
          enum: ['12:00', '17:00', '21:00']
          description: 固定時段結束時間（HH:mm，依 Asia/Taipei 業務時區解讀）
        slotSortOrder:
          type: integer
          minimum: 1
          maximum: 3
          description: 固定時段排序順序（1 上午、2 下午、3 晚間）
        status:
          $ref: '#/components/schemas/ReservationStatus'
        reviewedBy:
          type: [string, 'null']
          format: uuid
          description: 預約申請的審核管理員唯一識別碼（免審核直接成立或尚未審核時為 null；不因改期而改變）
        reviewedByDisplayName:
          type: [string, 'null']
          description: 預約申請的審核管理員顯示名稱（免審核直接成立或尚未審核時為 null）
        reviewedAt:
          type: [string, 'null']
          format: date-time
          description: 預約申請的審核時間（ISO 8601 UTC，免審核直接成立或尚未審核時為 null；不因改期而改變）
        rejectReason:
          type: [string, 'null']
          maxLength: 200
          description: 預約申請被駁回時的選填原因（上限 200 字，其餘為 null）
        checkedOutAt:
          type: [string, 'null']
          format: date-time
          description: 實際領取時間（ISO 8601 UTC，尚未領取時為 null）
        checkedOutByUserId:
          type: [string, 'null']
          format: uuid
          description: 登記領取的經手管理員唯一識別碼（尚未領取時為 null）
        checkedOutByName:
          type: [string, 'null']
          description: 登記領取的經手管理員顯示名稱（尚未領取時為 null）
        returnedAt:
          type: [string, 'null']
          format: date-time
          description: 實際歸還時間（ISO 8601 UTC，尚未歸還時為 null）
        returnedByUserId:
          type: [string, 'null']
          format: uuid
          description: 登記歸還的經手管理員唯一識別碼（尚未歸還時為 null）
        returnedByName:
          type: [string, 'null']
          description: 登記歸還的經手管理員顯示名稱（尚未歸還時為 null）
        canCancel:
          type: boolean
          description: 成員目前是否可取消（沿用 005：status 為 pending_approval 或尚未領取的 confirmed，且時段尚未開始時為 true）
        createdAt:
          type: string
          format: date-time
          description: 預約建立時間（ISO 8601 UTC），改期後不變
        cancelledAt:
          type: [string, 'null']
          format: date-time
          description: 預約取消時間（ISO 8601 UTC，未取消時為 null）
        canReschedule:
          type: boolean
          description: 成員目前是否可申請改期（FR-001、FR-004：status 為 confirmed、原時段尚未開始，且沒有改期審核中申請時為 true）
        pendingRescheduleRequest:
          description: 目前「改期審核中」的改期申請摘要，畫面據此標示「改期審核中」；沒有時為 null
          oneOf:
            - $ref: '#/components/schemas/PendingRescheduleSummary'
            - type: 'null'
        rescheduleRequests:
          type: array
          description: 此預約的全部改期紀錄（FR-009），依 createdAt 由新到舊（DESC）、相同時依 id 由小到大（ASC）排序；沒有改期紀錄時為空陣列
